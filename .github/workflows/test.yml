name: Test

# 單元測試（node --test，不上網、幾秒跑完）。**獨立於部署**：pages.yml 不等這一支。
# **瀏覽器測試（Playwright）禁止在 GitHub CI 跑**（使用者 2026-10-26）：每次要下載 Chromium 與系統套件，
# 慢的時候一跑十幾分鐘、還會卡住。只在本機跑：npm run test:browser。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # App repo 不在 CI 上：黃金檔一致性那一條會略過並印出原因，其他照跑。
      - run: npm run test:unit
