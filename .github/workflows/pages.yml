name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # 每天重產一次「我的遊記」（tools/journals.mjs）與公告（tools/announcements.mjs），部落格的新遊記、gist 的新公告隔天就上官網
  schedule:
    - cron: '0 20 * * *'

# 預設只讀；發佈要的兩個寫入權限只給 deploy 這一個 job。
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      pages: write      # actions/deploy-pages 發佈
      id-token: write   # actions/deploy-pages 向 Pages 證明這次部署來自這個 workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # 純靜態網站，沒有建置步驟。只做四件事：重產遊記與公告、把「要發佈的」複製到 _site/、
      # 把 _site 裡每個 HTML 檔的內部連結對一次（斷掉或指到沒發佈的東西就讓 build 紅）。
      - name: Build travel journals
        run: node tools/journals.mjs

      # 公告：App 的公告 gist＋官網專用的公告 gist（都是 secret，網址只放在 Actions secret），合併、依日期排序
      # → assets/data/announcements.json 與 /announcements/×4。抓不到就沿用 repo 裡的快照，不擋部署。
      # gist 改了要馬上上：手動跑一次這個 workflow。
      - name: Build announcements
        env:
          TEZ_ANNOUNCEMENTS_URL: ${{ secrets.TEZ_ANNOUNCEMENTS_URL }}
          TEZ_WEB_ANNOUNCEMENTS_URL: ${{ secrets.TEZ_WEB_ANNOUNCEMENTS_URL }}
        run: node tools/announcements.mjs

      # 白名單在 tools/stage-pages.mjs（安全稽核 I6）：根目錄有沒分類的新項目會在這裡紅。
      - name: Stage published files
        run: node tools/stage-pages.mjs _site

      - name: Check internal links
        working-directory: _site
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r page; do
            # 一條站內連結都沒有的頁面（例如 /android-auth/）：grep 回 1，在 pipefail 底下會被當成斷連結。
            { grep -oE '(href|src)="/[^"#?]*"' "$page" || true; } \
              | sed -E 's/^(href|src)="//; s/"$//' \
              | sort -u \
              | while IFS= read -r link; do
                  target=".${link}"
                  [ "${link: -1}" = "/" ] && target=".${link}index.html"
                  if [ ! -e "$target" ]; then
                    echo "::error file=${page}::broken internal link ${link}"
                    exit 1
                  fi
                done || fail=1
          done < <(find . -name '*.html' -not -path './.git/*')
          [ "$fail" -eq 0 ]

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
