<title>資料・掃描 QR Code</title>
<!--
  資料 › 工具 › 掃描 QR Code（App：Modules/Widgets/…/Scan/ScannerViewController.swift ＋ ScannerPanel.swift ＋
  ScanHistoryViewController.swift；設計稿 ui-card-v130.html 第 4 節）。1.3.0 起點了直接開滿版相機（一般模式），
  相機底下一塊實心面板：「掃描紀錄」長方形鈕（＋免費版一條原生廣告）；紀錄是一張 modal（nav controller＋標題＋✕）。
  參數：?lang=zh-Hant-TW|en|ja
        &hist=1（點了「掃描紀錄」那一刻：紀錄紙開著）
        &shared=0（紀錄紙：獨自一人——標題下寫筆數、列上不寫是誰；預設共編中：籌碼＋每一列的「誰」）
        &ad=1（免費版：面板裡多一條原生廣告橫幅；預設不畫——官網其他畫面也都不畫廣告，內容是範例）
        &from=notes|shop（互動模式：✕ 回到哪一格；預設筆記）
  相機頁整頁固定深色。面板照 ScannerViewController.Metrics（panel*／history*）；取景框 250、中心＝相機區（面板以上）高度的 44%；
  兩顆圓鈕在面板上緣往上 20；左上 ✕（44 圓、黑 45%）、標題 lg semibold 白。
  取景框裡那張紙與上面的 QR 是畫的（不是真的碼）；紀錄四筆是範例，寫在底下的 SAMPLE。
-->
<link rel="stylesheet" href="screen.css?v=7e1e128cfb">
<style>
  .ic { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  .device { background: #0d0b0a; color: #fff; }

  /* ── 相機（ScannerViewController.Metrics） ── */
  .cam { position: absolute; inset: 0; overflow: hidden; }
  .cam .scene { position: absolute; inset: -20px; background: radial-gradient(ellipse at 40% 35%, #5a5148 0%, #2c2722 45%, #141110 100%); filter: blur(1px); }
  .cam .paper { position: absolute; left: 116px; width: 170px; height: 190px; border-radius: 6px; background: #ece7df;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); transform: rotate(-3deg); }
  .cam .paper svg { position: absolute; left: 21px; top: 21px; width: 128px; height: 128px; }
  .cam .paper b { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font: 500 11px/14px var(--font); color: #5a4e44; }
  .cam .dimmed { position: absolute; left: 76px; width: 250px; height: 250px; border-radius: 16px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); }
  .cam .vf { position: absolute; left: 76px; width: 250px; height: 250px; color: #fff; }
  .cam .vf i { position: absolute; width: 40px; height: 40px; border: 4px solid currentColor; }
  .cam .vf i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 16px; }
  .cam .vf i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 16px; }
  .cam .vf i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 16px; }
  .cam .vf i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 16px; }
  /* ✕：安全區＋4、左 16、44 圓、黑 45%、✕ 18／2.2 白；標題 lg semibold 白，對 ✕ 垂直置中 */
  .cam .x { position: absolute; left: 16px; top: 66px; width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,.45); display: grid; place-items: center; color: #fff; }
  .cam .x svg { width: 18px; height: 18px; stroke-width: 2.2; }
  .cam .tt { position: absolute; left: 70px; right: 70px; top: 78px; text-align: center; color: #fff; font: 600 var(--t-lg)/20px var(--font); text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  /* 提示：框下 16、左右 24、sm 白 */
  .cam .hint { position: absolute; left: 24px; right: 24px; text-align: center; color: #fff; font: 400 var(--t-sm)/18px var(--font); text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  /* 圓鈕（CameraRoundButton）：46、黑 50%、白 22% 框、圖示 24／1.7；字 xs 白、間 8；兩顆間距 72；開著反白 */
  .cam .bts { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 72px; }
  .cam .bts > div { display: flex; flex-direction: column; align-items: center; gap: 8px; color: #fff; font: 400 var(--t-xs)/14.3px var(--font); }
  .cam .bts b { width: 46px; height: 46px; border-radius: 50%; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.22); display: grid; place-items: center; }
  .cam .bts svg { width: 24px; height: 24px; stroke-width: 1.7; }
  .cam .bts .on b { background: #fff; border-color: transparent; color: #1f1914; }

  /* ── 面板（.cam-panel）：底同相機頁、上緣 1pt 白 10%；上 13、左右 16、下＝安全區＋8；間距 12 ── */
  .panel { position: absolute; left: 0; right: 0; bottom: 0; background: #0d0b0a; border-top: 1px solid rgba(255,255,255,.1);
    padding: 12px 16px 42px; display: flex; flex-direction: column; gap: 12px; }
  /* 「掃描紀錄」鈕（ScannerHistoryButton）：最矮 48、圓角 8、白 10% 底、白 22% 框；上下 8 左右 16、間距 12；
     時鐘 20／1.8、字 base semibold 白、筆數 sm 白 65%、› 12／2.2 */
  .hist-btn { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 7px 15px; border-radius: 8px;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); color: #fff; }
  .hist-btn > svg:first-child { width: 20px; height: 20px; stroke-width: 1.8; flex: none; }
  .hist-btn b { flex: 1; font: 600 var(--t-base)/18px var(--font); }
  .hist-btn .n { font: 400 var(--t-sm)/16px var(--font); color: rgba(255,255,255,.65); }
  .hist-btn .chev { width: 12px; height: 12px; stroke-width: 2.2; color: rgba(255,255,255,.65); flex: none; }
  /* 廣告（ad=1）：AdSlotStyle.banner（NativeAdBannerView）；這一頁固定深色，殼用深色那一半的 tzSurface／tzBorder */
  .adb { position: relative; display: flex; align-items: center; gap: 10px; padding: 12px; background: #221c17; border: 1px solid #382f27; border-radius: 8px; }
  .adb .aic { flex: none; width: 40px; height: 40px; border-radius: 4px; background: linear-gradient(135deg, #e9a535, #c14b3c); }
  .adb .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .adb .tl { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .adb .bd { flex: none; font: 400 var(--t-xs)/14.3px var(--font); color: #a2958a; }
  .adb .hd { font: 600 var(--t-sm)/15.5px var(--font); color: #f3ede5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .adb .by, .adb .who { font: 400 var(--t-xs)/14.3px var(--font); color: #a2958a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .adb .who { color: #b3a69b; }
  .adb .cta { flex: none; font: 600 var(--t-xs)/14.3px var(--font); color: #7ad7d4; padding-right: 14px; }
  .adb .ac { position: absolute; right: 4px; top: 4px; width: 14px; height: 14px; border-radius: 3px; background: rgba(162,149,138,.25); color: #b3a69b;
    font: 600 9px/14px var(--font); text-align: center; }

  /* ── 紀錄紙（ScanHistorySheet：nav controller＋標題「掃描紀錄」＋✕；中／大兩段、開在大）── */
  .hs-body { position: absolute; left: 0; right: 0; top: 60px; bottom: 0; padding: 0 20px 32px; overflow: hidden; color: var(--ink); }
  .hs .tz-x { left: 350px; top: 20px; }
  /* HeadCell：上 3、下 2、高 ≥44（清除的命中區）、間距 8；共編時一顆籌碼、獨自時寫筆數；右邊「清除」xs semibold */
  .head { display: flex; align-items: center; gap: 8px; margin-top: 3px; min-height: 44px; margin-bottom: 2px; }
  .head-t { font: 400 var(--t-xs)/14.3px var(--font); color: var(--muted); white-space: nowrap; }
  .tag { display: flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; background: #e2f0ef;
    color: var(--accent-ink); font: 600 var(--t-xs)/14.3px var(--font); white-space: nowrap; min-width: 0; overflow: hidden; }
  .tag svg { width: 13px; height: 13px; stroke-width: 2; flex: none; }
  .tag span { overflow: hidden; text-overflow: ellipsis; }
  .words { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .head.stacked { padding: 4px 0; }
  .head.stacked .words { flex-direction: column; align-items: flex-start; }
  .head.stacked .tag { white-space: normal; }
  .clear { margin-left: auto; font: 600 var(--t-xs)/14.3px var(--font); color: var(--muted-on-sunken); flex: none; }
  /* 一列（ScanHistoryRowCell：最矮 52、上下 8、左右 3、間距 12；類型格 34／圓角 8；頭像 17） */
  .row { position: relative; display: flex; align-items: center; gap: 12px; padding: 8px 3px; min-height: 52px; }
  .row + .row::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; border-top: 1px solid var(--border-soft); }
  .ty { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; flex: none; }
  .ty svg { width: 18px; height: 18px; stroke-width: 1.8; }
  .ty.url { background: #e2f0ef; color: var(--accent-ink); }
  .ty.url svg { stroke-width: 1.9; }
  .ty.text { background: var(--sunken); color: var(--muted-on-sunken); }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .ct { font: 400 var(--t-base)/17.9px var(--font); letter-spacing: -.24px; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; }
  .ct .lat { word-break: break-all; }
  .ct b { font-weight: 600; }
  /* 中日文頁的 -apple-system 會拿 PingFang 畫「-」，寬了一倍；system-ui 才是 SF（同 chrome.js fmt() 的「–」問題） */
  .lat, .lat code { font-family: system-ui, -apple-system, sans-serif; }
  .ct code { font: 400 var(--t-xs)/17.9px var(--font); color: var(--muted); font-variant-numeric: tabular-nums; }
  .meta { display: flex; align-items: center; gap: 4px; height: 17px; font: 400 var(--t-xs)/14.3px var(--font); color: var(--muted); white-space: nowrap; }
  .av { width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; color: #fff;
    font: 700 var(--t-xs)/1 var(--font); flex: none; background: var(--sw-base); }
  .chev2 { width: 12px; height: 12px; color: var(--muted); stroke-width: 2.2; flex: none; }
  /* 空狀態（EmptyCell）：上 32、左右 16；scan 圖示 40／1.4 muted-faint、間 12；sm muted 置中 */
  .empty { padding: 32px 16px 0; text-align: center; white-space: pre-line; font: 400 var(--t-sm)/20px var(--font); color: var(--muted); }
  .empty svg { display: block; width: 40px; height: 40px; margin: 0 auto 12px; stroke-width: 1.4; color: var(--muted-faint); }
  /* 深色（ADR-0050）：相機畫面本來就是深的；結果紙與紀錄紙跟著色票 */
  html[data-theme="dark"] .tag, html[data-theme="dark"] .ty.url, html[data-theme="dark"] .rs-kind .url { background: color-mix(in srgb, var(--accent) 18%, var(--card)); }
  html[data-theme="dark"] .row.flash { background: color-mix(in srgb, var(--accent) 18%, var(--card)); }
  html[data-theme="dark"] .rs-open, html[data-theme="dark"] .seg2 .primary { color: var(--on-accent); }
  html[data-theme="dark"] .rs-note.ok { color: var(--success-ink); } html[data-theme="dark"] .rs-note.warn { color: var(--warning-ink); }

// 一張看起來像 QR Code 的圖（隨機但固定的 21×21 格，三個定位角）；seed 換一個就是另一張
const qr = (seedN = 7) => {
  let cells = '';
  const rnd = () => (seedN = (seedN * 9301 + 49297) % 233280) / 233280;
  const finder = (x, y) => (x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13);
  for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) if (!finder(x, y) && rnd() > .52) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  const f = (x, y) => `<path d="M${x} ${y}h7v7h-7zM${x + 1} ${y + 1}v5h5v-5z" fill-rule="evenodd"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3"/>`;
  return `<svg viewBox="0 0 21 21" fill="#1f1914" shape-rendering="crispEdges">${f(0, 0)}${f(14, 0)}${f(0, 14)}${cells}</svg>`;
};

  // ScanRecordRepository.record
  const record = (content) => {
    const i = st.records.findIndex(r => r.content === content);
    const now = Date.now();
    if (i >= 0) {
      const prev = st.records[i];
      const whoName = prev.who === 'me' ? X.you : MATE[0];
      const dt = md.format(new Date(prev.at));
      st.records.splice(i, 1);
      st.records.unshift({ content, who: 'me', at: now });
      return { tone: 'warn', note: isURL(content) ? X.movedUrl(dt, whoName) : X.movedText(dt, whoName) };

    st.records.unshift({ content, who: 'me', at: now });

    }, away ? 1150 : 250);
  });
  cam.querySelector('[data-btn="torch"]').addEventListener('click', (e) => e.currentTarget.classList.toggle('on'));
  cam.querySelector('.x').addEventListener('click', () => go(params.get('from') || 'notes'));

  // ── 紀錄紙 ──
  const openHistory = () => {
    const sh = sheet(d, histSheetHTML([]));
    sh.el.classList.add('hs');
    const body = sh.el.querySelector('.hs-body');
    const paint = (flash) => {
      body.innerHTML = listHTML(st.records.map(toRow));
      stackHead(sh.el);
      if (flash !== undefined) { const el = body.querySelector(`.row[data-r="${flash}"]`); el?.classList.add('flash'); setTimeout(() => el?.classList.remove('flash'), 900); }
    };
    paint();
    sh.el.querySelector('.tz-x').addEventListener('click', () => sh.close());
    body.addEventListener('click', (e) => {
      if (e.target.closest('.clear')) {
        return alert(d, { title: X.clearTitle, message: shared ? X.clearShared : X.clearSolo, actions: [
          { label: X.cancel, style: 'cancel', preferred: true },
          { label: s.clear, style: 'destructive', run: () => { st.records = []; save(); paint(); } },
        ] });
      }
      const row = e.target.closest('.row[data-r]');
      if (row) {
        const r = st.records[+row.dataset.r];
        const w = r.who === 'me' ? s.me : MATE[0];
        const t = r.label || X.today(hm.format(new Date(r.at)));
        showResult(r.content, { meta: shared ? X.meta(w, t) : t });
      }
    });
    return sh;
  };
  d.querySelector('.hist-btn').addEventListener('click', openHistory);
  paintCount();
  // 首頁自動示範一輪的最後一步：紀錄回到範例那四筆、紙回到框裡（掃描紀錄存在 sessionStorage，不歸零下一輪會接著長）
  window.__auto = { reset: () => {
    st.records = JSON.parse(seed0); st.n = 0; save();
    paper.classList.remove('away'); paper.querySelector('.qr').innerHTML = qr(); cam.classList.remove('hit'); busy = false;
  } };
}
</script>
</body>
</html>
