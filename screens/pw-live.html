  卡片、字串、狀態判斷全部沿用 screens/lock.html（App：TripEZGoWidget/Views/TripActivityCard.swift、ActivityPieces.swift、
  Modules/LiveActivity/…/TripActivityContent.swift；字串 Scripts/i18n/maps/LiveActivity.json），差別只有：
  沒有通知、沒有撥時間的拉桿，時間自己往前走——進行中 → 即將開始 → 移動中（步行路程倒數）→ 下一個行程進行中。
  參數：?lang= &theme=dark &still=1（靜止那一幀＝10:03 進行中）&bare=1（只畫卡片本身，不要桌布、時鐘、狀態列）&nohand=1。自動示範 auto=pw-live：呼叫 __auto.advance() 跳到下一個時刻。

<link rel="stylesheet" href="screen.css?v=7e1e128cfb">
<style>
  /* ActivityTheme：onDark＝tzOnDeep #fff、onDarkMuted 62%、onDarkSoft 86%、accentLift＝tzBrandTeal、scrim＝tzInkDeep */
  :root { --on-dark: #fff; --on-dark-muted: rgba(255,255,255,.62); --on-dark-soft: rgba(255,255,255,.86);
    --scrim: 31,25,20; --hairline: rgba(255,255,255,.14); }
  .device { background: #6aa6d8 url(img/share-wallpaper.jpg) center / cover no-repeat; color: #fff; }
  /* 系統在時鐘與底部那一排後面壓的一層淡暗，讓白字讀得到 */
  .dim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.16) 0%, rgba(0,0,0,.04) 38%, rgba(0,0,0,0) 60%, rgba(0,0,0,.18) 100%); }
  .sb-time { display: none; }

  .clock { position: absolute; left: 0; right: 0; top: 92px; text-align: center; }

    letter-spacing: -2px; font-variant-numeric: tabular-nums; color: rgba(255,255,255,.88);
    text-shadow: 0 1px 24px rgba(0,40,80,.18); }

  /* 即時動態卡：系統給的外框（左右 20、圓角 22），activityBackgroundTint＝scrim 74% ＋ 系統材質 */
  .la { position: absolute; left: 20px; right: 20px; bottom: 132px; border-radius: 22px; overflow: hidden;
    background: rgba(var(--scrim), .74); -webkit-backdrop-filter: blur(24px) saturate(140%); backdrop-filter: blur(24px) saturate(140%);
    padding: 14px 16px 15px; color: var(--on-dark); }
  .la-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .la-icon { flex: none; width: 20px; height: 20px; border-radius: 5px; background: var(--accent); display: grid; place-items: center; }
  .la-icon svg { width: 13px; height: 13px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .la-app { flex: 1 1 auto; min-width: 0; font-size: 12px; line-height: 18px; letter-spacing: .24px; color: var(--on-dark-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .la-day { flex: none; font-size: 11px; line-height: 16.5px; letter-spacing: .66px; color: var(--on-dark-muted); font-variant-numeric: tabular-nums; }
  .la-refresh { flex: none; width: 28px; height: 28px; margin: -5px -6px -5px 0; display: grid; place-items: center; }

    letter-spacing: .66px; color: var(--on-dark-muted); }
  .la-state i { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
  .la-title { font: 700 20px/24px var(--font); letter-spacing: .1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .la-sub { margin-top: 3px; font-size: 12px; line-height: 18px; letter-spacing: .24px; color: var(--on-dark-muted);

  .la-count { flex: none; text-align: right; }
  .la-n { font: 700 22px/26px var(--font); font-variant-numeric: tabular-nums; }

  .la-ends { margin-top: 6px; display: flex; justify-content: space-between; font-size: 11px; line-height: 16.5px;

  .la-next { margin-top: 10px; display: flex; align-items: center; gap: 6px; }

    background: rgba(255,255,255,.2); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.35); }
  .qa svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ── 互動模式才用得到的（截圖模式不會產生這些元素） ── */
  .is-interactive .la { touch-action: pan-y; cursor: ew-resize; user-select: none; -webkit-user-select: none; }
  .is-interactive .la-refresh { cursor: pointer; }

  @keyframes la-spin { to { transform: rotate(360deg); } }

  .la-gl svg { display: block; width: 16px; height: 16px; }
  .la-gl svg.ln { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .la-gl svg.mk { fill: currentColor; fill-rule: evenodd; }
  .la-gl svg.dots { fill: currentColor; }
  /* ActivityAltRow：上距 7、圖示 12、字 11、字距 .22；趕不上整行轉琥珀加粗 */
  .la-alt { margin-top: 7px; display: flex; align-items: center; gap: 6px; font-size: 11px; line-height: 16.5px; letter-spacing: .22px;
    color: var(--on-dark-muted); white-space: nowrap; overflow: hidden; }
  .la-alt span { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .la-alt svg { flex: none; width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .la-alt.warn { color: var(--warning); font-weight: 600; }
  /* 撥時間的那一條（互動模式才有）：放在手電筒與相機中間，長相照 iOS 媒體播放的玻璃進度條——細軌、白色已走、小圓把手 */
  .lk-scrub[hidden] { display: none; }
  .lk-scrub { position: absolute; left: 110px; right: 110px; bottom: 52px; height: 50px; display: flex; flex-direction: column;
    justify-content: center; gap: 7px; touch-action: none; cursor: pointer; outline: none; user-select: none; -webkit-user-select: none; }
  .lk-scrub-t { text-align: center; font: 600 13px/16px var(--font); font-variant-numeric: tabular-nums; color: rgba(255,255,255,.92);
    text-shadow: 0 1px 6px rgba(0,30,60,.3); }
  .lk-scrub-track { position: relative; height: 6px; border-radius: 3px; background: rgba(255,255,255,.28);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.35); }
  .lk-scrub-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }   /* 主題色（使用者 2026-10-12） */
  .lk-scrub-thumb { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 2px #fff, 0 1px 4px rgba(0,0,0,.25); transition: transform .15s; }
  .lk-scrub.active .lk-scrub-thumb { transform: scale(1.35); }
  .lk-scrub:focus-visible .lk-scrub-track { box-shadow: 0 0 0 2px rgba(255,255,255,.8); }

  .lk-col { position: absolute; left: 20px; right: 20px; bottom: 132px; max-height: 498px; display: flex; flex-direction: column;
    gap: 8px; overflow-y: auto; scrollbar-width: none; }
  .lk-col::-webkit-scrollbar { display: none; }
  .lk-col > :first-child { margin-top: auto; }
  .lk-col .la { position: relative; left: auto; right: auto; bottom: auto; flex: none; }
  .nt { display: none; }
  html[data-theme="dark"] .dim { background: linear-gradient(180deg, rgba(0,0,0,.42) 0%, rgba(0,0,0,.34) 38%, rgba(0,0,0,.30) 60%, rgba(0,0,0,.46) 100%); }
  /* ?bare=1（導購頁卡片用）：只留即時動態卡本身，不要桌布、時鐘、狀態列、快捷鈕；卡片放在頁面底色上，狀態照常往前走 */
  html.bare .device { background: none !important; }
  html.bare .dim, html.bare .clock, html.bare .qa, html.bare .sb, html.bare .home, html.bare .lk-scrub { display: none !important; }
  html.bare .lk-col { top: 440px; bottom: auto; max-height: none; overflow: visible; }
  html.bare .lk-col > :first-child { margin-top: 0; }
</style>

<div class="device" id="d"><div class="dim"></div></div>
<script type="module">
import { fmt, lang, params, loadTrip, chrome, toMin, ready, interactive, duration, loadCategories, categoryName, still } from './chrome.js';

const d = document.getElementById('d');
const trip = await loadTrip();
const dayNo = +(params.get('day') || 2);
const now = params.get('now') || '10:03';
const start = new Date((params.get('start') || '2026-10-10') + 'T00:00:00');
const date = new Date(start.getTime() + (dayNo - 1) * 864e5);

// LiveActivity.json（逐字）；鎖定畫面日期是系統格式
const S = {
  'zh-Hant-TW': { day: n => `第 ${n} 天`, live: '進行中', remain: '還剩', next: x => `下一站 · ${x}`,
    date: dt => `${dt.getMonth() + 1}月${dt.getDate()}日 ${['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][dt.getDay()]}` },
  en: { day: n => `Day ${n}`, live: 'Now', remain: 'Ends in', next: x => `Next · ${x}`,
    date: dt => `${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][dt.getDay()]}, ${['January','February','March','April','May','June','July','August','September','October','November','December'][dt.getMonth()]} ${dt.getDate()}` },
  ja: { day: n => `${n}日目`, live: '進行中', remain: '残り', next: x => `次 · ${x}`,
    date: dt => `${dt.getMonth() + 1}月${dt.getDate()}日 ${'日月火水木金土'[dt.getDay()]}曜日` },
  // ko：LiveActivity.json＋domain.itinerary.daylabel；日期照 DateFormatter MMMMEEEEd 在 ko（「10월 11일 일요일」）
  ko: { day: n => `${n}일차`, live: '진행 중', remain: '남은 시간', next: x => `다음 · ${x}`,
    date: dt => `${dt.getMonth() + 1}월 ${dt.getDate()}일 ${'일월화수목금토'[dt.getDay()]}요일` },
}[lang];

// TripActivityContent.live：現在進行中的那一則、下一則
const events = trip.days.find(x => x.day === dayNo).events.filter(e => e.start && e.end);
const nowMin = toMin(now);
const i = events.findIndex(e => toMin(e.start) <= nowMin && nowMin < toMin(e.end));
const cur = events[i], next = events[i + 1];
const left = (toMin(cur.end) - nowMin) * 60 - 12;              // Text(timerInterval:) 在跑：差 12 秒的那一幀
const countdown = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
const fraction = (nowMin + 12 / 60 - toMin(cur.start)) / (toMin(cur.end) - toMin(cur.start));
const [hh, mm] = now.split(':');

const brand = '<circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/><path d="M6 8.4v4.2a3.4 3.4 0 0 0 3.4 3.4h5.2"/>';
const refresh = '<path d="M12 4.5A7.5 7.5 0 1 1 5.32 8.6M12 1.5v3M8.6 4.5H12V8"/>';
const nextStop = '<path d="M5 12h11M12 8l4 4-4 4"/><circle cx="19.4" cy="12" r="1.6"/>';

d.insertAdjacentHTML('beforeend', `
  <div class="clock"><div class="date">${S.date(date)}</div><div class="time">${+hh}:${mm}</div></div>
  <div class="lk-col"><div class="la">
    <div class="la-head"><span class="la-icon"><svg viewBox="0 0 24 24">${brand}</svg></span>
      <span class="la-app">TripEZGo · ${fmt(trip.title)}</span><span class="la-day">${S.day(dayNo)}</span>
      <span class="la-refresh"><svg viewBox="0 0 24 24">${refresh}</svg></span></div>
    <div class="la-main">
      <div class="la-l"><div class="la-state"><i></i>${S.live}</div>
        <div class="la-title">${fmt(cur.title)}</div>
        <div class="la-sub">${fmt(`${cur.start} – ${cur.end}`)}${cur.place ? ' · ' + fmt(cur.place.name) : ''}</div></div>
      <div class="la-count"><div class="la-n">${countdown}</div><div class="la-u">${S.remain}</div></div>
    </div>
    <div class="la-bar"><span style="width:${(fraction * 100).toFixed(1)}%"></span></div>
    <div class="la-ends"><span>${cur.start}</span><span>${cur.end}</span></div>
    ${next ? `<div class="la-rule"></div><div class="la-next"><svg viewBox="0 0 24 24">${nextStop}</svg>
      <span class="nm">${fmt(S.next(next.title))}</span><span class="tm">${next.start}</span></div>` : ''}
  </div></div>
  <div class="qa" style="left:46px"><svg viewBox="0 0 24 24"><path d="M9 3h6v4l-1.6 2.2v11.3h-2.8V9.2L9 7z"/><path d="M12 12.5v2"/></svg></div>
  <div class="qa" style="right:46px"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.6"/><path d="M9 7l1.4-2.4h3.2L15 7"/></svg></div>`);



chrome(d, { dark: true });
ready();

if (interactive && !still) {
  const LS = {
    'zh-Hant-TW': { live: '進行中', remaining: '還剩', nextStop: x => `下一站 · ${x}`, upcoming: '即將開始', untilStart: '後開始',
      now: '現在', startsAt: x => `${x} 開始`, beforeLeaving: x => `出發前 · ${x}`, moving: '移動中', untilArrival: '後抵達',
      leavesAt: x => `${x} 出發`, arrivesAt: x => `${x} 抵達`, destination: x => `目的地 · ${x}`, tooTight: '趕不上',
      legTravel: x => `路程 ${x}`, runTravel: (k, x) => `${k} · 路程 ${x}`, nextRun: x => `下一班 ${x}`,
      lateBy: x => `會比下一個行程晚 ${x}到`, noMoreRuns: '今天沒有別的班次了', done: '今日完成', doneTitle: '今天的旅程都走完了',
      doneCounts: (a, b) => `${a} 個安排 · 移動 ${b} 段`, tomorrowFirstLabel: '明天第一站', tomorrowFirst: x => `明天 · ${x}`,
      headingTo: x => `前往 ${x}`, waiting: '候車中', untilDeparture: '後發車', runWindow: (a, b, c) => `${a} → ${b} · ${c}`,
      mode: { walking: '步行', driving: '開車', cycling: '騎車', other: '其他', transit: '大眾運輸', idle: '空檔' },
      scrub: '時間' },
    en: { live: 'Now', remaining: 'Ends in', nextStop: x => `Next · ${x}`, upcoming: 'Up next', untilStart: 'till start',
      now: 'Now', startsAt: x => `Starts ${x}`, beforeLeaving: x => `Before leaving · ${x}`, moving: 'On the move', untilArrival: 'till arrival',
      leavesAt: x => `Leave ${x}`, arrivesAt: x => `Arrive ${x}`, destination: x => `Destination · ${x}`, tooTight: 'Running late',
      legTravel: x => `${x} journey`, runTravel: (k, x) => `${k} · ${x} journey`, nextRun: x => `Next service ${x}`,
      lateBy: x => `${x} late for the next event`, noMoreRuns: 'No other services today', done: 'Done for today', doneTitle: 'That’s everything for today',
      doneCounts: (a, b) => `${a} events · ${b} legs`, tomorrowFirstLabel: 'till tomorrow’s first stop', tomorrowFirst: x => `Tomorrow · ${x}`,
      headingTo: x => `Heading to ${x}`, waiting: 'Waiting', untilDeparture: 'until departure', runWindow: (a, b, c) => `${a} → ${b} · ${c}`,
      mode: { walking: 'Walking', driving: 'Driving', cycling: 'Cycling', other: 'Other', transit: 'Transit', idle: 'Free time' },
      scrub: 'Time' },
    ja: { live: '進行中', remaining: '残り', nextStop: x => `次 · ${x}`, upcoming: 'まもなく', untilStart: '後に開始',
      now: '現在', startsAt: x => `${x} 開始`, beforeLeaving: x => `出発前 · ${x}`, moving: '移動中', untilArrival: '後に到着',
      leavesAt: x => `${x} 出発`, arrivesAt: x => `${x} 到着`, destination: x => `目的地 · ${x}`, tooTight: '間に合いません',
      legTravel: x => `所要 ${x}`, runTravel: (k, x) => `${k} · 所要 ${x}`, nextRun: x => `次の便 ${x}`,
      lateBy: x => `次の予定に ${x} 遅れて到着`, noMoreRuns: '今日はほかの便がありません', done: '本日終了', doneTitle: '今日の予定はすべて終わりました',
      doneCounts: (a, b) => `予定 ${a} 件 · 移動 ${b} 区間`, tomorrowFirstLabel: '明日の最初の目的地', tomorrowFirst: x => `明日 · ${x}`,
      headingTo: x => `${x} へ移動中`, waiting: '待機中', untilDeparture: '後に出発', runWindow: (a, b, c) => `${a} → ${b} · ${c}`,
      mode: { walking: '徒歩', driving: '車', cycling: '自転車', other: 'その他', transit: '公共交通', idle: '空き時間' },
      scrub: '時刻' },
    // ko：LiveActivity.json＋Domain.json legmode 的 ko 欄；scrub（首頁示意用的撥時間條，不是 App 的字）自寫
    ko: { live: '진행 중', remaining: '남은 시간', nextStop: x => `다음 · ${x}`, upcoming: '곧 시작', untilStart: '후 시작',
      now: '지금', startsAt: x => `${x} 시작`, beforeLeaving: x => `출발 전 · ${x}`, moving: '이동 중', untilArrival: '후 도착',
      leavesAt: x => `${x} 출발`, arrivesAt: x => `${x} 도착`, destination: x => `목적지 · ${x}`, tooTight: '늦어요',
      legTravel: x => `이동 ${x}`, runTravel: (k, x) => `${k} · 소요 ${x}`, nextRun: x => `다음 편 ${x}`,
      lateBy: x => `다음 일정보다 ${x} 늦게 도착`, noMoreRuns: '오늘은 다른 편이 없습니다', done: '오늘 일정 완료', doneTitle: '오늘 일정을 모두 마쳤습니다',
      doneCounts: (a, b) => `일정 ${a}개 · 이동 ${b}구간`, tomorrowFirstLabel: '내일 첫 목적지', tomorrowFirst: x => `내일 · ${x}`,
      headingTo: x => `${x}(으)로 이동 중`, waiting: '대기 중', untilDeparture: '후 출발', runWindow: (a, b, c) => `${a} → ${b} · ${c}`,
      mode: { walking: '도보', driving: '자동차', cycling: '자전거', other: '기타', transit: '대중교통', idle: '여유 시간' },
      scrub: '시각' },
  };
  const S2 = LS[lang] || LS['zh-Hant-TW'];

  // EventTypeIcons（Maki 15 格）——交通類型借行程類型那一枚（ActivityTheme.legGlyphImage）
  const MAKI = {
    train: 'M 3 1 C 2.4477 1 2 1.4477 2 2 L 2 10 C 2 10.5523 2.4477 11 3 11 L 12 11 C 12.5523 11 13 10.5523 13 10 L 13 2 C 13 1.4477 12.5523 1 12 1 L 3 1 z M 5.75 1.5 L 5.7597656 1.5 L 9.2597656 1.5 C 9.3978656 1.5 9.5097656 1.6119 9.5097656 1.75 C 9.5097656 1.8881 9.3978656 2 9.2597656 2 L 5.75 2 C 5.6119 2 5.5 1.8881 5.5 1.75 C 5.5 1.6119 5.6119 1.5 5.75 1.5 z M 3.5 3 L 7 3 L 7 7 L 3.5 7 C 3.2239 7 3 6.7761 3 6.5 L 3 3.5 C 3 3.2239 3.2239 3 3.5 3 z M 8 3 L 11.5 3 C 11.7761 3 12 3.2239 12 3.5 L 12 6.5 C 12 6.7761 11.7761 7 11.5 7 L 8 7 L 8 3 z M 5 8 C 5.5523 8 6 8.4477 6 9 C 6 9.5523 5.5523 10 5 10 C 4.4477 10 4 9.5523 4 9 C 4 8.4477 4.4477 8 5 8 z M 10 8 C 10.5523 8 11 8.4477 11 9 C 11 9.5523 10.5523 10 10 10 C 9.4477 10 9 9.5523 9 9 C 9 8.4477 9.4477 8 10 8 z M 10.445312 11.994141 C 10.380597 11.999652 10.314981 12.018581 10.253906 12.050781 C 10.030606 12.168381 9.9302313 12.433922 10.019531 12.669922 L 10.189453 13 L 4.8105469 13 L 4.9394531 12.730469 C 5.0371531 12.472169 4.9067375 12.183637 4.6484375 12.085938 C 4.4124375 11.996738 4.1468969 12.097113 4.0292969 12.320312 L 3.0292969 14.320312 C 3.0080969 14.377912 2.9986 14.4387 3 14.5 C 3 14.7761 3.2239 15 3.5 15 C 3.6802 14.999 3.8450875 14.899434 3.9296875 14.740234 L 3.9296875 14.689453 L 4 14.689453 L 4.3105469 14 L 10.689453 14 L 11 14.689453 L 11 14.740234 C 11.0846 14.899434 11.249488 14.999 11.429688 15 C 11.705787 15 11.929688 14.7761 11.929688 14.5 C 11.949587 14.4212 11.949587 14.338566 11.929688 14.259766 L 10.929688 12.259766 C 10.833163 12.076541 10.639459 11.977608 10.445312 11.994141 z',
    ferry: 'M5.33,11c0.6745,0.009,1.3262,0.245,1.85,0.67l0.26,0.23h0.05l0.31-0.28c0.9817-0.8115,2.379-0.8846,3.44-0.18L13.5,7L12,6 V2.45c-0.0466-0.8-0.6989-1.4305-1.5-1.45H10c0.0343-0.518-0.3579-0.9657-0.8759-1C9.0828-0.0027,9.0413-0.0027,9,0H6 C5.482-0.0343,5.0343,0.3579,5,0.8759C4.9973,0.9172,4.9973,0.9587,5,1H4.5C3.6989,1.0195,3.0466,1.65,3,2.45V6L1.5,7l2.25,4.53 C4.2143,11.2041,4.7631,11.02,5.33,11z M4,2.45c0.0105-0.2594,0.2293-0.4611,0.4886-0.4506C4.4924,1.9996,4.4962,1.9998,4.5,2h6 c0.259-0.0171,0.4829,0.1789,0.5,0.4379c0.0014,0.0207,0.0014,0.0414,0,0.0621v3l-3.5-2L4,5.45C4,5.45,4,2.45,4,2.45z M14,13v1 c-0.2626,0.0194-0.5069,0.1416-0.68,0.34c-0.2717,0.2883-0.6178,0.4959-1,0.6c-0.6147,0.1815-1.2795,0.0425-1.77-0.37l-0.39-0.35 c-0.3043-0.3026-0.7957-0.3026-1.1,0c-0.14,0.12-0.27,0.25-0.42,0.37c-0.7328,0.5856-1.7814,0.556-2.48-0.07l-0.39-0.35 c-0.2864-0.2502-0.7136-0.2502-1,0c-0.19,0.15-0.36,0.32-0.55,0.47c-0.7043,0.5215-1.6732,0.4968-2.35-0.06l-0.31-0.27 C1.4153,14.1443,1.2172,14.0346,1,14v-1c0.2585-0.032,0.5205,0.0169,0.75,0.14c0.2782,0.1722,0.5424,0.3661,0.79,0.58 c0.2051,0.2235,0.5147,0.319,0.81,0.25c0.1125-0.0333,0.2177-0.0876,0.31-0.16c0.16-0.12,0.29-0.26,0.45-0.39 c0.7106-0.5888,1.7394-0.5888,2.45,0c0.16,0.13,0.31,0.28,0.47,0.41c0.2864,0.2502,0.7136,0.2502,1,0c0.16-0.13,0.31-0.28,0.47-0.41 c0.7123-0.5943,1.7477-0.5943,2.46,0c0.15,0.13,0.29,0.27,0.44,0.39c0.2864,0.2502,0.7136,0.2502,1,0l0.47-0.41 C13.1895,13.1408,13.5886,12.9995,14,13z',
  };

  const clock = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };
  // TripMomentUseCase.timeline：當天有時刻、沒取消的，依開始排序
  const dayEvents = d2 => (trip.days.find(x => x.day === d2)?.events || [])
    .filter(e => e.start && e.end && !e.isCancelled).sort((a, b) => toMin(a.start) - toMin(b.start));
  const today = dayEvents(dayNo).map(e => ({ ...e, s: toMin(e.start), e: toMin(e.end) }));
  const byKey = Object.fromEntries(trip.days.find(x => x.day === dayNo).events.map(e => [e.key, e]));
  const tomorrow = dayEvents(dayNo + 1)[0];
  const travel = leg => leg?.durationMinutes || 0;
  const selectedRun = leg => leg?.runs && leg.selectedRunIndex != null ? leg.runs[leg.selectedRunIndex] : null;
  const runName = r => (r?.name || '').trim() || null;
  const legName = leg => !leg?.mode ? null : leg.mode === 'transit' && leg.transitKind ? categoryName(leg.transitKind) : S2.mode[leg.mode];
  const counts = { events: today.length, legs: today.filter(x => travel(x.leg) > 0).length };

  // Leg.journeyWindow：有選班次用那一班的發／到，否則「開始 − 路程時間」
  function journey(ev) {
    const r = selectedRun(ev.leg);
    if (r && r.departure && r.arrival) {
      const dep = toMin(r.departure), arr = toMin(r.arrival);
      if (dep < arr && dep < ev.s) return { dep, arr };
    }
    const m = travel(ev.leg);
    return m > 0 ? { dep: ev.s - m, arr: ev.s } : null;
  }
  // Leg.minutesLate：有班次問那一班到站晚不晚；沒有就「路程 − 空檔」
  function late(ev) {
    const r = selectedRun(ev.leg);
    if (r && r.arrival) { const x = toMin(r.arrival) - ev.s; return x > 0 ? x : null; }
    const up = ev.leg?.fromKey && byKey[ev.leg.fromKey];
    if (!up || !up.end || !travel(ev.leg)) return null;
    const x = travel(ev.leg) - (ev.s - toMin(up.end));
    return x > 0 ? x : null;
  }
  function alternative(ev, lateBy) {
    const leg = ev.leg, sel = selectedRun(leg);
    let next = null;
    if (sel?.departure) {
      const from = toMin(sel.departure);
      const r = (leg.runs || []).filter(x => x.departure && toMin(x.departure) > from).sort((a, b) => toMin(a.departure) - toMin(b.departure))[0];
      if (r) next = [S2.nextRun(r.departure), runName(r)].filter(Boolean).join(' · ');
    }
    if (lateBy == null) return next;
    const all = (leg?.runs || []).length > 0 && leg.runs.every(x => x.departure);
    return [S2.lateBy(duration(lateBy)), next || (all && sel ? S2.noMoreRuns : null)].filter(Boolean).join(' · ');
  }

  // TripMomentUseCase ＋ TripActivityContent：t 是當天的第幾分鐘（含秒的小數）
  function stateAt(t) {
    const i = today.findIndex(x => x.s <= t && t < x.e);
    if (i >= 0) {
      const c = today[i], nx = today.slice(i + 1).find(x => x.e > c.e);
      return { phase: 'live', label: S2.live, title: c.title, time: `${c.start} – ${c.end}`, place: c.place?.name,
        to: c.e, unit: S2.remaining, prog: [c.s, c.e], ends: [c.start, c.end],
        next: nx && S2.nextStop(nx.title), nextAt: nx?.start, foot: 'nextStop' };
    }
    const j = today.findIndex(x => x.s > t);
    if (j >= 0) {
      const up = today[j], following = today[j + 1], w = journey(up), prevEnd = j > 0 ? today[j - 1].e : null;
      if (w && t >= Math.min(prevEnd ?? w.dep, w.dep) && t < Math.min(w.arr, up.s)) {
        const waiting = t < w.dep, lateBy = late(up), run = runName(selectedRun(up.leg));
        const mins = w.arr - w.dep, kind = legName(up.leg);
        const sub = [run && kind ? S2.runTravel(kind, duration(mins)) : S2.legTravel(duration(mins)), up.leg?.note].filter(Boolean).join(' · ');
        const win = [S2.runWindow(clock(w.dep), clock(w.arr), duration(mins)), up.leg?.note].filter(Boolean).join(' · ');
        return { phase: 'moving', tight: lateBy != null,
          label: lateBy != null ? S2.tooTight : waiting ? S2.waiting : S2.moving,
          title: run || kind || S2.headingTo(up.title),
          glyph: up.leg?.mode === 'transit' && up.leg.transitKind ? { maki: up.leg.transitKind } : { mode: up.leg?.mode },
          place: waiting ? win : sub,
          to: waiting ? w.dep : w.arr, unit: waiting ? S2.untilDeparture : S2.untilArrival,
          prog: [w.dep, w.arr], ends: [S2.leavesAt(clock(w.dep)), S2.arrivesAt(clock(w.arr))],
          alt: alternative(up, lateBy), next: S2.destination(up.title), nextAt: up.start, foot: 'destination' };
      }
      const sel = selectedRun(up.leg);
      return { phase: 'soon', label: S2.upcoming, title: up.title, time: `${up.start} – ${up.end}`, place: up.place?.name,
        to: up.s, unit: S2.untilStart, prog: null, ends: [S2.now, S2.startsAt(up.start)],
        next: up.leg && S2.beforeLeaving(up.leg.note || runName(sel) || up.title),
        nextAt: up.leg && (sel?.departure ? S2.leavesAt(sel.departure)
          : [up.leg.mode && S2.mode[up.leg.mode], travel(up.leg) > 0 ? duration(travel(up.leg)) : null].filter(Boolean).join(' ') || null),
        foot: 'nextStop', following };
    }
    return { phase: 'done', label: S2.done, title: S2.doneTitle, place: S2.doneCounts(counts.events, counts.legs),
      fixed: tomorrow?.start, unit: tomorrow ? S2.tomorrowFirstLabel : null, noProgress: true,
      next: tomorrow && S2.tomorrowFirst(tomorrow.title), nextAt: tomorrow?.start, foot: 'nextStop' };
  }

  const DOT = { live: 'var(--success)', soon: 'var(--warning)', moving: 'var(--brand-teal)', done: 'rgba(255,255,255,.45)' };
  const GLYPH = {
    walking: '<svg class="ln" viewBox="0 0 24 24"><circle cx="13" cy="4" r="2" fill="currentColor" stroke="none"/><path d="M11.5 8.5 9 13l3 2 1 6M13.5 8.5l2 3.5 3 1M12 15l-3 6"/></svg>',
    transit: '<svg class="ln" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="12" rx="2"/><path d="M6 11h12M9.5 19.5 8 22M14.5 19.5 16 22"/></svg>',
    other: '<svg class="dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>',
    idle: '<svg class="ln" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.2V12l3 1.8"/></svg>',
  };
  const FOOT = { nextStop, destination: '<path d="M12 3.4v6.4"/><circle cx="12" cy="14.6" r="3.6"/>' };
  const ALT = { clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7.2V12l3 1.8"/>', warning: '<path d="M12 4 2.5 20h19zM12 10v4M12 17.2v.1"/>' };
  const timer = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`; };

  function body(st, tSec) {
    const t = tSec / 60;
    const glyph = st.glyph ? (st.glyph.maki ? `<svg class="mk" viewBox="0 0 15 15"><path d="${MAKI[st.glyph.maki]}"/></svg>` : GLYPH[st.glyph.mode] || '') : '';
    const sub = [st.time, st.place].filter(Boolean).join(' · ');
    const number = st.to != null ? timer(st.to * 60 - tSec) : st.fixed;
    const frac = st.prog ? Math.min(1, Math.max(0, (t - st.prog[0]) / (st.prog[1] - st.prog[0]))) : 0;
    return `
    <div class="la-main">
      <div class="la-l"><div class="la-state"><i style="background:${st.tight ? 'var(--warning)' : DOT[st.phase]}"></i>${fmt(st.label)}</div>
        <div class="la-title">${glyph ? `<span class="la-gl" style="color:${st.tight ? 'var(--warning)' : '#fff'}">${glyph}</span>` : ''}${fmt(st.title)}</div>
        ${sub ? `<div class="la-sub">${fmt(sub)}</div>` : ''}</div>
      <div class="la-count">${number ? `<div class="la-n">${number}</div>` : ''}${st.unit ? `<div class="la-u">${fmt(st.unit)}</div>` : ''}</div>
    </div>
    ${st.noProgress ? '' : `<div class="la-bar"><span style="width:${(frac * 100).toFixed(1)}%"></span></div>
    <div class="la-ends"><span>${fmt(st.ends[0])}</span><span>${fmt(st.ends[1])}</span></div>`}
    ${st.alt ? `<div class="la-alt${st.tight ? ' warn' : ''}"><svg viewBox="0 0 24 24">${ALT[st.tight ? 'warning' : 'clock']}</svg><span>${fmt(st.alt)}</span></div>` : ''}
    ${st.next ? `<div class="la-rule"></div><div class="la-next"><svg viewBox="0 0 24 24">${FOOT[st.foot]}</svg>
      <span class="nm">${fmt(st.next)}</span>${st.nextAt ? `<span class="tm">${fmt(st.nextAt)}</span>` : ''}</div>` : ''}`;
  }

  const la = d.querySelector('.la'), head = la.querySelector('.la-head'), timeEl = d.querySelector('.time');
  let tSec = toMin(now) * 60 + 12;
  const draw = () => {
    while (head.nextSibling) head.nextSibling.remove();
    head.insertAdjacentHTML('afterend', body(stateAt(tSec / 60), tSec));
    const m = Math.floor(tSec / 60);
    timeEl.textContent = `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
  };
  // 倒數與進度條每秒自己走（Text(timerInterval:)）
  // 外層殼暫停（長按、播完停在最後一幀）時，倒數也停住（tz-auto-ctl：pause／play）
  let held = false;
  addEventListener('message', (e) => { const d = e.data || {}; if (d.type === 'tz-auto-ctl') held = d.cmd === 'pause'; });
  setInterval(() => { if (!document.hidden && !held) { tSec += 1; draw(); } }, 1000);
  // 示範用：跳到下一個有看頭的時刻（進行中 → 即將開始 → 移動中 → 下一個行程進行中）
  const STOPS = ['10:04:40', '10:07:30', '10:12:20', '10:15:30'];
  let k = 0;
  window.__auto = { advance() { const [h, m, s] = STOPS[k++ % STOPS.length].split(':').map(Number); tSec = (h * 60 + m) * 60 + s; draw(); } };
  draw();
}
