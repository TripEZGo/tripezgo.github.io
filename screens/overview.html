    min: m => `${m} 分`, hr: h => `${h} 時間`, hm: (h, m) => `${h} 時間 ${m} 分`, sep: '　',
    gap: x => `間隔 ${x}`, noGap: '間隔なし', opening: '最初', closing: '最後',
    mode: { walking: '徒歩', driving: '車', cycling: '自転車', transit: '公共交通', other: 'その他' } },
  ko: { tabs: ['일정', '첨부', '할 일 목록'], count: n => `${n}개`, allDay: '종일', allDayOpening: '종일 · 처음',
    min: m => `${m}분`, hr: h => `${h}시간`, hm: (h, m) => `${h}시간 ${m}분`, sep: ' · ',
    gap: x => `간격 ${x}`, noGap: '간격 없음', opening: '처음', closing: '마지막',
    mode: { walking: '도보', driving: '자동차', cycling: '자전거', transit: '대중교통', other: '기타' } },
};
const s = S[lang] || S['zh-Hant-TW'];
const dur = m => m < 60 ? s.min(m) : (m % 60 ? s.hm(Math.floor(m / 60), m % 60) : s.hr(m / 60));

// 步行時間在 App 裡是 MKDirections 現算的（不是範本存的 durationMinutes）。基準圖上量到的數字記在這裡，
// key ＝ 下游那則的 key（收尾那一段用「上游 key:closing」）。
const ROUTED = { 'd1-okonomiyaki': 14, 'd1-ekie': 7, 'd1-ekie:closing': 12 };

// DesignIcon.swift：24 格線條
const LINE = {
  share: '<path d="M12 16V4M8 7.5l4-4 4 4M5 14v5q0 1 1 1h12q1 0 1-1v-5"/>',
  chevronDown: '<path d="M5 9l7 7 7-7"/>',
  chevronRight: '<path d="M9 5l7 7-7 7"/>',
  walking: '<circle cx="13" cy="4" r="2" fill="currentColor" stroke="none"/><path d="M11.5 8.5 9 13l3 2 1 6M13.5 8.5l2 3.5 3 1M12 15l-3 6"/>',
  transit: '<rect x="6" y="4" width="12" height="12" rx="2"/><path d="M6 11h12M9.5 19.5 8 22M14.5 19.5 16 22"/>',
  ellipsis: '<circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/>',
};
const line = (n, w) => `<svg class="line" viewBox="0 0 24 24" style="stroke-width:${w};color:var(--muted)">${LINE[n]}</svg>`;
const maki = k => `<svg class="maki" viewBox="0 0 15 15"><path d="${MAKI[k] || ''}"/></svg>`;

const d = document.getElementById('d');
const trip = await loadTrip();
if (interactive) applyPlaced(trip);   // 在行事曆把待排拖進時段的那幾則（pending-state.js）
const todayNo = +(params.get('today') || 1);
const start = new Date((params.get('start') || '2026-10-10') + 'T00:00:00');
const nowMin = toMin(params.get('now') || '20:45');
const dateOf = n => new Date(start.getTime() + (n - 1) * 864e5);
const today = dateOf(todayNo);

d.insertAdjacentHTML('beforeend', `
  <div class="head"><div class="greet">${t.monthDay(today.getMonth() + 1, today.getDate())} · ${t.weekday[today.getDay()]}</div>
  <div class="title">${fmt(trip.title)}</div></div>
  <div class="head-act"><svg viewBox="0 0 24 24">${LINE.share}</svg></div>
  <div class="seg">${s.tabs.map((x, i) => `<div class="${i ? '' : 'on'}">${x}</div>`).join('')}</div>`);

// ── 一天的列（OverviewViewModel.overviewEvents：全日 → 開始書擋 → 定時 → 結束書擋） ──
const ZONE = { 'Asia/Taipei': 480, 'Asia/Tokyo': 540 };
const shift = z => z ? 540 - (ZONE[z] ?? 540) : 0;
const clock = m => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;

function legLabel(lg, gap, key) {
  const run = lg.runs && lg.runs[lg.selectedRunIndex || 0];
  if (run) return [run.name, run.departure, dur(toMin(run.arrival) - toMin(run.departure))].join(s.sep);
  const name = s.mode[lg.mode] || lg.mode;
  const tm = ROUTED[key] ?? lg.durationMinutes;
  const parts = [tm > 0 ? `${name} ${dur(tm)}` : name];
  if (gap != null) parts.push(gap > 0 ? s.gap(dur(gap)) : s.noGap);
  return parts.join(' · ');
}
function legIcon(lg) {
  if (lg.mode === 'transit' && lg.transitKind && MAKI[lg.transitKind]) return maki(lg.transitKind);
  return line({ walking: 'walking', transit: 'transit', other: 'ellipsis' }[lg.mode] || 'transit', 1.8);
}
// data-leg／data-ev 只給互動模式找點的是哪一列（不影響畫面）
const legRow = (lg, gap, key, toKey) => `<div class="leg"${lg.runs?.length ? ` data-leg="${toKey}"` : ''}>${legIcon(lg)}<span>${fmt(legLabel(lg, gap, key))}</span></div>`;
// 已取消：點變成 border 色、名字劃線變淡（EventRowView.configure：dot = isCancelled ? .tzBorder : swatch）
const eventRow = (lead, title, cat, done, key, cancelled) =>
  `<div class="row${done ? ' done' : ''}${cancelled ? ' x' : ''}"${key ? ` data-ev="${key}"` : ''}><div class="lead"${/\d/.test(lead) ? ' lang="en"' : ''}>${fmt(lead)}</div>
    <div class="name ${swatchClass(cat)}"><i></i><span>${fmt(title)}</span></div>${MAKI[cat] ? maki(cat) : ''}</div>`;

function dayRows(n) {
  const day = trip.days.find(x => x.day === n);
  const allDay = trip.allDayEvents.filter(a => a.fromDay <= n && n <= a.toDay);
  const timed = day.events.filter(e => e.start && e.end).map(e => ({
    ...e,
    s: toMin(e.start) + shift(e.startTimeZoneID || e.timeZoneID),
    e2: toMin(e.end) + shift(e.endTimeZoneID || e.timeZoneID),
  })).sort((a, b) => a.s - b.s);
  const isDone = end => n < todayNo || (n === todayNo && end <= nowMin);
  let html = '', count = 0;
  // 被釘成這一天開始的那一則只有一列「全日 · 開始」，站在開始的位置（OverviewViewModel.overviewEvents：
  // rows(allDay 去掉 opening) + bookends(.opening)；1.3.0 優化卡第 2 項）。「結束」不合併（U6），照舊兩列。
  const opens = a => (a.openingDays || []).includes(n);
  for (const a of allDay.filter(a => !opens(a))) { html += eventRow(s.allDay, a.title, a.category, n < todayNo, a.key); count++; }
  for (const a of allDay.filter(opens)) { html += eventRow(s.allDayOpening, a.title, a.category, n < todayNo, a.key); count++; }
  // 已取消的行程不當路程的端點（OverviewSections.rows(for:)：live = cluster.filter { !$0.isCancelled }）
  const live = timed.filter(e => !e.isCancelled);
  timed.forEach((e, i) => {
    const prev = live.filter(x => x.s < e.s).pop();
    const named = timed.find(x => x.key === e.leg?.fromKey);
    const up = (named && !named.isCancelled ? named : null) || prev || timed[i - 1];
    if (e.leg?.mode && !e.isCancelled) html += legRow(e.leg, up ? Math.max(0, e.s - up.e2) : null, e.key, e.key);
    // 從待排排進來的那幾則：行程詳情頁（event.html）只讀範本的日程，打不開它們，所以這一列不帶 data-ev
    html += eventRow(`${clock(e.s)} – ${clock(e.e2)}`, e.title, e.category, isDone(e.e2), e.placed ? null : e.key, e.isCancelled);
    count++;
  });
  const last = live[live.length - 1];
  for (const a of allDay.filter(a => (a.closingDays || []).includes(n))) {
    if (last?.closingLeg?.mode) html += legRow(last.closingLeg, 1440 - last.e2, `${last.key}:closing`);
    html += eventRow(s.closing, a.title, a.category, n < todayNo, a.key);
    count++;
  }
  return { html, count };
}

const tabParam = { files: 1, todos: 2 }[params.get('tab')];
if (interactive || tabParam) {
  await buildPager();
} else {
let table = '';
for (let n = todayNo; n <= trip.dayCount; n++) {
  const dt = dateOf(n), { html, count } = dayRows(n), open = n === todayNo;
  table += `<div class="hdr"><div class="tc"><b>${n === todayNo ? t.today : t.day(n)}</b>
    <span>${t.shortDate(dt.getMonth() + 1, dt.getDate())} ${t.weekday[dt.getDay()]}</span></div>
    <div class="tag">${s.count(count)}</div><div class="sp"></div>
    <svg viewBox="0 0 24 24">${open ? LINE.chevronDown : LINE.chevronRight}</svg></div>${open ? html : ''}`;
}
d.insertAdjacentHTML('beforeend', `<div class="table">${table}</div>`);
}

/* ── 互動模式（首頁的 iPhone 外框）與 ?tab=files|todos 的靜態截圖 ─────────────────────────
   照 App 的 TripOverviewView／OverviewSections／OverviewContentGroups：
   - 三段閱讀並排在一條橫向軌道上，分段控制與左右滑做同一件事（TripOverviewView 檔頭：「Three lists side by
     side」）；每一段各自留著捲動位置。這裡用 CSS scroll-snap 當那條軌道。
   - 旅程（OverviewSections.itinerarySections，App 1.3.0）：「總覽」那一區 →「日程行程 · N 項 · 時區」→ **待排行程**
     （日程行程底下的可收合子 section，預設收合、件數琥珀、0 項灰；展開後最後一列「＋ 新增行程」，底下多 6）→ 每一天
     → 沒安排的日子那一行小字（hiddenDaysSection）。
     旅程進行中**只開今天**（OverviewSections.opensByDefault：todayNumber 那一天；有進行中行程的那一天也開——範本沒有），
     點標題切換；收合狀態**每一段各記各的**（TripOverviewView.toggled[segment]，C8-1）。一打開停在今天
     （landOnTodayIfNeeded，只有旅程那一段）——所以一打開的樣子跟截圖一樣，總覽與待排在上面，要往上捲才看得到。
   - 「總覽」那一區（OverviewSections.briefSection／OverviewBriefCell）：範本沒有總覽筆記，這裡拿範本自己的 summary 當內文、
     旅程名稱當標題（TripOverviewNoteUseCase：新的總覽筆記以旅程名稱為標題，c816e748c）。內文最高視窗 1/4，超出淡出＋右下
     「閱讀更多 ›」（631e4cfae）；沒被截就不放那一顆。底下一條自己的收尾線（04fd5d343）。
   - 附件：重要附件（trip.links，最後一列虛線「新增附件」）→「日程附件 · N 項 · 時區」→ 只列有附件的日子。
     第二行 = 網域 · 所屬行程（AttachmentRowText.meta，www. 拿掉）；路程的附件寫「上一站 → 這一站」，右邊那顆開的是路程
     （OverviewContentGroups.detail、TripOverviewView `cell.onGoToEvent`）。所屬行程已取消時劃線。
   - 待辦：重要事項（trip.todos，最後一列是一列空白的待辦）→「日程待辦 · 已完成/總數」→ 每一天，標籤都是「已完成/總數」
     （OverviewSections.todoSections）。打勾當下畫上、不換位置（didSelectRowAt 的 optimistic 那一段）。
   - 點行程列開詳情、點有班次的路程列開路程紙（didSelectRowAt → tripOverviewDidTapEvent／DidTapLeg）。
   打勾、收合、目前在哪一段記在 sessionStorage（tz-demo:overview），從詳情回來還在。 */
async function buildPager() {
  const U = {
    'zh-Hant-TW': { unscheduled: '待排行程', planEvents: '日程行程', planFiles: '日程附件', planTodos: '日程待辦',
      keyFiles: '重要附件', keyTodos: '重要事項', addEvent: '新增行程', addFile: '新增附件', addTodo: '新增待辦', rowUnscheduled: '未定',
      brief: '總覽', edit: '編輯', more: '閱讀更多', hidden: x => `第 ${x} 天沒有安排，不列。`, hiddenSep: '、' },
    en: { unscheduled: 'Unscheduled', planEvents: 'Scheduled events', planFiles: 'Files for the day', planTodos: 'To-dos for the day',
      keyFiles: 'Key Files', keyTodos: 'Key To-Dos', addEvent: 'Add event', addFile: 'Add attachment', addTodo: 'Add to-do', rowUnscheduled: 'Unscheduled',
      brief: 'Overview', edit: 'Edit', more: 'Read more', hidden: x => `Nothing planned on day ${x} — not listed.`, hiddenSep: ', ' },
    ja: { unscheduled: '未定の予定', planEvents: '日程の予定', planFiles: '日程の添付', planTodos: '日程のやること',
      keyFiles: '重要なファイル', keyTodos: '重要なやること', addEvent: '予定を追加', addFile: '添付を追加', addTodo: 'やることを追加', rowUnscheduled: '未定',
      brief: '概要', edit: '編集', more: '続きを読む', hidden: x => `${x}日目は予定がないため表示していません。`, hiddenSep: '、' },
    ko: { unscheduled: '미정 일정', planEvents: '일정표의 일정', planFiles: '일정표 첨부', planTodos: '일정표 할 일',
      keyFiles: '중요한 파일', keyTodos: '중요한 할 일', addEvent: '일정 추가', addFile: '첨부 추가', addTodo: '할 일 추가', rowUnscheduled: '미정',
      brief: '한눈에 보기', edit: '편집', more: '더 보기', hidden: x => `${x}일차는 일정이 없어 표시하지 않았어요.`, hiddenSep: ', ' },
  }[lang] || {};
  // PrimaryTimeZone.name：系統的短名字；短名字只是縮寫（JST）時退回完整名字
  const zoneName = (() => {
    const loc = { 'zh-Hant-TW': 'zh-Hant-TW', en: 'en', ja: 'ja', ko: 'ko' }[lang];
    const nm = style => new Intl.DateTimeFormat(loc, { timeZone: trip.defaultTimeZoneID, timeZoneName: style })
      .formatToParts(new Date()).find(p => p.type === 'timeZoneName')?.value;
    const short = nm('shortGeneric');
    return short && !/^[A-Z0-9+\-:]+$/.test(short) ? short : nm('longGeneric');
  })();

  // DesignIcon.swift
  const DI = {
    code: ['<path d="m9 8-5 4 5 4M15 8l5 4-5 4M13.5 5l-3 14"/>', 1.8],
    upload: ['<path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/>', 1.8],
    plus: ['<path d="M12 5v14M5 12h14"/>', 2],
    check: ['<path d="m5 13 5 5 9-11"/>', 2.6],
    calendar: [ICON.calendar, 1.7],
    readingTimeline: [ICON.readingTimeline, 1.7],
    chevronRight: ['<path d="M9 5l7 7-7 7"/>', 2],
  };
  const di = (n, cls = '') => `<svg class="di ${cls}" viewBox="0 0 24 24" style="stroke-width:${DI[n][1]}">${DI[n][0]}</svg>`;

  // ── 狀態 ──
  const KEY = 'tz-demo:overview';
  let st = { tab: tabParam || 0, toggled: [{}, {}, {}], done: {}, added: [] };
  // **只有從另一支畫面回來時才接上次的狀態**（例如點行程開詳情再關掉）。首頁上兩支手機（hero、04）同源、共用
  // sessionStorage——剛載入時一律從截圖那個樣子開始，不然 04 那支會打開在 hero 上切過去的那一段。
  const navType = performance.getEntriesByType?.('navigation')[0]?.type;
  const back = navType === 'back_forward'
    || (/\/screens\/[\w-]+\.html/.test(document.referrer) && !/overview\.html/.test(document.referrer));
  if (interactive && back) try { Object.assign(st, JSON.parse(sessionStorage.getItem(KEY) || '{}')); } catch {}
  if (tabParam) st.tab = tabParam;
  const save = () => { if (interactive) try { sessionStorage.setItem(KEY, JSON.stringify(st)); } catch {} };

  const allTimed = trip.days.flatMap(x => x.events.map(e => ({ ...e, day: x.day })));
  const byKey = Object.fromEntries([...allTimed, ...trip.allDayEvents.map(a => ({ ...a, day: a.fromDay }))].map(e => [e.key, e]));
  const isPast = n => n < todayNo;
  // 旅程那一段：進行中只開今天（opensByDefault）；附件與待辦照舊只收過去的（Q3）。待排那一組 key 'u'，預設收合。
  const isOpen = (tab, n) => st.toggled[tab][n] ?? (n === 'u' ? false : tab === 0 ? n === todayNo : !isPast(n));
  const dayFace = n => { const dt = dateOf(n); return { title: n === todayNo ? t.today : t.day(n),
    sub: `${t.shortDate(dt.getMonth() + 1, dt.getDate())} ${t.weekday[dt.getDay()]}` }; };

  // 標題列：日期那一種（xs bold muted、可收合）／不綁日期那一種（sm bold ink、沒有 chevron）——OverviewHeaderView.configure
  const dayHdr = (tab, n, tag) => { const f = dayFace(n), open = isOpen(tab, n);
    return `<div class="hdr${isPast(n) ? ' past' : ''}" data-day="${n}" data-tap><div class="tc"><b>${f.title}</b><span>${f.sub}</span></div>
      <div class="tag">${tag}</div><div class="sp"></div>
      <svg viewBox="0 0 24 24">${open ? LINE.chevronDown : LINE.chevronRight}</svg></div>`; };
  const keyHdr = (title, tag, zone) => `<div class="hdr key"><div class="tc"><b>${fmt(title)}</b></div>
      ${tag !== null ? `<div class="tag">${tag}</div>` : ''}<div class="sp"></div>${zone ? `<div class="zone">${fmt(zone)}</div>` : ''}</div>`;
  const action = (label, icon, cls = '') => `<div class="act${cls}" data-tap><svg class="dash"><rect x=".5" y=".5" rx="8"/></svg>${di(icon)}<span>${label}</span></div>`;
  const goEv = (icon, attr) => `<div class="goev" ${attr} data-tap>${icon}</div>`;
  const makiIc = k => MAKI[k] ? `<svg class="mk" viewBox="0 0 15 15"><path d="${MAKI[k]}"/></svg>` : di('calendar');

  // ── 行程 ──
  // 待排行程的標頭：日期那一階的字、沒有下行，件數琥珀（0 項灰），可收合（OverviewSections.unscheduledSection）
  const groupHdr = (key, title, n) => { const open = isOpen(0, key);
    return `<div class="hdr grp" data-group="${key}" data-tap><div class="tc"><b>${fmt(title)}</b></div>
      <div class="tag${n > 0 ? ' warn' : ''}">${s.count(n)}</div><div class="sp"></div>
      <svg viewBox="0 0 24 24">${open ? LINE.chevronDown : LINE.chevronRight}</svg></div>`; };
  const chev = '<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
  function brief() {
    // 標題列右上「編輯」（Header.showsEdit）；內文的截斷在畫好之後量（clipBrief）
    return `<section class="brief"><div class="hdr key"><div class="tc"><b>${fmt(U.brief)}</b></div><div class="sp"></div>
      <span class="bedit">${fmt(U.edit)}</span></div>
      <div class="btitle">${fmt(trip.title)}</div>
      <div class="bbody"><p>${fmt(trip.summary)}</p></div>
      <div class="bmore" hidden><span>${fmt(U.more)}${chev}</span></div></section>`;
  }
  function itinerary() {
    const un = trip.unscheduledEvents;
    const per = []; for (let n = 1; n <= trip.dayCount; n++) per.push([n, dayRows(n)]);
    let h = brief();
    h += `<section>${keyHdr(U.planEvents, s.count(per.reduce((a, [, x]) => a + x.count, 0)), zoneName)}</section>`;
    h += `<section>${groupHdr('u', U.unscheduled, un.length)}${isOpen(0, 'u') ? un.map(u =>
      eventRow(U.rowUnscheduled, u.title, u.category, false)).join('') + action(U.addEvent, 'plus', ' unsch') : ''}</section>`;
    // 沒安排的日子整組不出現，今天例外；最底下一行小字說哪幾天（Q23，設計 B5）
    const shown = per.filter(([n, x]) => x.count || n === todayNo), hidden = per.filter(([n, x]) => !x.count && n !== todayNo).map(([n]) => n);
    for (const [n, x] of shown) h += `<section>${dayHdr(0, n, s.count(x.count))}${isOpen(0, n) ? x.html : ''}</section>`;
    if (hidden.length) h += `<section><div class="hidden-note">${fmt(U.hidden(hidden.join(U.hiddenSep)))}</div></section>`;
    return h;
  }
  // 內文最高視窗高度的 1/4（874 × 0.25），超出才截、淡出、放「閱讀更多」（NoteBriefPreview.onClippingChange）
  function clipBrief(root) {
    const body = root.querySelector('.bbody'); if (!body) return;
    const cap = DEV.h * 0.25, clipped = body.scrollHeight > cap + 0.5;
    body.style.maxHeight = cap + 'px';
    body.classList.toggle('clip', clipped);
    root.querySelector('.bmore').hidden = !clipped;
  }

  // ── 附件 ──
  const host = u => { try { const h = new URL(u).host; return h.startsWith('www.') ? h.slice(4) : h; } catch { return null; } };
  const fileDays = new Map();
  for (let n = 1; n <= trip.dayCount; n++) {
    const list = [];
    for (const a of trip.allDayEvents.filter(a => a.fromDay === n)) (a.links || []).forEach(l => list.push({ l, ev: a }));
    const evs = (trip.days.find(x => x.day === n)?.events || []).slice().sort((a, b) => toMin(a.start) - toMin(b.start));
    for (const e of evs) {
      (e.leg?.links || []).forEach(l => list.push({ l, ev: e, up: byKey[e.leg.fromKey] }));
      (e.links || []).forEach(l => list.push({ l, ev: e }));
    }
    if (list.length) fileDays.set(n, list);
  }
  const fileRow = ({ l, ev, up }) => {
    const detail = ev ? (up ? `${up.title} → ${ev.title}` : ev.title) : null;
    const meta = [host(l.url), detail].filter(Boolean).join(' · ');
    const go = ev ? goEv(up ? di('readingTimeline') : makiIc(ev.category), up && ev.leg?.runs?.length ? `data-leg="${ev.key}"` : `data-ev="${ev.key}"`) : '';
    return `<div class="frow${ev?.isCancelled ? ' x' : ''}" data-url="${l.url}" data-tap><div class="fmain">${di('code', 'fi')}
      <div class="ft"><b>${fmt(l.title || l.url)}</b><span>${fmt(meta)}</span></div></div>${go}</div>`;
  };
  function files() {
    let h = `<section>${keyHdr(U.keyFiles, s.count(trip.links.length))}${trip.links.map(l => fileRow({ l })).join('')}${action(U.addFile, 'upload')}</section>`;
    const total = [...fileDays.values()].reduce((a, x) => a + x.length, 0);
    h += `<section>${keyHdr(U.planFiles, s.count(total), zoneName)}</section>`;
    for (const [n, list] of fileDays) h += `<section>${dayHdr(1, n, s.count(list.length))}${isOpen(1, n) ? list.map(fileRow).join('') : ''}</section>`;
    return h;
  }

  // ── 待辦 ──
  const todoDays = new Map();
  for (let n = 1; n <= trip.dayCount; n++) {
    const list = [];
    for (const a of trip.allDayEvents.filter(a => a.fromDay === n)) (a.todos || []).forEach((x, i) => list.push({ id: `${a.key}-${i}`, text: x, ev: a }));
    const evs = (trip.days.find(x => x.day === n)?.events || []).slice().sort((a, b) => toMin(a.start) - toMin(b.start));
    for (const e of evs) (e.todos || []).forEach((x, i) => list.push({ id: `${e.key}-${i}`, text: x, ev: e }));
    if (list.length) todoDays.set(n, list);
  }
  const keyTodos = () => [...trip.todos.map((x, i) => ({ id: `k${i}`, text: x })), ...st.added.map((x, i) => ({ id: `a${i}`, text: x }))];
  const tally = list => `${list.filter(x => st.done[x.id]).length}/${list.length}`;
  const todoRow = x => { const done = !!st.done[x.id];
    return `<div class="trow${done ? ' done' : ''}" data-todo="${x.id}" data-tap><div class="tmain"><div class="box">${done ? di('check') : ''}</div>
      <div class="tt"><b>${fmt(x.text)}</b>${x.ev ? `<span>${fmt(x.ev.title)}</span>` : ''}</div></div>
      ${x.ev ? goEv(di('calendar'), `data-ev="${x.ev.key}"`) : ''}</div>`; };
  function todos() {
    const k = keyTodos();
    let h = `<section>${keyHdr(U.keyTodos, tally(k))}${k.map(todoRow).join('')}
      <div class="trow comp"><div class="tmain"><div class="box ring"></div><input class="tin" enterkeyhint="next" placeholder="${U.addTodo}"></div></div></section>`;
    h += `<section>${keyHdr(U.planTodos, tally([...todoDays.values()].flat()), zoneName)}</section>`;
    for (const [n, list] of todoDays) h += `<section>${dayHdr(2, n, tally(list))}${isOpen(2, n) ? list.map(todoRow).join('') : ''}</section>`;
    return h;
  }

  // ── 軌道 ──
  const BUILD = [itinerary, files, todos];
  d.insertAdjacentHTML('beforeend', `<div class="pager">${BUILD.map((_, i) => `<div class="page" data-page="${i}"></div>`).join('')}</div>`);
  const pager = d.querySelector('.pager'), pages = [...d.querySelectorAll('.page')], segs = [...d.querySelectorAll('.seg div')];
  const draw = i => { const y = pages[i].scrollTop; pages[i].innerHTML = BUILD[i](); if (i === 0) clipBrief(pages[0]); pages[i].scrollTop = y; };
  BUILD.forEach((_, i) => draw(i));
  const mark = i => segs.forEach((x, j) => { x.classList.toggle('on', j === i); x.dataset.pos = j; });
  const land = () => { const h = pages[0].querySelector(`[data-day="${todayNo}"]`); if (h) pages[0].scrollTop = h.parentElement.offsetTop; };
  land();
  pager.scrollLeft = st.tab * DEV.w;
  mark(st.tab);
  if (!interactive) return;

  segs.forEach((x, i) => { x.setAttribute('data-tap', ''); x.addEventListener('click', () => {
    mark(i); st.tab = i; save(); pager.scrollTo({ left: i * DEV.w, behavior: 'smooth' }); }); });
  // 滑到一半就換滑塊（followPager），放開才算數
  let settle;
  pager.addEventListener('scroll', () => {
    const i = Math.round(pager.scrollLeft / DEV.w); mark(i);
    clearTimeout(settle); settle = setTimeout(() => { if (st.tab !== i) { st.tab = i; save(); } }, 120);
  }, { passive: true });

  pager.addEventListener('click', e => {
    const page = e.target.closest('.page'); if (!page) return;
    const tab = +page.dataset.page;
    const g = e.target.closest('.goev');
    if (g) { if (g.dataset.leg) go('leg', `event=${g.dataset.leg}`); else go('event', `event=${g.dataset.ev}`); return; }
    const hd = e.target.closest('[data-day]');
    if (hd) { const n = +hd.dataset.day; st.toggled[tab][n] = !isOpen(tab, n); save(); draw(tab); return; }
    const gp = e.target.closest('[data-group]');
    if (gp) { const k = gp.dataset.group; st.toggled[tab][k] = !isOpen(tab, k); save(); draw(tab); return; }
    const td = e.target.closest('[data-todo]');
    if (td) { const id = td.dataset.todo; st.done[id] = !st.done[id]; if (!st.done[id]) delete st.done[id]; save(); draw(tab); return; }
    const lg = e.target.closest('[data-leg]');
    if (lg) { go('leg', `event=${lg.dataset.leg}`); return; }
    const ev = e.target.closest('[data-ev]');
    if (ev) { go('event', `event=${ev.dataset.ev}`); return; }
    const f = e.target.closest('[data-url]');
    if (f) window.open(f.dataset.url, '_blank', 'noopener');
  });
  // 待辦最後那一列空白：寫完 Return 就送出、欄位清空、焦點留著（OverviewTodoComposerCell）
  pager.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || !e.target.matches('.tin')) return;
    const v = e.target.value.trim(); if (!v) return;
    st.added.push(v); save(); draw(2); pages[2].querySelector('.tin')?.focus({ preventScroll: true });   // 不帶 preventScroll 會連首頁一起捲
  });
}

chrome(d, { tab: 0 });
ready();
</script>
</body>
</html>
