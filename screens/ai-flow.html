<title>AI 規劃行程流程動畫</title>
<!--
  1.11.0「AI 規劃行程」流程動畫（App：Modules/PlanningCanvas）。官網首頁的 AI 段與商城第 2 張共用這一支。
  一輪 13.9 秒：三張截圖（長榮 BR132 登機證、JR 關西廣域周遊券、USJ 門票）一張張疊上畫布 → 其他卡片 → 點送出 → 讀取清單 → 預覽甩上來 →
  點〔套用〕→ 已套用 → 點 ✕ → 行事曆一筆筆排好 → 淡出重播。
  參數：?lang=zh-Hant-TW|zh-Hans|en|ja|ko　?device=ipad|duo（對話紙在寬螢幕是靠側邊的紙）
        ?t=<秒> 停在那一秒（截圖與商城用；時間軸見 opAt）　still=1 或系統「減少動態」→ 停在最後的行事曆
  畫面取自 Open Design 定稿 z-1110-flow／z-ai-unified-1110（畫布、讀取、預覽、已套用）與 z-1110-onb-calendar（行事曆）。
  字：ai-flow-strings.js，五語。App 字串表有的照抄，示範內容（截圖、AI 回覆、旅程資料）是擬的。
-->

<style>
  /* ── 行事曆（旅程分頁，取自 calendar.html，示範資料是京都第 2 天） ── */
  .head { position: absolute; left: 20px; top: 74px; width: 314px; }
  .greet { font-size: var(--t-xs); line-height: 14px; color: var(--muted); letter-spacing: .24px; }
  .title { margin-top: 2px; font: 600 var(--t-xxl)/34px var(--font); letter-spacing: -.59px; white-space: nowrap; }
  .head-act { position: absolute; left: 346px; top: 70px; width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink); }
  .head-act svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .chips { position: absolute; top: 138px; left: 4px; display: flex; gap: 8px; white-space: nowrap; }
  .chip { height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--sunken); display: flex; flex-direction: column; justify-content: center; gap: 1px; }
  .chip b { font: 600 var(--t-sm)/16px var(--font); color: var(--muted-on-sunken); display: flex; align-items: center; gap: 6px; }
  .chip span { font: 400 var(--t-xs)/14px var(--font); color: var(--muted-on-sunken); }
  .chip.on { background: var(--ink); border-color: var(--ink); }
  .chip.on b { color: var(--card); font-weight: 700; }
  .chip.on span { color: color-mix(in oklch, var(--card) 28%, var(--ink)); }
  .chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .allday { position: absolute; top: 186px; left: 0; right: 0; padding: 8px 20px 6px 52px; border-bottom: 1px solid var(--border-soft); background: var(--card); }
  .allday-label { position: absolute; left: 0; width: 44px; text-align: right; top: 13px; font-size: var(--t-xs); line-height: 20px; color: var(--muted); }
  .ad { position: relative; min-height: 36px; border: 1px solid var(--sw-stroke); border-radius: 8px; background: var(--sw-fill); overflow: hidden; display: flex; align-items: center; padding: 0 22px 0 14px; font: 600 var(--t-sm)/18px var(--font); color: var(--ink); }
  .ad::before, .ev::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--sw-base); }

  .hour span { position: absolute; left: 0; width: 44px; text-align: right; top: -8px; font-size: var(--t-xs); line-height: 16px; color: var(--muted); }
  .route { position: absolute; left: 227.5px; width: 2px; background: var(--muted); }

  .ev .m { font: 400 var(--t-xs)/16px var(--font); color: var(--muted); }
  .fab { position: absolute; left: 335px; top: 728px; width: 50px; height: 50px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; z-index: 30; box-shadow: 0 0 0 1px color-mix(in srgb, var(--page) 90%, transparent), 0 6px 16px rgba(var(--shadow-rgb),.18); }
  .fab svg { width: 24px; height: 24px; fill: none; stroke: var(--on-accent); stroke-width: 2.2; stroke-linecap: round; }
  .scrim { position: absolute; left: 0; right: 0; top: 760px; bottom: 0; z-index: 20; background: linear-gradient(to bottom, color-mix(in srgb, var(--page) 0%, transparent), var(--page) 30px); }
  .ipad .head { top: 108px; width: auto; right: 76px; } .ipad .head-act { left: 976px; top: 104px; } .ipad .chips { top: 172px; } .ipad .allday { top: 220px; }

     App 沒有 iPad 專屬版型；定稿 ⑨⑪：對話紙在 regular width 是靠側邊的紙（同樣毛玻璃），標題模型膠囊在兩顆圓鈕之間，

  .ipad .scn .gtop { top: 40px; } .ipad .scn .vtool { right: 20px; }
