<title>Apple 行事曆</title>
<!--
  整合・行事曆：iOS 26 的 Apple 行事曆「單日」檢視，第 2 天（2026-10-11）——TripEZGo 同步進去的那幾則。
  參數：?lang=zh-Hant-TW|en|ja &legs=1（打開「連路程一起加入」）&cancelled=1（打開「同步已取消的行程」）
        &top=7（畫面最上面那一條時刻線是幾點）
  靜態畫面，沒有互動。

  寫進去哪幾則（App：Modules/Domain/…/UseCase/TripCalendarSyncUseCase.swift `callAsFunction`）：
    - 有時刻的行程一則一則寫；標題就是行程標題，地點是 `event.placeName`（行事曆上第二行顯示地點）。
    - 已取消的：選項關著就不寫；開著時標題是 `domain.calendar.cancelled`「已取消 · 標題」。
    - 路程：選項開著、行程沒取消、`Leg.travelMinutes` > 0 時另建一則，從行程開始往回推路程分鐘；
      標題 `domain.calendar.leg.title`「<選的那一班名字，沒有就交通方式，再沒有就「移動」> → 行程標題」，
      沒有地點。選了班次用那一班自己的時長（往渡輪那段是「山陽本線 大野浦行」那班的 28 分）。
    - 全日行程寫成全天的一則（`.allDay`）。
    - **兩個選項預設都關著**（`Options(includesCancelled: false, includesLegs: false)`；
      `SettledCalendarOptions` 沒存過就是 nil ⇒ 預設）。所以預設畫面沒有路程、沒有已取消的。
  那一本：`TripCalendars.title` ＝「TripEZGo · <旅程名稱> #<uuid 前八碼>」；App **沒有指定顏色**
  （`makeCalendar` 只設 title 與 source），顏色是系統新建行事曆時配的——這裡用系統色票裡的紫色示意。
  單日檢視只畫顏色，不寫那一本的名字。
  日期：範本第 1 天＝2026-10-10（今天），這一頁看的是第 2 天，所以 11 是「選取」（黑圈），不是「今天」（紅）。

  系統外框：2026-10-11 在 iCloud1（iPhone 17 Pro、iOS 26.2、英文）上量：頂端兩顆玻璃膠囊（y62 高 44）、
  週列（字母 y124、日期 y154、圈 35）、分隔線 y182、日期抬頭 y202、全日列（高 24、圓角全圓、間距 2）、
  每小時 50pt、時刻標在線上置中、右緣 55、格線從 x62 起、行程塊 x68→399、圓角 4、左邊條 3、
  底色＝行事曆色 14%＋白、標題色＝行事曆色 ×0.5、底部玻璃工具列（今天／收件匣）。
  中文、日文的時刻與抬頭格式**沒有量到**（模擬器那一輪切語言失敗），照各語系的系統慣例寫。
-->

  .today { left: 28px; padding: 0 20px; font: 500 17px/22px var(--cf); }

  /* 深色（ADR-0050）：系統行事曆的深色——純黑底、白字、事件底是行事曆色 ~28% 疊黑 */

  html[data-theme="dark"] .device { background: #000; color: #fff; }

<div class="device" id="d"></div>
<script type="module">
import { fmt, lang, params, chrome, ready, loadTrip, toMin, theme } from './chrome.js';

const d = document.getElementById('d');
const trip = await loadTrip();
const DAY = 2;
const opt = { legs: params.get('legs') === '1', cancelled: params.get('cancelled') === '1' };
const TOP_HOUR = +(params.get('top') || 7);

// App 字串（Domain.json：domain.calendar.*、domain.legmode.*）＋ iOS 行事曆的系統用詞
const S = {
  'zh-Hant-TW': {
    cancelled: t => `已取消 · ${t}`, leg: (a, b) => `${a} → ${b}`, legFallback: '移動',
    modes: { walking: '步行', driving: '開車', cycling: '騎車', transit: '大眾運輸', other: '其他' },
    month: '10月', wk: ['日', '一', '二', '三', '四', '五', '六'], head: '10月11日 星期日', allDay: '整天',
    hour: h => h === 12 ? ['中午', ''] : [`<small style="margin:0 1px 0 0">${h < 12 ? '上午' : '下午'}</small>${((h + 11) % 12) + 1}時`, ''],
    range: (a, b) => `${a}–${b}`, today: '今天',
  },
  en: {
    cancelled: t => `Cancelled · ${t}`, leg: (a, b) => `${a} → ${b}`, legFallback: 'Travel',
    modes: { walking: 'Walking', driving: 'Driving', cycling: 'Cycling', transit: 'Transit', other: 'Other' },
    month: 'October', wk: ['S', 'M', 'T', 'W', 'T', 'F', 'S'], head: 'Sunday – Oct 11, 2026', allDay: 'all-day',
    hour: h => h === 12 ? ['Noon', ''] : [String(((h + 11) % 12) + 1), h < 12 ? 'AM' : 'PM'],
    range: (a, b) => `${a}–${b}`, today: 'Today',
  },
  ja: {
    cancelled: t => `キャンセル済み · ${t}`, leg: (a, b) => `${a} → ${b}`, legFallback: '移動',
    modes: { walking: '徒歩', driving: '車', cycling: '自転車', transit: '公共交通', other: 'その他' },
    month: '10月', wk: ['日', '月', '火', '水', '木', '金', '土'], head: '2026年10月11日(日)', allDay: '終日',
    hour: h => [`${h}:00`, ''],
    range: (a, b) => `${a}～${b}`, today: '今日',
  },
  // ko：domain.calendar.*、domain.legmode.* 的 ko 欄；其餘是 iOS 行事曆的系統用詞（自寫：月、星期、表頭、하루 종일、오전／오후、정오、오늘）
  ko: {
    cancelled: t => `취소됨 · ${t}`, leg: (a, b) => `${a} → ${b}`, legFallback: '이동',
    modes: { walking: '도보', driving: '자동차', cycling: '자전거', transit: '대중교통', other: '기타' },
    month: '10월', wk: ['일', '월', '화', '수', '목', '금', '토'], head: '2026년 10월 11일 일요일', allDay: '하루 종일',
    hour: h => h === 12 ? ['정오', ''] : [`<small style="margin:0 1px 0 0">${h < 12 ? '오전' : '오후'}</small> ${((h + 11) % 12) + 1}시`, ''],
    range: (a, b) => `${a}~${b}`, today: '오늘',
  },
}[lang];

// 行事曆色：系統配的（App 不指定），示意用紫。底色＝14% 疊在白上，標題＝×0.5，副標＝×0.75（照量到的藍推回去）
const CAL = [204, 115, 225];
const mixW = (c, a) => c.map(v => Math.round(255 * (1 - a) + v * a)).join(',');
d.style.setProperty('--cal', CAL.join(','));
if (theme === 'dark') {   // 深色：底＝行事曆色 30% 疊黑，標題＝往白推 55%，副標＝往白推 35%
  d.style.setProperty('--fill', CAL.map(v => Math.round(v * .3)).join(','));
  d.style.setProperty('--ink', CAL.map(v => Math.round(v + (255 - v) * .55)).join(','));
  d.style.setProperty('--sub', CAL.map(v => Math.round(v + (255 - v) * .35)).join(','));
} else {
d.style.setProperty('--fill', mixW(CAL, .14));
d.style.setProperty('--ink', CAL.map(v => Math.round(v * .5)).join(','));
d.style.setProperty('--sub', CAL.map(v => Math.round(v * .75)).join(','));
}

// Leg.travelMinutes：idle 不是路；選了班次用那一班的時長，其次才是填的分鐘
function travelMinutes(leg) {
  if (!leg || !leg.mode || leg.mode === 'idle') return null;
  const run = leg.runs?.[leg.selectedRunIndex ?? -1];
  if (run?.departure && run?.arrival) return toMin(run.arrival) - toMin(run.departure);
  return leg.durationMinutes > 0 ? leg.durationMinutes : null;
}

// TripCalendarSyncUseCase 對第 2 天寫出來的那幾則
const allDay = [], timed = [];
for (const a of trip.allDayEvents ?? []) {
  if (a.fromDay > DAY || a.toDay < DAY) continue;
  if (a.isCancelled && !opt.cancelled) continue;
  allDay.push({ title: a.isCancelled ? S.cancelled(a.title) : a.title });
}
for (const e of trip.days.find(x => x.day === DAY).events) {
  if (!e.start || !e.end) continue;
  if (e.isCancelled && !opt.cancelled) continue;
  const s = toMin(e.start), en = toMin(e.end);
  timed.push({ s, e: en, title: e.isCancelled ? S.cancelled(e.title) : e.title, loc: e.place?.name ?? null, cx: !!e.isCancelled });
  const mins = opt.legs && !e.isCancelled ? travelMinutes(e.leg) : null;
  if (mins > 0) {
    const run = e.leg.runs?.[e.leg.selectedRunIndex ?? -1];
    const label = run?.name?.trim() || S.modes[e.leg.mode] || S.legFallback;
    timed.push({ s: s - mins, e: s, title: S.leg(label, e.title), loc: null });
  }
}

const HOUR = 50;
const fmtT = m => {
  const h = Math.floor(m / 60), mm = String(m % 60).padStart(2, '0');
  if (lang === 'ja') return `${h}:${mm}`;
  const h12 = ((h + 11) % 12) + 1;
  if (lang === 'ko') return `${h < 12 ? '오전' : '오후'} ${h12}:${mm}`;   // DateFormatter jm（ko_KR）＝「오전 9:05」
  return lang === 'en' ? `${h12}:${mm}` : `${h < 12 ? '上午' : '下午'}${h12}:${mm}`;
};
const ampm = m => (lang === 'en' ? `<small style="font-size:10.5px">${m < 720 ? 'AM' : 'PM'}</small>` : '');

const PIN = '<svg class="i" viewBox="0 0 24 24"><path d="M12 21C16.5 16.5 19 13 19 10A7 7 0 0 0 5 10C5 13 7.5 16.5 12 21z"/><circle cx="12" cy="10" r="2.4"/></svg>';
const CLOCK = '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.2V12l3 1.8"/></svg>';
const CALG = '<svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>';

const adTop = 223, adH = allDay.length ? allDay.length * 24 + (allDay.length - 1) * 2 : 0;
const gridTop = adTop + adH + 4;
const firstLine = gridTop + 26; // 第一條時刻線離全日列下緣的距離（量到的「Noon」那一條）

const hours = [];
for (let h = TOP_HOUR; h <= 24; h++) {
  const y = firstLine - gridTop + (h - TOP_HOUR) * HOUR;
  if (y > 874) break;
  const [a, b] = S.hour(h % 24 === 0 ? 0 : h);
  hours.push(`<div class="hr" style="top:${y}px"><span class="${h === 12 ? 'noon' : ''}">${a}${b ? `<small>${b}</small>` : ''}</span></div>`);
}
// 時間重疊的並排（系統行事曆的做法：同一串重疊的分欄，寬度平分）
timed.sort((a, b) => a.s - b.s || b.e - a.e);
{
  let cluster = [], end = -1;
  const flush = () => { const n = Math.max(...cluster.map(x => x.col)) + 1; cluster.forEach(x => { x.cols = n; }); cluster = []; };
  for (const x of timed) {
    if (x.s >= end && cluster.length) flush();
    const used = new Set(cluster.filter(c => c.e > x.s).map(c => c.col));
    x.col = 0; while (used.has(x.col)) x.col++;
    cluster.push(x); end = Math.max(end, x.e);
  }
  if (cluster.length) flush();
}
const evs = timed.map(x => {
  const top = firstLine - gridTop + (x.s - TOP_HOUR * 60) / 60 * HOUR;
  const h = Math.max((x.e - x.s) / 60 * HOUR, 16);
  const sub = x.loc ? `${PIN}<span>${fmt(x.loc)}</span>` : `${CLOCK}<span>${S.range(fmtT(x.s), fmtT(x.e))}${ampm(x.e)}</span>`;
  const short = h < 36;
  return `<div class="ev${short ? ' short' : ''}${h >= 62 ? ' tall' : ''}${x.cx ? ' cx' : ''}" style="top:${top + 1}px;height:${h - 2}px;left:${68 + x.col * 331 / x.cols}px;right:auto;width:${331 / x.cols - (x.cols > 1 ? 2 : 0)}px">
    <div class="t">${fmt(x.title)}</div><div class="s">${sub}</div></div>`;
}).join('');

const wk = S.wk.map((w, i) => `<span class="${i === 0 || i === 6 ? 'we' : ''}">${w}</span>`).join('');
const dt = [11, 12, 13, 14, 15, 16, 17].map((n, i) => `<span class="${i === 0 ? 'sel' : i === 6 ? 'we' : ''}">${n}</span>`).join('');

d.insertAdjacentHTML('beforeend', `
  <div class="glass back"><svg class="i" viewBox="0 0 24 24"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg>${S.month}</div>
  <div class="glass tools">
