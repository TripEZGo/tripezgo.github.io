<!--
  整合・分享進來：一則社群貼文 → 系統分享選單 → TripEZGo 分享延伸 → 存好了 → 回到貼文。
  參數：?lang=zh-Hant-TW|en|ja &interactive=1（首頁外框裡一路點下去）
        &step=post|sheet|ext|done（截圖模式停在哪一步；預設 post）

  ① 貼文：一個「看起來像社群 App」的畫面，**沒有任何一家的商標與名稱**（screens/PLAN.md 的注意事項）。
     照片沿用 img/note-photo.svg（宮島大鳥居的中性插圖）。網域 HOST 是虛構的示意字。
  ② 系統分享選單：iOS 26 的系統元件，照記憶中的版面畫——**沒有 ref/ 可量**（2026-10-11 iCloud1 上
     Safari／相簿都開不起來，量不到）。TripEZGo 那一格用 img/app-icon-180.png。
  ③ 分享延伸：照 App 的 TripEZGoShare target（/Users/zhgchgli/Projects/tripezgo/App/iOS）：
     - 分享進來的是一則貼文的網址：`SharedLink.isMapLink` 不成立 ⇒ 只抓 og（`SharedItemLoader.enrich`），
       **沒有座標** ⇒ `availableDestinations` 只有 筆記、購物（標記要「有座標＋有旅程」才出現），順序照那一支：
       note → shopping（files 只有分享進來的是檔案才有）。
     - 預設去處：`SharedItemRoute.destination(for:)`——沒檔案、沒座標、頁面沒價格 ⇒ `.note`。
     - 版面順序（`buildForm`）：預覽卡、提示列、「存進哪一趟」、「存成」、筆記／購物那一段、「歸檔」。
       抬頭 `share.title.note`，右上 `share.action.save`（`.done` 樣式）。筆記名稱預設是 og:title
       （`SharedNoteUseCase`：card.title 優先）。私人筆記開關只在共編的旅程上畫（這一趟沒共編，不畫）。
       歸檔那一列固定一顆 `share` 籤（`SharedNoteUseCase.sharedTag`）。
     - 補完之前：預覽卡是骨架、提示列說「正在解析網址資訊」、儲存鍵停用（`viewDidLoad`／`prepare`）。
       互動模式停 0.9 秒示意，真實時間看網路。
     - 數字照 `ShareMetrics.swift`、`ShareGroup.swift`、`ShareRow.swift`、`SharePreviewCard.swift`、
       `PriceFieldView`、`FilterChipMetrics`；導覽列 `UINavigationBarAppearance.tzSheet`（標題 16 semibold）。
  ④ 存好了：`ShareResultViewController`——導覽列收起、綠勾、`share.done.note`、內文是
     `share.text.quoted` 包住的名字＋`share.filing.summary`（旅程 · 標籤 share）；**兩秒自己關上**
     （`successLinger = .seconds(2)`），`completeRequest` 連同系統分享選單一起收掉，回到貼文。
  字：Scripts/i18n/maps/TripEZGoShare.json（share.*）、Domain.json（domain.shoppingcategory.*）。
  系統分享選單的字是 iOS 自己的字，照各語系的系統用詞寫。
-->

const G = {
  back: '<path d="M15 4.5 7.5 12l7.5 7.5"/>',
  more: '<circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/>',
  heart: '<path d="M12 20.5s-7.5-4.6-9-9.6C2 7.4 4.3 4.5 7.4 4.5c2 0 3.6 1.1 4.6 2.7 1-1.6 2.6-2.7 4.6-2.7 3.1 0 5.4 2.9 4.4 6.4-1.5 5-9 9.6-9 9.6z"/>',
  comment: '<path d="M20.6 16.3A9 9 0 1 0 17.4 19.7L21 21z"/>',
  plane: '<path d="M21.5 3 9.6 10.7M21.5 3l-7.3 18-4.6-10.3L2.5 6.8z"/>',
  bookmark: '<path d="M19 21l-7-5.5L5 21V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1z"/>',
  home: '<path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/>',
  search: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20.5 20.5"/>',
  add: '<rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M12 8v8M8 12h8"/>',
  reels: '<rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M3.5 8.5h17M8.5 3.5l3 5M14 3.5l3 5M10.5 12v5l4.2-2.5z"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/>',
  glasses: '<circle cx="6.5" cy="14.5" r="3.5"/><circle cx="17.5" cy="14.5" r="3.5"/><path d="M10 14.5c1.3-1 2.7-1 4 0M3 14l1.5-6h2M21 14l-1.5-6h-2"/>',
  qnote: '<path d="M5 4h14v11l-5 5H5z"/><path d="M14 20v-5h5M8.5 9h7M8.5 12.5h4"/>',
};
const g = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24">${G[n]}</svg>`;
const esc = v => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

const tripName = trip.title;
const caption = `<b>${HANDLE}</b> ${fmt(s.ogTitle)}${lang === 'en' ? '. ' : '。'}${fmt(s.ogDesc)} ${s.tags.map(t => `<span class="tag">${t}</span>`).join(' ')}`;

// ── 畫面 ──
d.insertAdjacentHTML('beforeend', `
  <div class="layer post" id="post">
    <div class="pnav">${g('back', 'bk')}${s.postNav}</div>
    <div class="phead"><div class="ring"><i>M</i></div>
      <div class="who"><b>${HANDLE}</b><span>${fmt(place)}</span></div>${g('more', 'more')}</div>
    <img class="photo" src="img/note-photo.svg" alt="">
    <div class="acts">${g('heart')}${g('comment')}<span data-act="share" data-tap>${g('plane')}</span><span class="sp"></span>${g('bookmark')}</div>
    <div class="likes">${s.likes}</div>
    <div class="cap">${caption}</div>
    <div class="when">${s.when}</div>
    <div class="ptab">${g('home')}${g('search')}${g('add')}${g('reels')}<span class="me"></span></div>
  </div>
  <div class="dim" id="dim"></div>
  <div class="ss" id="ss"></div>
  <div class="ext" id="ext"></div>`);

const $ = id => document.getElementById(id);

function shareSheet() {
  const badge = '<svg class="badge" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#34c759"/><path d="M12 6.5c-3.6 0-6.5 2.3-6.5 5.1 0 1.6.9 3 2.4 3.9l-.6 2.2 2.6-1.4c.7.2 1.4.3 2.1.3 3.6 0 6.5-2.3 6.5-5S15.6 6.5 12 6.5z" fill="#fff"/></svg>';
  const tones = ['#7ba6c9,#4f7fa8', '#d9a07a,#b8764f', '#a7b98a,#7d9161', '#b49ad0,#8a6fae'];
  const people = s.people.map((n, i) => `<div class="ss-cell"><div class="av" style="background:linear-gradient(${tones[i]})">${[...n][0].toUpperCase()}${badge}</div><span>${n}</span></div>`).join('');
  const app = (bg, inner, name, attrs = '') => `<div class="ss-cell"${attrs}><div class="app" style="background:${bg}">${inner}</div><span>${name}</span></div>`;
  const apps = [
    app('linear-gradient(#f4f4f6,#e4e4e8)', '<svg viewBox="0 0 24 24" class="i" style="stroke:#0a84ff;stroke-width:1.6"><circle cx="12" cy="12" r="2"/><path d="M8.2 15.8a5.4 5.4 0 1 1 7.6 0M5.4 18.6a9.4 9.4 0 1 1 13.2 0"/></svg>', s.airdrop),
    app('linear-gradient(#65e073,#2fbf48)', '<svg viewBox="0 0 24 24"><path d="M12 4C6.8 4 3 7.2 3 11.1c0 2.3 1.3 4.3 3.4 5.6l-.9 3.3 3.8-2c.9.2 1.8.3 2.7.3 5.2 0 9-3.2 9-7.2S17.2 4 12 4z" fill="#fff"/></svg>', s.messages),
    app('#fff', '<img src="img/app-icon-180.png" alt="">', 'TripEZGo', ' data-act="tripezgo" data-tap'),
    app('linear-gradient(#4fb1ff,#1a73f0)', '<svg viewBox="0 0 24 24" class="i" style="stroke:#fff;stroke-width:1.7"><rect x="3.5" y="6" width="17" height="12" rx="2"/><path d="M4 7l8 6 8-6"/></svg>', s.mail),
    app('linear-gradient(#fff 0 30%,#fbfbfb 30%)', '<svg viewBox="0 0 24 24" class="i" style="stroke:#c9c9cc;stroke-width:1.2"><path d="M3 11h18M3 15h18M3 19h18"/><rect x="0" y="0" width="24" height="7" fill="#f7c843" stroke="none"/></svg>', s.notes),
  ].join('');
  const li = (label, icon, cls = '') => `<div class="ss-li ${cls}">${label}${icon ? g(icon) : ''}</div>`;
  return `
    <div class="ss-head"><img class="ss-thumb" src="img/note-photo.svg" alt="">
      <div class="ss-tt"><b>${fmt(s.ogTitle)}</b><span>${HOST}</span></div></div>
    <div class="ss-x" data-act="close-ss" data-tap>${g('x')}</div>
    <div class="ss-row people">${people}</div>
    <div class="ss-sep"></div>
    <div class="ss-row apps">${apps}</div>
    <div class="ss-list" style="top:318px">${li(s.copy, 'copy')}${li(s.readingList, 'glasses')}${li(s.quickNote, 'qnote')}</div>
    <div class="ss-list" style="top:484px">${li(s.editActions, '', 'blue')}</div>`;
}

// ── 分享延伸 ──
const st = { dest: 'note', resolving: false, saved: false, name: s.ogTitle, shopName: s.ogTitle, cats: new Set() };

function extForm() {
  const isNote = st.dest === 'note';
  const preview = st.resolving
    ? `<div class="pv"><div class="pv-th">${di('photo')}</div><div class="pv-tx" style="padding-top:2px"><div class="sk" style="width:78%"></div><div class="sk" style="width:96%"></div><div class="sk" style="width:54%"></div></div></div>
       <div class="nt">${di('clock')}<span>${s.resolving}</span></div>`
    : `<div class="pv"><div class="pv-th"><img src="img/note-photo.svg" alt=""></div><div class="pv-tx">
         <div class="pv-t">${fmt(s.ogTitle)}</div><div class="pv-d">${fmt(s.ogDesc)} ${s.tags.join(' ')}</div><div class="pv-h">${HOST}</div></div></div>`;
  const opt = (k, label) => `<div class="row${st.dest === k ? ' sel' : ''}" data-dest="${k}" data-tap><span class="nm">${label}</span>${di('check', 'tick')}</div>`;
  const noteSec = `
    <div class="st">${s.secNote}</div>
    <div class="grp"><div class="field"><input type="text" data-name value="${esc(st.name)}" placeholder="${esc(s.noteName)}" ${interactive ? '' : 'readonly'}></div></div>
    <div class="st">${s.secFiling}</div>
    <div class="grp"><div class="row"><span class="lab">${s.fieldTag}</span><span class="tagv"><span class="chipx">share</span></span>${di('chevronRight', 'chev')}</div></div>`;
  const shopSec = `
    <div class="st">${s.secShop}</div>
    <div class="grp shopgrp">
      <div class="field" style="border-bottom:1px solid var(--border-soft)"><input type="text" data-shop value="${esc(st.shopName)}" placeholder="${esc(s.itemName)}"></div>
      <div class="rail">${s.cats.map((c, i) => `<div class="fc${st.cats.has(i) ? ' on' : ''}" data-cat="${i}" data-tap>${c}</div>`).join('')}</div>
      <div class="price"><div class="cur">${s.currency}</div><div class="amt">0</div></div>
    </div>`;
  return `
    <div class="xnav"><div class="xbtn l" data-act="cancel" data-tap>${s.cancel}</div>
      <div class="ttl">${isNote ? s.titleNote : s.titleShopping}</div>
      <div class="xbtn r${st.resolving ? ' off' : ''}" data-act="save" data-tap>${s.save}</div></div>
    <div class="xbody">
      ${preview}
      <div class="st">${s.secTrip}</div>
      <div class="grp"><div class="row"><span class="lab">${s.fieldTrip}</span><span class="val">${fmt(tripName)}</span>${di('chevronRight', 'chev')}</div></div>
      <div class="st">${s.secDest}</div>
      <div class="grp">${opt('note', s.newNote)}${opt('shopping', s.shopDest)}</div>
      ${isNote ? noteSec : shopSec}
    </div>`;
}

function extDone() {
  const what = st.dest === 'note' ? (st.name.trim() || s.ogTitle) : (st.shopName.trim() || s.ogTitle);
  const body = st.dest === 'note' ? `${s.quoted(what)}\n${s.filing(tripName, 'share')}` : `${s.quoted(what)}\n${tripName}`;
  return `<div class="res"><div class="badge50">${di('check')}</div>
    <h2>${st.dest === 'note' ? s.doneNote : s.doneShopping}</h2><p>${fmt(body)}</p></div>`;
}

// ── 狀態 ──
function show(step) {
  const post = $('post'), dim = $('dim'), ss = $('ss'), ext = $('ext');
  if (step === 'post') {
    post.classList.remove('back'); dim.classList.remove('on'); ss.classList.remove('on', 'back'); ext.classList.remove('on');
    return;
  }
  if (!ss.innerHTML) ss.innerHTML = shareSheet();
  if (step === 'sheet') {
    post.classList.remove('back'); dim.classList.add('on'); ss.classList.add('on'); ss.classList.remove('back'); ext.classList.remove('on');
    return;
  }
  // ext / done：延伸那一張蓋上來，底下的貼文與分享選單往後退
  post.classList.add('back'); dim.classList.add('on'); ss.classList.add('on', 'back');
  ext.innerHTML = step === 'done' ? extDone() : extForm();
  ext.classList.add('on');
}

const step = interactive ? 'post' : (params.get('step') || 'post');
if (!interactive && step !== 'post') {
  // 截圖模式：沒有轉場
  for (const el of [$('post'), $('dim'), $('ss'), $('ext')]) el.style.transition = 'none';
}
show(step);

chrome(d);
const sb = d.querySelector('.sb');
const setDark = on => sb.classList.toggle('on-dark', on);
setDark(step === 'ext' || step === 'done');

if (interactive) {
  let timer = null;
  const close = () => { clearTimeout(timer); setDark(false); show('post'); setTimeout(() => { $('ss').innerHTML = ''; }, 420); };
  d.addEventListener('click', (e) => {
    const a = e.target.closest('[data-act]');
    const dest = e.target.closest('[data-dest]');
    const cat = e.target.closest('[data-cat]');
    if (dest) {
      // ShareFormViewController.pick：選了就照他的（forcedDestination）
      if (dest.dataset.dest !== st.dest) { st.dest = dest.dataset.dest; show('ext'); }
      return;
    }
    if (cat) { const i = +cat.dataset.cat; st.cats.has(i) ? st.cats.delete(i) : st.cats.add(i); cat.classList.toggle('on'); return; }
    if (!a) { if (e.target === $('dim') && !$('ext').classList.contains('on')) close(); return; }
    const act = a.dataset.act;
    if (act === 'share') show('sheet');
    else if (act === 'close-ss') close();
    else if (act === 'tripezgo') {
      // 每一次打開都是一張新的單（ShareViewController 每次新建）
      Object.assign(st, { dest: 'note', resolving: true, name: s.ogTitle, shopName: s.ogTitle, cats: new Set() });
      setDark(true); show('ext');
      timer = setTimeout(() => { st.resolving = false; show('ext'); }, 900);
    } else if (act === 'cancel') close();
    else if (act === 'save') {
      if (st.resolving) return; // 補完之前儲存鍵是停用的
      show('done');
      // ShareResultViewController.successLinger：兩秒自己關上，completeRequest 連分享選單一起收
      timer = setTimeout(() => { close(); }, 2000);
    }
  });
  d.addEventListener('input', (e) => {
    if (e.target.matches('[data-name]')) st.name = e.target.value;
    if (e.target.matches('[data-shop]')) st.shopName = e.target.value;
  });
  d.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('input')) { e.preventDefault(); e.target.blur(); } });
}

ready();
</script>
</body>
</html>
