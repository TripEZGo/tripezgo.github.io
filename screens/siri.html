<meta name="viewport" content="width=402">
<title>Siri・下一個行程</title>
<!--
  鎖定畫面上叫出 Siri（iOS 26），問 TripEZGo 的 App Intent。
  App：TripEZGo/Core/Siri/TripIntents.swift（NextEventIntent、TodayScheduleIntent、TripShortcuts 的短語）、
  句子 Modules/LiveActivity/…/TripSpokenAnswer.swift（next／today）、那一刻 Domain/UseCase/TripMomentUseCase.swift
  （只算定時、沒取消的；進行中的「接下來」＝之後第一則比它晚結束的；路程段數＝有效路程 > 0 的那幾則）。
  字串：Scripts/i18n/maps/LiveActivity.json（spoken*）、TripEZGo.json（appShortcuts：短語，${applicationName}＝TripEZGo）。
  **這兩支 intent 只回 dialog（ProvidesDialog），沒有自訂的 snippet view**——Siri 卡片裡就是那一句話，
  上面掛系統給的 App 名稱與圖示。Siri 的光邊、轉錄字、卡片外觀是系統 UI，照 iOS 26 的樣子畫。
  參數：?lang=… &day=2 &start=2026-10-10 &now=10:41 &ask=0..3（短語序號，預設 1＝「下一個行程是什麼」（使用者 2026-10-12：Apple Intelligence 不用指名 App，直接問自然句；畫面上不出現 App 名稱，回答卡片也不放 App 標頭））
-->
<link rel="stylesheet" href="screen.css?v=7e1e128cfb">
<style>
  .device { background: #6aa6d8 url(img/share-wallpaper.jpg) center / cover no-repeat; color: #fff; }
  .sb-time { display: none; }
  /* 鎖定畫面（同 lock.html），Siri 起來時整片被系統壓暗、糊掉 */
  .behind { position: absolute; inset: -30px; padding: 30px; filter: blur(10px); background: #6aa6d8 url(img/share-wallpaper.jpg) center / cover no-repeat; }
  .behind .clock { top: 122px; }
  .clock { position: absolute; left: 0; right: 0; top: 92px; text-align: center; }
  .date { font: 600 21px/26px -apple-system, "SF Pro Display", var(--font); letter-spacing: .2px; opacity: .92; }
  .time { font: 600 112px/1 "SF Pro Rounded", -apple-system, "SF Pro Display", sans-serif; letter-spacing: -2px;
    color: rgba(255,255,255,.88); }
  .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.42), rgba(0,0,0,.30) 45%, rgba(0,0,0,.48)); }

  /* Siri 的光邊（Apple Intelligence 那一圈）：螢幕四周的彩色漸層，往內暈開 */
  @property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  .glow { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
  /* 外層 i 只負責暈開（filter 在 mask 之前套，所以兩件事要分兩層），內層 b 是那一圈漸層 */
  .glow i { position: absolute; inset: 0; transition: opacity .5s ease, filter .5s ease; }
  .glow b { position: absolute; inset: 0; border-radius: 56px; --a: 20deg;
    background: conic-gradient(from var(--a), #ff6778, #ffba71, #f5b9ea, #8d9fff, #bc82f3, #c686ff, #ff6778);
    -webkit-mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); transition: padding .5s ease; }
  .glow .g1 b { padding: 2.5px; }
  .glow .g2 { filter: blur(5px); opacity: .9; } .glow .g2 b { padding: 7px; }
  .glow .g3 { filter: blur(16px); opacity: .6; } .glow .g3 b { padding: 16px; }
  .glow.busy b { animation: spin 1.1s linear infinite; }
  .glow.busy .g2 b { padding: 11px; } .glow.busy .g3 b { padding: 26px; } .glow.busy .g3 { opacity: .85; }
  @keyframes spin { to { --a: 380deg; } }

  /* 回答：系統的 Siri 卡片（Liquid Glass），App 名稱與圖示是系統掛上去的 */
  .card { position: absolute; left: 12px; right: 12px; top: 62px; z-index: 31; padding: 14px 18px 18px; border-radius: 34px; color: #000;
    background: rgba(250,249,248,.80); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.6), 0 10px 40px rgba(0,0,0,.18); transition: opacity .35s, transform .35s; }
  .card.hide { opacity: 0; transform: translateY(-10px) scale(.97); }
  .c-text { margin-top: 8px; font: 600 19px/25px var(--font); letter-spacing: -.3px; }

  /* 使用者講的那一句（「一律顯示語音」的轉錄字），貼在底部光邊之上 */
  .ask { position: absolute; left: 16px; right: 16px; bottom: 40px; z-index: 31; min-height: 50px; padding: 13px 20px; border-radius: 25px;
    background: rgba(255,255,255,.18); -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.35); font: 500 17px/24px var(--font); letter-spacing: -.2px; color: #fff; }
  .ask .caret { display: none; width: 2px; height: 20px; margin-left: 1px; vertical-align: -4px; background: #fff; animation: blink .8s steps(1) infinite; }
  .ask.typing .caret { display: inline-block; }
  @keyframes blink { 50% { opacity: 0; } }

  /* 互動模式：Siri 的建議（照「輸入以使用 Siri」上面那排建議鈕的樣子），每一顆是 App 的一句短語 */
  .sugg { position: absolute; left: 0; right: 0; bottom: 102px; z-index: 31; display: flex; gap: 8px; padding: 0 16px;
    overflow-x: auto; scrollbar-width: none; touch-action: pan-x; }
  .sugg::-webkit-scrollbar { display: none; }
  .sugg button { flex: none; height: 36px; padding: 0 14px; border: 0; border-radius: 18px; color: #fff; font: 500 14px/36px var(--font);
    background: rgba(255,255,255,.22); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.4); white-space: nowrap; }
  .sugg button.on { background: rgba(255,255,255,.42); }
  /* 深色（ADR-0050）：Siri 回答卡是深色玻璃 */
  html[data-theme="dark"] .scrim { background: linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.45) 45%, rgba(0,0,0,.62)); }
  html[data-theme="dark"] .card { color: #fff; background: rgba(40,38,36,.78); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.14), 0 10px 40px rgba(0,0,0,.45); }
</style>
</head>
<body>
<div class="device" id="d"></div>
<script type="module">
import { fmt, lang, params, loadTrip, chrome, toMin, ready, interactive } from './chrome.js';

const d = document.getElementById('d');
const trip = await loadTrip();
const dayNo = +(params.get('day') || 2);
const now = params.get('now') || '10:41';
const start = new Date((params.get('start') || '2026-10-10') + 'T00:00:00');
const date = new Date(start.getTime() + (dayNo - 1) * 864e5);
const APP = 'TripEZGo';   // ${applicationName}

// 字串逐字：LiveActivity.json（spoken*）、TripEZGo.json（appShortcuts）。鎖定畫面日期是系統格式（同 lock.html）
const S = {
  'zh-Hant-TW': {
    phrases: ['下一個行程', '下一個行程是什麼', '今天的行程', '今天有什麼安排'],
    noTrip: '現在沒有進行中的旅程。', next: (a, b) => `下一個是${a}，${b} 開始。`, currentLast: a => `現在是${a}，今天之後沒有其他安排了。`,
    currentAndNext: (a, b, c) => `現在是${a}，接下來是${b}，${c} 開始。`, allDone: '今天的行程都走完了。',
    tomorrow: (a, b) => `今天走完了，明天第一站是${a}，${b} 開始。`, countsWithLegs: (a, b) => `${a} 個安排、移動 ${b} 段`,
    counts: a => `${a} 個安排`, day: (a, b) => `第 ${a} 天，共 ${b} 天`, summaryDone: (a, b) => `${a}。今天 ${b}，都走完了。`,
    summary: (a, b) => `${a}。今天 ${b}。`, summaryCurrent: (a, b, c) => `${a}。今天 ${b}，現在是${c}。`,
    summaryNext: (a, b, c, e) => `${a}。今天 ${b}，下一個是${c}，${e} 開始。`, fallback: '今天還有安排，但我看不出下一個是哪一件。',
    date: dt => `${dt.getMonth() + 1}月${dt.getDate()}日 ${['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][dt.getDay()]}` },
  en: {
    phrases: ['Next event', "What's my next event?", "Today's schedule", "What's on today?"],
    noTrip: 'No trip is under way right now.', next: (a, b) => `${a} is next, starting at ${b}.`, currentLast: a => `You're at ${a}, and there's nothing else today.`,
    currentAndNext: (a, b, c) => `You're at ${a}. Next is ${b} at ${c}.`, allDone: "That's the whole day done.",
    tomorrow: (a, b) => `Today is done. Tomorrow starts with ${a} at ${b}.`, countsWithLegs: (a, b) => `${a} events and ${b} legs`,
    counts: a => `${a} events`, day: (a, b) => `day ${a} of ${b}`, summaryDone: (a, b) => `${a}. Today: ${b}, all done.`,
    summary: (a, b) => `${a}. Today: ${b}.`, summaryCurrent: (a, b, c) => `${a}. Today: ${b}. You're at ${c}.`,
    summaryNext: (a, b, c, e) => `${a}. Today: ${b}. Next is ${c} at ${e}.`, fallback: "There's more today, but I can't tell which one comes next.",
    date: dt => `${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][dt.getDay()]}, ${['January','February','March','April','May','June','July','August','September','October','November','December'][dt.getMonth()]} ${dt.getDate()}` },
  ja: {
    phrases: ['次の予定', '次の予定は何？', '今日の予定', '今日の予定は？'],
    noTrip: 'いま進行中の旅行はありません。', next: (a, b) => `次は${a}で、${b} に始まります。`, currentLast: a => `いまは${a}で、今日はこのあとの予定はありません。`,
    currentAndNext: (a, b, c) => `いまは${a}で、次は${b}、${c} に始まります。`, allDone: '今日の予定はすべて終わりました。',
    tomorrow: (a, b) => `今日は終わりました。明日の最初は${a}で、${b} に始まります。`, countsWithLegs: (a, b) => `予定 ${a} 件、移動 ${b} 区間`,
    counts: a => `予定 ${a} 件`, day: (a, b) => `${b} 日中 ${a} 日目`, summaryDone: (a, b) => `${a}。今日は ${b}、すべて終わりました。`,
    summary: (a, b) => `${a}。今日は ${b}。`, summaryCurrent: (a, b, c) => `${a}。今日は ${b}、いまは${c}です。`,
    summaryNext: (a, b, c, e) => `${a}。今日は ${b}、次は${c}、${e} に始まります。`, fallback: '今日はまだ予定がありますが、次がどれかわかりません。',
    date: dt => `${dt.getMonth() + 1}月${dt.getDate()}日 ${'日月火水木金土'[dt.getDay()]}曜日` },
  // ko：短語照 App 的 ko.lproj/AppShortcuts.strings（帶 ${applicationName}，順序同 TripIntents：next 兩句、today 兩句）；
  // 回答照 LiveActivity.json liveactivity.spoken.*；日期照 DateFormatter MMMMEEEEd（ko）
  ko: {
    phrases: ['${applicationName} 다음 일정', '${applicationName}에게 다음에 어디로 가는지 묻기', '${applicationName} 오늘 일정', '${applicationName}에게 오늘 일정 묻기'],
    noTrip: '지금 진행 중인 여행이 없습니다.', next: (a, b) => `다음은 ${a}이고, ${b}에 시작합니다.`, currentLast: a => `지금은 ${a}이고, 오늘 남은 일정은 없습니다.`,
    currentAndNext: (a, b, c) => `지금은 ${a}이고, 다음은 ${b}, ${c}에 시작합니다.`, allDone: '오늘 일정을 모두 마쳤습니다.',
    tomorrow: (a, b) => `오늘은 끝났습니다. 내일 첫 일정은 ${a}이고, ${b}에 시작합니다.`, countsWithLegs: (a, b) => `일정 ${a}개, 이동 ${b}구간`,
    counts: a => `일정 ${a}개`, day: (a, b) => `${b}일 중 ${a}일차`, summaryDone: (a, b) => `${a}. 오늘은 ${b}, 모두 마쳤습니다.`,
    summary: (a, b) => `${a}. 오늘은 ${b}.`, summaryCurrent: (a, b, c) => `${a}. 오늘은 ${b}, 지금은 ${c}입니다.`,
    summaryNext: (a, b, c, e) => `${a}. 오늘은 ${b}, 다음은 ${c}, ${e}에 시작합니다.`, fallback: '오늘 남은 일정이 있지만, 다음이 무엇인지 알 수 없습니다.',
    date: dt => `${dt.getMonth() + 1}월 ${dt.getDate()}일 ${'일월화수목금토'[dt.getDay()]}요일` },
}[lang] || null;
const L = S;
const phrase = i => L.phrases[i].replace('${applicationName}', APP);
// 短語 0、1 → NextEventIntent；2、3 → TodayScheduleIntent（TripShortcuts）
const intentOf = i => (i < 2 ? 'next' : 'today');

// ── TripMomentUseCase：那一刻（簡化成同一個時區、沒有跨午夜的範本；範本正是這樣） ──
const clock = m => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;   // TripTextFormatter.clock
const timeline = dn => (trip.days.find(x => x.day === dn)?.events || [])
  .filter(e => e.start && e.end && !e.isCancelled)
  .map(e => ({ e, s: toMin(e.start), t: toMin(e.end) })).sort((a, b) => a.s - b.s);
function moment(nowMin) {
  if (dayNo < 1 || dayNo > trip.dayCount) return null;
  const today = timeline(dayNo);
  if (!today.length) return null;
  const counts = { events: today.length, legs: today.filter(x => (x.e.leg?.durationMinutes || 0) > 0).length };
  const base = { dayNumber: dayNo, dayCount: trip.dayCount, ...counts };
  const ci = today.findIndex(x => x.s <= nowMin && nowMin < x.t);
  if (ci >= 0) {
    const cur = today[ci], following = today.slice(ci + 1).find(x => x.t > cur.t);
    return { ...base, phase: 'live', focus: cur.e, focusStart: cur.s, next: following?.e, nextStart: following?.s };
  }
  const ui = today.findIndex(x => x.s > nowMin);
  if (ui >= 0) return { ...base, phase: 'soon', focus: today[ui].e, focusStart: today[ui].s };   // 即將開始與移動中講的是同一句
  const tm = timeline(dayNo + 1)[0];
  return { ...base, phase: 'done', next: tm?.e, nextStart: tm?.s };
}
// ── TripSpokenAnswer.next／today ──
function spoken(kind, m) {
  if (!m) return L.noTrip;
  if (kind === 'next') {
    if (m.phase === 'live') return m.next ? L.currentAndNext(m.focus.title, m.next.title, clock(m.nextStart)) : L.currentLast(m.focus.title);
    if (m.phase === 'done') return m.next ? L.tomorrow(m.next.title, clock(m.nextStart)) : L.allDone;
    return m.focus ? L.next(m.focus.title, clock(m.focusStart)) : L.fallback;
  }
  const counts = m.legs > 0 ? L.countsWithLegs(m.events, m.legs) : L.counts(m.events);
  const day = L.day(m.dayNumber, m.dayCount);
  if (m.phase === 'done') return L.summaryDone(day, counts);
  if (m.phase === 'live') return L.summaryCurrent(day, counts, m.focus.title);
  return L.summaryNext(day, counts, m.focus.title, clock(m.focusStart));
}

const nowMin = toMin(now);
const ask0 = Math.min(3, Math.max(0, +(params.get('ask') ?? 1)));
const [hh, mm] = now.split(':');

d.insertAdjacentHTML('beforeend', `
  <div class="behind"><div class="clock"><div class="date">${L.date(date)}</div><div class="time">${+hh}:${mm}</div></div></div>
  <div class="scrim"></div>
  <div class="glow"><i class="g3"><b></b></i><i class="g2"><b></b></i><i class="g1"><b></b></i></div>
  <div class="card"><div class="c-text"></div></div>
  <div class="ask"><span class="q"></span><span class="caret"></span></div>`);
const card = d.querySelector('.card'), cText = d.querySelector('.c-text'), qEl = d.querySelector('.ask .q');
const glow = d.querySelector('.glow'), askEl = d.querySelector('.ask');
const show = i => { qEl.innerHTML = fmt(phrase(i)); cText.innerHTML = fmt(spoken(intentOf(i), moment(nowMin))); };
show(ask0);

chrome(d, { dark: true });
ready();

/* ── 互動模式：點一句短語＝問 Siri 一次（截圖模式不跑這一段） ──
   轉錄字一個字一個字出來 → 光邊轉一下（Siri 在想）→ 回答卡片浮上來。四顆＝TripShortcuts 的四句短語，
   答案永遠是 App 那兩支 intent 在這一刻會講的那一句。 */
if (interactive) {
  d.insertAdjacentHTML('beforeend', `<div class="sugg">${L.phrases.map((_, i) =>
    `<button data-tap data-i="${i}"${i === ask0 ? ' class="on"' : ''}>${fmt(phrase(i))}</button>`).join('')}</div>`);
  const btns = [...d.querySelectorAll('.sugg button')];
  let run = 0;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  async function ask(i) {
    const my = ++run;
    btns.forEach(b => b.classList.toggle('on', +b.dataset.i === i));
    card.classList.add('hide'); glow.classList.add('busy'); askEl.classList.add('typing');
    const chars = Array.from(phrase(i));
    qEl.textContent = '';
    for (let k = 1; k <= chars.length; k++) {
      await wait(lang === 'en' ? 28 : 55); if (my !== run) return;
      qEl.innerHTML = fmt(chars.slice(0, k).join(''));
    }
    askEl.classList.remove('typing');
    await wait(900); if (my !== run) return;
    cText.innerHTML = fmt(spoken(intentOf(i), moment(nowMin)));
    card.classList.remove('hide');
    await wait(500); if (my !== run) return;
    glow.classList.remove('busy');
  }
  d.querySelector('.sugg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) ask(+b.dataset.i); });
}
</script>
</body>
