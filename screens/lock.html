<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=402">
<title>鎖定畫面・即時動態</title>
<!--
  iPhone 鎖定畫面＋TripEZGo 即時動態（App：TripEZGoWidget/Views/TripActivityCard.swift、ActivityPieces.swift、
  ActivityTheme.swift、TripActivityWidget.swift；內容 Modules/LiveActivity/…/TripActivityContent.live；
  字串 Scripts/i18n/maps/LiveActivity.json）。
  參數：?lang=zh-Hant-TW|en|ja &day=2 &start=2026-10-10 &now=10:41（鎖定畫面的時鐘，也是「現在」）
  卡片內容＝第 day 天裡 now 正在進行的那一則（「進行中」）。鎖定畫面的時鐘、日期、手電筒、相機是系統 UI，
  照 iOS 26 的樣子畫；桌布是設計稿 assets/okinawa-wallpaper.jpg（img/share-wallpaper.jpg）。
-->
<link rel="stylesheet" href="screen.css">
<style>
  /* ActivityTheme：onDark＝tzOnDeep #fff、onDarkMuted 62%、onDarkSoft 86%、accentLift＝tzBrandTeal、scrim＝tzInkDeep */
  :root { --on-dark: #fff; --on-dark-muted: rgba(255,255,255,.62); --on-dark-soft: rgba(255,255,255,.86);
    --scrim: 31,25,20; --hairline: rgba(255,255,255,.14); }
  .device { background: #6aa6d8 url(img/share-wallpaper.jpg) center / cover no-repeat; color: #fff; }
  /* 系統在時鐘與底部那一排後面壓的一層淡暗，讓白字讀得到 */
  .dim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.16) 0%, rgba(0,0,0,.04) 38%, rgba(0,0,0,0) 60%, rgba(0,0,0,.18) 100%); }
  .sb-time { display: none; }

  .clock { position: absolute; left: 0; right: 0; top: 92px; text-align: center; }
  .date { font: 600 21px/26px -apple-system, "SF Pro Display", var(--font); letter-spacing: .2px; opacity: .92; }
  .time { margin-top: 0; font: 600 112px/1 "SF Pro Rounded", -apple-system, "SF Pro Display", sans-serif;
    letter-spacing: -2px; font-variant-numeric: tabular-nums; color: rgba(255,255,255,.88);
    text-shadow: 0 1px 24px rgba(0,40,80,.18); }

  /* 即時動態卡：系統給的外框（左右 20、圓角 22），activityBackgroundTint＝scrim 74% ＋ 系統材質 */
  .la { position: absolute; left: 20px; right: 20px; bottom: 132px; border-radius: 22px; overflow: hidden;
    background: rgba(var(--scrim), .74); -webkit-backdrop-filter: blur(24px) saturate(140%); backdrop-filter: blur(24px) saturate(140%);
    padding: 14px 16px 15px; color: var(--on-dark); }
  .la-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .la-icon { flex: none; width: 20px; height: 20px; border-radius: 5px; background: var(--accent); display: grid; place-items: center; }
  .la-icon svg { width: 13px; height: 13px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .la-app { flex: 1 1 auto; min-width: 0; font-size: 12px; line-height: 18px; letter-spacing: .24px; color: var(--on-dark-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .la-day { flex: none; font-size: 11px; line-height: 16.5px; letter-spacing: .66px; color: var(--on-dark-muted); font-variant-numeric: tabular-nums; }
  .la-refresh { flex: none; width: 28px; height: 28px; margin: -5px -6px -5px 0; display: grid; place-items: center; }
  .la-refresh svg { width: 13px; height: 13px; fill: none; stroke: var(--on-dark-muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .la-main { display: flex; align-items: flex-end; gap: 12px; }
  .la-l { flex: 1 1 auto; min-width: 0; }
  .la-state { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; font: 700 11px/16.5px var(--font);
    letter-spacing: .66px; color: var(--on-dark-muted); }
  .la-state i { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
  .la-title { font: 700 20px/24px var(--font); letter-spacing: .1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .la-sub { margin-top: 3px; font-size: 12px; line-height: 18px; letter-spacing: .24px; color: var(--on-dark-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .la-count { flex: none; text-align: right; }
  .la-n { font: 700 22px/26px var(--font); font-variant-numeric: tabular-nums; }
  .la-u { margin-top: 3px; font-size: 11px; line-height: 16.5px; letter-spacing: .66px; color: var(--on-dark-muted); }
  .la-bar { margin-top: 12px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); overflow: hidden; }
  .la-bar span { display: block; height: 100%; border-radius: 2px; background: var(--brand-teal); }
  .la-ends { margin-top: 6px; display: flex; justify-content: space-between; font-size: 11px; line-height: 16.5px;
    letter-spacing: .44px; color: var(--on-dark-muted); font-variant-numeric: tabular-nums; }
  .la-rule { margin-top: 11px; height: 1px; background: var(--hairline); }
  .la-next { margin-top: 10px; display: flex; align-items: center; gap: 6px; }
  .la-next svg { flex: none; width: 13px; height: 13px; fill: none; stroke: var(--on-dark-muted); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .la-next .nm { flex: 1 1 auto; min-width: 0; font-size: 12px; line-height: 18px; letter-spacing: .24px; color: var(--on-dark-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .la-next .tm { flex: none; font-size: 11px; line-height: 16.5px; letter-spacing: .44px; color: var(--on-dark-muted); font-variant-numeric: tabular-nums; }

  /* 手電筒／相機（系統 UI） */
  .qa { position: absolute; bottom: 52px; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255,255,255,.2); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.35); }
  .qa svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ── 互動模式才用得到的（截圖模式不會產生這些元素） ── */
  .is-interactive .la { touch-action: pan-y; cursor: ew-resize; user-select: none; -webkit-user-select: none; }
  .is-interactive .la-refresh { cursor: pointer; }
  .la-refresh.spin svg { animation: la-spin .6s ease-out; }
  @keyframes la-spin { to { transform: rotate(360deg); } }
  /* 移動中標題前那一枚交通圖示：16pt、底比基線低 2pt（TripActivityCard.title） */
  .la-gl { display: inline-block; width: 16px; height: 16px; margin-right: 6px; vertical-align: -2px; }
  .la-gl svg { display: block; width: 16px; height: 16px; }
  .la-gl svg.ln { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .la-gl svg.mk { fill: currentColor; fill-rule: evenodd; }
  .la-gl svg.dots { fill: currentColor; }
  /* ActivityAltRow：上距 7、圖示 12、字 11、字距 .22；趕不上整行轉琥珀加粗 */
  .la-alt { margin-top: 7px; display: flex; align-items: center; gap: 6px; font-size: 11px; line-height: 16.5px; letter-spacing: .22px;
    color: var(--on-dark-muted); white-space: nowrap; overflow: hidden; }
  .la-alt span { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .la-alt svg { flex: none; width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .la-alt.warn { color: var(--warning); font-weight: 600; }
  /* 撥時間的那一條（互動模式才有）：放在手電筒與相機中間，長相照 iOS 媒體播放的玻璃進度條——細軌、白色已走、小圓把手 */
  .lk-scrub { position: absolute; left: 110px; right: 110px; bottom: 52px; height: 50px; display: flex; flex-direction: column;
    justify-content: center; gap: 7px; touch-action: none; cursor: pointer; outline: none; user-select: none; -webkit-user-select: none; }
  .lk-scrub-t { text-align: center; font: 600 13px/16px var(--font); font-variant-numeric: tabular-nums; color: rgba(255,255,255,.92);
    text-shadow: 0 1px 6px rgba(0,30,60,.3); }
  .lk-scrub-track { position: relative; height: 6px; border-radius: 3px; background: rgba(255,255,255,.28);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.35); }
  .lk-scrub-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }   /* 主題色（使用者 2026-10-12） */
  .lk-scrub-thumb { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 2px #fff, 0 1px 4px rgba(0,0,0,.25); transition: transform .15s; }
  .lk-scrub.active .lk-scrub-thumb { transform: scale(1.35); }
  .lk-scrub:focus-visible .lk-scrub-track { box-shadow: 0 0 0 2px rgba(255,255,255,.8); }

  /* ── 鎖定畫面的通知（系統 UI）：即時動態在最上面，通知接在它下面，整欄貼著手電筒那一排之上 ── */
  .lk-col { position: absolute; left: 20px; right: 20px; bottom: 132px; max-height: 498px; display: flex; flex-direction: column;
    gap: 8px; overflow-y: auto; scrollbar-width: none; }
  .lk-col::-webkit-scrollbar { display: none; }
  .lk-col > :first-child { margin-top: auto; }
  .lk-col .la { position: relative; left: auto; right: auto; bottom: auto; flex: none; }
  .nt { display: flex; flex-direction: column; gap: 8px; flex: none; }
  .nt:empty { display: none; }
  .nt-card { position: relative; z-index: 2; display: flex; gap: 10px; padding: 12px 14px 12px 12px; border-radius: 22px; color: #000;
    background: rgba(246,244,242,.66); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%); }
  .nt-card img { flex: none; width: 38px; height: 38px; border-radius: 9px; margin-top: 1px; }
  .nt-t { flex: 1 1 auto; min-width: 0; }
  .nt-h { display: flex; align-items: baseline; gap: 8px; }
  .nt-h b { flex: 1 1 auto; min-width: 0; font: 600 15px/20px var(--font); letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nt-h span { flex: none; font: 400 13px/18px var(--font); color: rgba(0,0,0,.48); }
  .nt-b { font: 400 15px/20px var(--font); letter-spacing: -.2px; white-space: pre-line; display: -webkit-box; -webkit-box-orient: vertical;
    -webkit-line-clamp: 2; overflow: hidden; }
  .nt-card.open .nt-b { -webkit-line-clamp: 12; }
  .nt-card.open .nt-h b { white-space: normal; }
  /* 收合的同一組：最上面那一則完整，後面的疊成兩片 */
  .nt-pile { position: relative; flex: none; }
  .nt-plate { position: relative; z-index: 1; height: 22px; margin-top: -14px; border-radius: 0 0 20px 20px;
    background: rgba(246,244,242,.5); -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px); }
  .nt-plate + .nt-plate { z-index: 0; margin-left: 12px; margin-right: 12px; background: rgba(246,244,242,.36); }
  .nt-plate:first-of-type { margin-left: 6px; margin-right: 6px; }
  .nt-less { align-self: flex-end; height: 26px; padding: 0 12px; border-radius: 13px; font: 600 13px/26px var(--font); color: #000;
    background: rgba(246,244,242,.66); -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px); }
  .is-interactive .nt-card, .is-interactive .nt-less { cursor: pointer; }
</style>
</head>
<body>
<div class="device" id="d"><div class="dim"></div></div>
<script type="module">
import { fmt, lang, params, loadTrip, chrome, toMin, ready, interactive, duration, loadCategories, categoryName } from './chrome.js';

const d = document.getElementById('d');
const trip = await loadTrip();
const dayNo = +(params.get('day') || 2);
const now = params.get('now') || '10:41';
const start = new Date((params.get('start') || '2026-10-10') + 'T00:00:00');
const date = new Date(start.getTime() + (dayNo - 1) * 864e5);

// LiveActivity.json（逐字）；鎖定畫面日期是系統格式
const S = {
  'zh-Hant-TW': { day: n => `第 ${n} 天`, live: '進行中', remain: '還剩', next: x => `下一站 · ${x}`,
    date: dt => `${dt.getMonth() + 1}月${dt.getDate()}日 ${['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][dt.getDay()]}` },
  en: { day: n => `Day ${n}`, live: 'Now', remain: 'Ends in', next: x => `Next · ${x}`,
    date: dt => `${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][dt.getDay()]}, ${['January','February','March','April','May','June','July','August','September','October','November','December'][dt.getMonth()]} ${dt.getDate()}` },
  ja: { day: n => `${n}日目`, live: '進行中', remain: '残り', next: x => `次 · ${x}`,
    date: dt => `${dt.getMonth() + 1}月${dt.getDate()}日 ${'日月火水木金土'[dt.getDay()]}曜日` },
}[lang];

// TripActivityContent.live：現在進行中的那一則、下一則
const events = trip.days.find(x => x.day === dayNo).events.filter(e => e.start && e.end);
const nowMin = toMin(now);
const i = events.findIndex(e => toMin(e.start) <= nowMin && nowMin < toMin(e.end));
const cur = events[i], next = events[i + 1];
const left = (toMin(cur.end) - nowMin) * 60 - 12;              // Text(timerInterval:) 在跑：差 12 秒的那一幀
const countdown = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
const fraction = (nowMin + 12 / 60 - toMin(cur.start)) / (toMin(cur.end) - toMin(cur.start));
const [hh, mm] = now.split(':');

const brand = '<circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/><path d="M6 8.4v4.2a3.4 3.4 0 0 0 3.4 3.4h5.2"/>';
const refresh = '<path d="M12 4.5A7.5 7.5 0 1 1 5.32 8.6M12 1.5v3M8.6 4.5H12V8"/>';
const nextStop = '<path d="M5 12h11M12 8l4 4-4 4"/><circle cx="19.4" cy="12" r="1.6"/>';

d.insertAdjacentHTML('beforeend', `
  <div class="clock"><div class="date">${S.date(date)}</div><div class="time">${+hh}:${mm}</div></div>
  <div class="lk-col"><div class="la">
    <div class="la-head"><span class="la-icon"><svg viewBox="0 0 24 24">${brand}</svg></span>
      <span class="la-app">TripEZGo · ${fmt(trip.title)}</span><span class="la-day">${S.day(dayNo)}</span>
      <span class="la-refresh"><svg viewBox="0 0 24 24">${refresh}</svg></span></div>
    <div class="la-main">
      <div class="la-l"><div class="la-state"><i></i>${S.live}</div>
        <div class="la-title">${fmt(cur.title)}</div>
        <div class="la-sub">${fmt(`${cur.start} – ${cur.end}`)}${cur.place ? ' · ' + fmt(cur.place.name) : ''}</div></div>
      <div class="la-count"><div class="la-n">${countdown}</div><div class="la-u">${S.remain}</div></div>
    </div>
    <div class="la-bar"><span style="width:${(fraction * 100).toFixed(1)}%"></span></div>
    <div class="la-ends"><span>${cur.start}</span><span>${cur.end}</span></div>
    ${next ? `<div class="la-rule"></div><div class="la-next"><svg viewBox="0 0 24 24">${nextStop}</svg>
      <span class="nm">${fmt(S.next(next.title))}</span><span class="tm">${next.start}</span></div>` : ''}
  </div><div class="nt"></div></div>
  <div class="qa" style="left:46px"><svg viewBox="0 0 24 24"><path d="M9 3h6v4l-1.6 2.2v11.3h-2.8V9.2L9 7z"/><path d="M12 12.5v2"/></svg></div>
  <div class="qa" style="right:46px"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.6"/><path d="M9 7l1.4-2.4h3.2L15 7"/></svg></div>`);


/* ── 鎖定畫面上的 TripEZGo 通知 ────────────────────────────────────────────────
   排哪幾則、什麼時候響照 App：Domain/UseCase/TripReminderUseCase.swift
     出發前 7／3／1 天 09:00（3 天那一則只在還有待辦時）、旅程中每天 07:00 摘要、
     下一則行程＝每一則結束那一刻（後面還有比它晚結束的才排）、班次＝發車前 5 分（坐超過 10 分的再加到站前 5 分）、
     行程前待辦＝開始前 5 分且那一則還有沒做完的待辦；同一分鐘撞在一起的待辦併進下一則／發車那一則
     （ReminderSwitchboard.apply）。標題與內文：TripEZGo/Core/Reminders/TripReminderController.request、
     UI/DesignSystem/TripReminderText.swift；字串 Scripts/i18n/maps/UI.json（ui.reminder.*、ui.nextup.*、
     ui.todoreminder.*、ui.run.*、ui.digest.*）。
   注意：App 對範例旅程（isDemo）不排「行程前待辦」；這裡當成使用者自己的旅程畫。
   第 1 天那些逐則的通知視為已經看過（解鎖過），不列出；出發前三則與兩天的摘要留著，疊在最舊的那一疊。
   畫面：最新的在最上面，最多三則完整，更舊的疊在第三則底下（點一下展開整組）。相對時間照 iOS。 */
const NT = {
  'zh-Hant-TW': { lead7: '旅程快到了', body7: x => `${x}，都準備好了嗎？`, lead3: n => `還有 ${n} 項待辦沒完成`, body3: x => `出發前把 ${x} 的待辦清一清吧`,
    lead1: '明天就出發了', body1: '明天就出發了，今天早點睡吧。', left: n => `還有 ${n} 項待辦。`,
    digest: (n, r) => `今天有 ${n} 個行程，${r}`, nextT: x => `接下來：${x}`, nextB: (a, x) => `${a} 開始 · ${x}`,
    todoT: (x, n) => `下個行程 ${x} 尚有 ${n} 個待辦事項`, item: x => `・${x}`, more: n => `…還有 ${n} 項`, merged: n => ` · 還有 ${n} 項待辦`,
    depT: (r, a) => `${r} ${a} 開`, arrT: (r, a) => `${r} ${a} 到`, runB: (e, x) => `前往 ${e} · ${x}`, unnamed: '預計搭乘的班次',
    ago: m => m < 1 ? '現在' : m < 60 ? `${m}分鐘前` : m < 1440 ? `${Math.floor(m / 60)}小時前` : `${Math.floor(m / 1440)}天前`, less: '顯示較少' },
  en: { lead7: 'Your trip is close', body7: x => `${x} — all set?`, lead3: n => `${n} to-dos still open`, body3: x => `Clear the to-dos for ${x} before you go`,
    lead1: 'You leave tomorrow', body1: 'You leave tomorrow — get an early night.', left: n => `${n} to-dos left.`,
    digest: (n, r) => `${n} events today, ${r}`, nextT: x => `Next: ${x}`, nextB: (a, x) => `Starts ${a} · ${x}`,
    todoT: (x, n) => `${x}: ${n} to-dos left`, item: x => `・${x}`, more: n => `…and ${n} more`, merged: n => ` · ${n} to-dos left`,
    depT: (r, a) => `${r} leaves at ${a}`, arrT: (r, a) => `${r} arrives at ${a}`, runB: (e, x) => `To ${e} · ${x}`, unnamed: 'Your ride',
    ago: m => m < 1 ? 'now' : m < 60 ? `${m}m ago` : m < 1440 ? `${Math.floor(m / 60)}h ago` : `${Math.floor(m / 1440)}d ago`, less: 'Show less' },
  ja: { lead7: '旅行が近づいてきました', body7: x => `${x}、準備はできましたか？`, lead3: n => `やることがあと ${n} 件`, body3: x => `出発前に ${x} のやることを片づけましょう`,
    lead1: '明日は出発です', body1: '明日は出発です。今日は早めに休みましょう。', left: n => `やることがあと ${n} 件あります。`,
    digest: (n, r) => `今日は予定が ${n} 件、${r}`, nextT: x => `このあと：${x}`, nextB: (a, x) => `${a} 開始 · ${x}`,
    todoT: (x, n) => `次の予定「${x}」に未完了の ToDo が ${n} 件あります`, item: x => `・${x}`, more: n => `…ほか ${n} 件`, merged: n => ` · ToDo 残り ${n} 件`,
    depT: (r, a) => `${r} は ${a} 発`, arrT: (r, a) => `${r} は ${a} 着`, runB: (e, x) => `${e} へ · ${x}`, unnamed: '乗車予定の便',
    ago: m => m < 1 ? '今' : m < 60 ? `${m}分前` : m < 1440 ? `${Math.floor(m / 60)}時間前` : `${Math.floor(m / 1440)}日前`, less: '表示を減らす' },
}[lang] || null;
const N = NT || {};
const hm = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
const clip = (s, n) => { const a = Array.from(String(s).replace(/\s*\n\s*/g, ' ').trim()); return a.length > n ? a.slice(0, n).join('').trim() + '…' : a.join(''); };
const todoBody = (items, n) => { const shown = items.slice(0, 3).map(x => N.item(clip(x, 20))); return [...shown, ...(n > shown.length ? [N.more(n - shown.length)] : [])].join('\n'); };

  };
  const FOOT = { nextStop, destination: '<path d="M12 3.4v6.4"/><circle cx="12" cy="14.6" r="3.6"/>' };
  const ALT = { clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7.2V12l3 1.8"/>', warning: '<path d="M12 4 2.5 20h19zM12 10v4M12 17.2v.1"/>' };
  const timer = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`; };

  function body(st, tSec) {
    const t = tSec / 60;
    const glyph = st.glyph ? (st.glyph.maki ? `<svg class="mk" viewBox="0 0 15 15"><path d="${MAKI[st.glyph.maki]}"/></svg>` : GLYPH[st.glyph.mode] || '') : '';
    const sub = [st.time, st.place].filter(Boolean).join(' · ');
    const number = st.to != null ? timer(st.to * 60 - tSec) : st.fixed;
    const frac = st.prog ? Math.min(1, Math.max(0, (t - st.prog[0]) / (st.prog[1] - st.prog[0]))) : 0;
    return `
    <div class="la-main">
      <div class="la-l"><div class="la-state"><i style="background:${st.tight ? 'var(--warning)' : DOT[st.phase]}"></i>${fmt(st.label)}</div>
        <div class="la-title">${glyph ? `<span class="la-gl" style="color:${st.tight ? 'var(--warning)' : '#fff'}">${glyph}</span>` : ''}${fmt(st.title)}</div>
        ${sub ? `<div class="la-sub">${fmt(sub)}</div>` : ''}</div>
      <div class="la-count">${number ? `<div class="la-n">${number}</div>` : ''}${st.unit ? `<div class="la-u">${fmt(st.unit)}</div>` : ''}</div>
    </div>
    ${st.noProgress ? '' : `<div class="la-bar"><span style="width:${(frac * 100).toFixed(1)}%"></span></div>
    <div class="la-ends"><span>${fmt(st.ends[0])}</span><span>${fmt(st.ends[1])}</span></div>`}
    ${st.alt ? `<div class="la-alt${st.tight ? ' warn' : ''}"><svg viewBox="0 0 24 24">${ALT[st.tight ? 'warning' : 'clock']}</svg><span>${fmt(st.alt)}</span></div>` : ''}
    ${st.next ? `<div class="la-rule"></div><div class="la-next"><svg viewBox="0 0 24 24">${FOOT[st.foot]}</svg>
      <span class="nm">${fmt(st.next)}</span>${st.nextAt ? `<span class="tm">${fmt(st.nextAt)}</span>` : ''}</div>` : ''}`;
  }

  const la = d.querySelector('.la'), head = la.querySelector('.la-head'), timeEl = d.querySelector('.time');
  const MIN = toMin('07:00') * 60, MAX = toMin('21:00') * 60;
  let tSec = toMin(now) * 60 + 12;            // 跟截圖同一幀：10:41 又 12 秒
  let shown = Math.floor(tSec / 60), syncBar = null;
  const draw = () => {
    while (head.nextSibling) head.nextSibling.remove();
    head.insertAdjacentHTML('afterend', body(stateAt(tSec / 60), tSec));
    const m = Math.floor(tSec / 60);
    if (m !== shown) { shown = m; timeEl.textContent = `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`; drawNotes(tSec / 60); }
    syncBar?.();
  };
  // 通知：點一則＝展開內文（iOS 點開預覽那樣），再點收回；點疊起來那一疊＝展開整組，「顯示較少」收回
  ntEl.addEventListener('click', (e) => {
    if (e.target.closest('[data-less]')) { ntGroupOpen = false; drawNotes(tSec / 60); return; }
    if (e.target.closest('[data-pile]')) { ntGroupOpen = true; drawNotes(tSec / 60); return; }
    const c = e.target.closest('.nt-card'); if (!c) return;
    const id = +c.dataset.id; ntOpen.has(id) ? ntOpen.delete(id) : ntOpen.add(id); c.classList.toggle('open');
  });
  const setT = v => { tSec = Math.min(MAX, Math.max(MIN, v)); draw(); };
  // 倒數與進度條由系統每秒自己走
  setInterval(() => { if (!document.hidden && !dragging && tSec < MAX) setT(tSec + 1); }, 1000);

  // 撥時間的那一條：07:00–21:00，拖、點軌道、鍵盤（←→ 15 分、PageUp/Down 1 小時、Home/End）。跟拖卡片走同一個 setT。
  d.insertAdjacentHTML('beforeend', `<div class="lk-scrub" role="slider" tabindex="0" aria-label="${S2.scrub}"
    aria-valuemin="${MIN / 60}" aria-valuemax="${MAX / 60}"><div class="lk-scrub-t"></div>
    <div class="lk-scrub-track"><div class="lk-scrub-fill"></div><div class="lk-scrub-thumb"></div></div></div>`);
  const bar = d.querySelector('.lk-scrub'), track = bar.querySelector('.lk-scrub-track');
  syncBar = () => {
    const f = (tSec - MIN) / (MAX - MIN), m = Math.floor(tSec / 60), label = `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
    bar.querySelector('.lk-scrub-fill').style.width = `${(f * 100).toFixed(2)}%`;
    bar.querySelector('.lk-scrub-thumb').style.left = `${(f * 100).toFixed(2)}%`;
    bar.querySelector('.lk-scrub-t').textContent = label;
    bar.setAttribute('aria-valuenow', m); bar.setAttribute('aria-valuetext', label);
  };
  syncBar();
  const fromX = x => { const r = track.getBoundingClientRect(); const f = Math.min(1, Math.max(0, (x - r.left) / r.width));
    return Math.round((MIN + f * (MAX - MIN)) / 60) * 60 + (tSec % 60); };
  let barPid = null;
  bar.addEventListener('pointerdown', (e) => { barPid = e.pointerId; bar.classList.add('active'); dragging = true;
    try { bar.setPointerCapture(barPid); } catch {} setT(fromX(e.clientX)); });
  bar.addEventListener('pointermove', (e) => { if (e.pointerId === barPid) setT(fromX(e.clientX)); });
  const barEnd = (e) => { if (e.pointerId !== barPid) return; barPid = null; dragging = false; bar.classList.remove('active'); };
  bar.addEventListener('pointerup', barEnd); bar.addEventListener('pointercancel', barEnd);
  bar.addEventListener('keydown', (e) => {
    const step = { ArrowRight: 15, ArrowUp: 15, ArrowLeft: -15, ArrowDown: -15, PageUp: 60, PageDown: -60 }[e.key];
    if (step) setT(tSec + step * 60);
    else if (e.key === 'Home') setT(MIN); else if (e.key === 'End') setT(MAX); else return;
    e.preventDefault();
  });
  const used = () => {};

  // 抬頭的「更新」：AdvanceTripActivityIntent——把卡片拉回此刻，不開 App
  const refresh = la.querySelector('.la-refresh');
  refresh.dataset.tap = '';
  refresh.addEventListener('click', (e) => { e.stopPropagation(); refresh.classList.remove('spin'); void refresh.offsetWidth; refresh.classList.add('spin'); draw(); });

  let dragging = false, x0 = 0, t0 = 0, moved = false, pid = null;
  la.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.la-refresh')) return;
    pid = e.pointerId; x0 = e.clientX; t0 = tSec; moved = false; dragging = true;
  });
  la.addEventListener('pointermove', (e) => {
    if (!dragging || e.pointerId !== pid) return;
    const dx = e.clientX - x0;
    if (!moved && Math.abs(dx) < 6) return;
    if (!moved) { moved = true; try { la.setPointerCapture(pid); } catch {} used(); }
    setT(t0 + Math.round(dx) * 60);             // 1px＝1 分
  });
  const end = (e) => {
    if (!dragging || e.pointerId !== pid) return;
    dragging = false;
    if (!moved && e.type === 'pointerup') { used(); setT(tSec + 15 * 60); }   // 點一下＝往後 15 分
  };
  la.addEventListener('pointerup', end);
  la.addEventListener('pointercancel', end);
}
</script>
</body>
</html>
