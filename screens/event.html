      if (!st.on) {
        if (dy < -8) { st = null; return; }
        if (dy < 8) return;
        st.on = true;
        try { el.setPointerCapture(st.id); } catch { /* 已放開 */ }
        el.style.transition = 'none';
      }
      st.dy = Math.max(0, dy - 8);
      el.style.transform = `translateY(${st.dy}px)`;
    });
    const up = () => {
      if (!st) return;
      const s = st; st = null;
      if (!s.on) return;
      swallowClick = true; setTimeout(() => { swallowClick = false; }, 0);
      el.style.transition = '';
      const v = s.dy / Math.max(1, performance.now() - s.t0);
      if (s.dy > 120 || v > 0.7) { el.style.transform = 'translateY(105%)'; onClose(); }
      else el.style.transform = '';
    };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  }
  const closeMain = () => { sheet.style.transition = 'transform .25s ease-in'; sheet.style.transform = 'translateY(100%)'; setTimeout(back, 230); };
  // 觸控只從頂端那一條（抓桿＋導覽列）拖——其他地方留給首頁捲動；滑鼠哪裡都能拖
  sheet.insertAdjacentHTML('afterbegin', '<div class="dragzone"></div>');
  dragToDismiss(sheet, {
    allow: e => !sub && (e.pointerType === 'mouse' || e.target.closest('.dragzone, .grabber, .glass')),
    onClose: () => setTimeout(back, 200),
  });
  d.insertAdjacentHTML('beforeend', '<div class="above" id="above"></div>');
  document.getElementById('above').addEventListener('click', () => { if (!sub) closeMain(); });

  // ── 子紙：延後／提前、附件預覽、刪除確認 ──
  let sub = null;
  d.insertAdjacentHTML('beforeend', '<div class="dim2" id="dim2" hidden></div>');
  const dim2 = document.getElementById('dim2');
  function present(html, { pushBack = true } = {}) {
    dim2.hidden = false;
    d.insertAdjacentHTML('beforeend', html);
    sub = d.lastElementChild;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      dim2.classList.add('on'); sub.classList.add('on');
      if (pushBack) sheet.classList.add('back');
    }));
    return sub;
  }
  function dismiss() {
    if (!sub) return;
    const el = sub; sub = null;
    el.style.transition = ''; el.classList.remove('on');
    if (el.classList.contains('ssheet')) el.style.transform = 'translateY(105%)';
    dim2.classList.remove('on'); sheet.classList.remove('back');
    setTimeout(() => { el.remove(); if (!sub) dim2.hidden = true; }, 340);
  }
  dim2.addEventListener('click', () => { if (sub && !sub.classList.contains('alert')) dismiss(); });

  // 延後／提前
  function openShift() {
    let later = true;
    const rows = n => Array.from({ length: n }, (_, i) => `<div class="wr" data-v="${i}">${i}</div>`).join('');
    const el = present(`<div class="ssheet" role="dialog" aria-label="${W.shiftTitle}"><div class="grabber"></div>
      <div class="subnav"><span>${esc(W.shiftTitle)}</span></div>
      <div class="subbody">
        <div class="dirs"><div class="schip on" data-dir="1" data-tap>${W.later}</div><div class="schip" data-dir="0" data-tap>${W.earlier}</div></div>
        <div class="wheel"><div class="band"></div>
          <div class="wcol" data-u="h" tabindex="0" aria-label="${W.hours}">${rows(24)}</div><div class="wlab">${W.hours}</div>
          <div class="wcol" data-u="m" tabindex="0" aria-label="${W.mins}">${rows(60)}</div><div class="wlab">${W.mins}</div>
        </div>
        <p class="hint">${esc(W.scope)}</p>
      </div>
      <div class="sep"></div>
      <div class="primary" data-apply data-tap>${W.apply}</div></div>`);
    const [hc, mc] = el.querySelectorAll('.wcol');
    const ROW = 32;
    const val = c => Math.max(0, Math.round(c.scrollTop / ROW));
    hc.scrollTop = ROW;   // 預設一小時（applyDefaultDuration）
    let settle = 0;
    const onScroll = () => {
      clearTimeout(settle);
      settle = setTimeout(() => {
        // .countDownTimer 生不出 0：轉到 0 小時 0 分會自己跳到 1 分
        if (val(hc) === 0 && val(mc) === 0) mc.scrollTo({ top: ROW, behavior: 'smooth' });
      }, 160);
    };
    [hc, mc].forEach(c => {
      c.addEventListener('scroll', onScroll);
      c.addEventListener('click', e => { const r = e.target.closest('.wr'); if (r) c.scrollTo({ top: +r.dataset.v * ROW, behavior: 'smooth' }); });
      c.addEventListener('keydown', e => {
        if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
        e.preventDefault(); c.scrollTo({ top: (val(c) + (e.key === 'ArrowDown' ? 1 : -1)) * ROW, behavior: 'smooth' });
      });
    });
    el.querySelector('.dirs').addEventListener('click', e => {
      const c = e.target.closest('.schip'); if (!c) return;
      later = c.dataset.dir === '1';
      el.querySelectorAll('.schip').forEach(x => x.classList.toggle('on', x === c));
    });
    el.querySelector('[data-apply]').addEventListener('click', () => {
      const minutes = val(hc) * 60 + val(mc);
      if (minutes <= 0) return;
      apply(later ? minutes : -minutes);
    });
    dragToDismiss(el, { allow: e => !e.target.closest('.wheel'), onClose: dismiss });
  }
  function apply(minutes) {
    const day = trip.days.find(x => x.day === dayNo);
    const list = day.events.filter(e => e.start && e.end)
      .map(e => ({ key: e.key, src: e, start: toMin(e.start), end: toMin(e.end), cancelled: !!e.isCancelled }))
      .sort((a, b) => a.start - b.start || a.end - b.end);
    const anchor = list.find(e => e.key === key);
    const before = new Map(list.map(e => [e.key, e.start]));
    const r = shiftFrom(anchor, list, minutes);
    for (const e of list) {
      if (e.start === before.get(e.key)) continue;
      e.src.start = clock(e.start); e.src.end = clock(e.end);
      patchEvent(e.key, { start: e.src.start, end: e.src.end });
    }
    document.getElementById('range').innerHTML = escD(`${ev.start} – ${ev.end}`);
    const edge = W.edge(minutes > 0);
    const msg = !r.moved ? W.stuck(edge)
      : W.shifted(minutes > 0, r.moved, duration(Math.abs(minutes))) + (r.clamped ? W.clamped(r.clamped, edge) : '') + (r.blocked ? W.blocked(r.blocked, edge) : '');
    dismiss();
    setTimeout(() => toast(msg), 200);
  }

  // 刪除確認
  function openDelete() {
    const el = present(`<div class="alert" role="alertdialog" aria-label="${attr(W.delAsk)}"><b>${esc(W.delAsk)}</b><p>${esc(W.delMsg)}</p>
      <div class="abtns"><div class="abtn pref" data-a="back" data-tap tabindex="0">${esc(W.back)}</div><div class="abtn red" data-a="del" data-tap tabindex="0">${esc(W.del)}</div></div></div>`, { pushBack: false });
    el.querySelector('[data-a="back"]').focus({ preventScroll: true });
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-a]'); if (!b) return;
      if (b.dataset.a === 'back') return dismiss();
      patchEvent(key, { deleted: true });
      dismiss();
      setTimeout(closeMain, 120);
    });
  }

  // 附件預覽
  function openFile(f) {
    const body = f.kind === 'link'
      ? `<div class="web"><div class="pg"><i class="h"></i><i></i><i></i><i style="width:70%"></i><i></i><i style="width:55%"></i></div>
         <div class="bar">${esc((() => { try { return new URL(f.url).host; } catch { return f.name; } })())}</div></div>`
      : f.kind === 'image'
        ? `<div class="photo">${ic('photo')}</div>`
        : `<div class="page"><i class="h"></i><i></i><i></i><i style="width:80%"></i><i></i><i style="width:60%"></i><i></i><i></i><i style="width:40%"></i></div>`;
    const el = present(`<div class="ssheet full" role="dialog" aria-label="${attr(f.name)}"><div class="grabber"></div>
      <div class="glass pclose" data-tap aria-label="${W.close}">${ic('close')}</div>
      <div class="subnav"><span>${esc(f.name)}</span></div>
      <div class="pbody">${body}</div></div>`);
    el.querySelector('.pclose').addEventListener('click', dismiss);
    dragToDismiss(el, { allow: e => e.pointerType === 'mouse' || e.clientY - el.getBoundingClientRect().top < 76, onClose: dismiss });
  }

  // ── 導覽列 ──
  nav.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act;
    if (act === 'cancel') {
      ev.isCancelled = !ev.isCancelled;
      patchEvent(key, { cancelled: ev.isCancelled });
      h1.classList.toggle('cx', ev.isCancelled);
      nav.innerHTML = navHTML(); label();
    } else if (act === 'shift') openShift();
    else if (act === 'delete') openDelete();
    else if (act === 'opening' || act === 'closing') {
      const field = act === 'opening' ? 'openingDays' : 'closingDays';
      const on = pinned(act);
      ev[field] = on ? (ev[field] || []).filter(n => n !== backDay) : [...(ev[field] || []), backDay];
      patchEvent(key, { [field]: ev[field] });
      // 一天只有一則開始、一則結束：別的全日行程讓出這一天
      if (!on) for (const a of trip.allDayEvents) {
        if (a === ev || !(a[field] || []).includes(backDay)) continue;
        a[field] = a[field].filter(n => n !== backDay);
        patchEvent(a.key, { [field]: a[field] });
      }
      nav.innerHTML = navHTML(); label();
      toast((on ? W.pinUnset : W.pinSet)(t.day(backDay), W[act]));
    }
    // 編輯：這裡沒有複刻編輯表單，只給按壓回饋
  });

  // ── 待辦 ──
  todosEl.addEventListener('click', e => {
    const box = e.target.closest('[data-todo]');
    if (box) {
      const i = +box.dataset.todo;
      if (done.has(i)) done.delete(i); else { done.add(i); sticky.add(i); }
      patchEvent(key, { done: [...done] });
    } else if (e.target.closest('[data-tog]')) {
      const showsRows = [...done].some(i => showsCompleted || sticky.has(i));
      if (showsRows) { showsCompleted = false; sticky.clear(); } else showsCompleted = true;
    } else return;
    todosEl.innerHTML = todosHTML();
  });

  // ── 附件 ──
  document.getElementById('body').addEventListener('click', e => {
    const r = e.target.closest('[data-file]'); if (r) openFile(files[+r.dataset.file]);
  });
}

chrome(d);
if (ipad) {
  // iPad：sheet 底下是同一天的行事曆（iPhone 的 large detent 把後面整片壓成灰，看不到——那邊不畫）
  const q = new URLSearchParams({ lang, day: backDay, device: 'ipad', ...(params.get('start') ? { start: params.get('start') } : {}) });
  d.insertAdjacentHTML('afterbegin', `<iframe class="bg" id="bg" src="calendar.html?${q}"></iframe><div class="dim"></div>`);
  const bg = document.getElementById('bg');
  await new Promise(res => { const tick = () => bg.contentDocument?.body?.dataset.ready === '1' ? res() : setTimeout(tick, 50); tick(); });
  // 狀態列是系統的，不在暗層底下：底下那一頁的拿掉，留這一頁畫的那一條
  bg.contentDocument.querySelector('.sb')?.remove();
}
ready();
</script>
</body>
