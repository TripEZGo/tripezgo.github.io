<meta name="viewport" content="width=402">
<title>資料・筆記</title>
<!--
  資料分頁・筆記清單（App：Modules/Notes/…/NotesViewController.swift ＋ UI/…/NoteList/）。
  參數：?lang=zh-Hant-TW|en|ja &menu=1（點了右上工具鈕那一刻：「工具」挑一個的紙開著）
  抬頭「資料」＋右上工具鈕＋兩格切換同 shop（tools.js libraryHead；1.3.0 起，設計稿 ui-card-v130 第 1–3 節）；
  搜尋列、標籤鈕、列照 NoteListMetrics.swift ＋ screens/ref/zh/tools.png。
  內容：範本 data/sanyo.<lang>.json 的 notes（一則）；摘要是內文接起來、提及寫成「@行程標題」，一行截斷。
  互動模式：點列開筆記內頁（note.html），搜尋列打字就篩（標題＋內文）；工具鈕開挑一個的紙 → 掃描（scan.html）／匯率換算（fx.html）。
-->
<link rel="stylesheet" href="screen.css?v=7e1e128cfb">
<style>
  .ic { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }

  /* 上緣 14（NotesViewController.subTabTopInset）；左右 20、控制列間距 8（NoteListMetrics） */
  .ctl { position: absolute; left: 20px; right: 20px; top: 184px; display: flex; gap: 8px; }
  /* 搜尋：高 44、左右 12、間距 8、圖示 17／1.9；sunken 底、圓角 8、1px border（NoteSearchField） */
  .search { flex: 1; height: 44px; padding: 0 12px; display: flex; align-items: center; gap: 8px; background: var(--sunken);
    border: 1px solid var(--border); border-radius: 8px; color: var(--muted); }
  .search svg { width: 17px; height: 17px; stroke-width: 1.9; flex: none; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: 400 var(--t-base)/18px var(--font); color: var(--ink); }
  .search input::placeholder { color: var(--muted); opacity: 1; }
  .tagb { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border-soft); background: var(--card); display: grid; place-items: center; color: var(--muted); }
  .tagb svg { width: 20px; height: 20px; stroke-width: 1.8; }
  /* 列：上下 12、左右 4；標題 base semibold、摘要 sm muted、上 2，都一行截斷；列底 border-soft */
  .list { position: absolute; left: 20px; right: 20px; top: 240px; }
  .row { padding: 12px 4px; border-bottom: 1px solid var(--border-soft); }
  .row b { display: block; font: 600 var(--t-base)/18px var(--font); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row span { display: block; margin-top: 2px; font: 400 var(--t-sm)/17px var(--font); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fab { position: absolute; right: 16px; top: 723px; width: 52px; height: 52px; border-radius: 50%; background: var(--card); z-index: 30;
    border: 1px solid var(--border); box-shadow: 0 6px 18px -8px rgba(31,25,20,.22), 0 4px 14px rgba(31,25,20,.06); display: grid; place-items: center; color: var(--ink); }
  .fab svg { width: 22px; height: 22px; stroke-width: 2; }
</style>
</head>
<body>
<div class="device" id="d"></div>
<script type="module">
import { lang, loadTrip, chrome, ready, fmt, interactive, go } from './chrome.js';
import { libraryHead, subTabs } from './tools.js';

const d = document.getElementById('d');
const trip = await loadTrip();

// App 的字（UI.json ui.search.notes；抬頭與分格的字在 tools.js LIB）
const s = {
  'zh-Hant-TW': { search: '搜尋筆記' },
  en: { search: 'Search notes' },
  ja: { search: 'メモを検索' },
  ko: { search: '메모 검색' },   // ui.search.notes
}[lang];

// DesignIcon.swift：search、tag、plus
const IC = {
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  tag: '<path d="M3 12V5a2 2 0 0 1 2-2h7l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.4"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

const TAB = 1;

// 提及 {@key} 解成「@行程標題」（摘要是純文字，不上色）
const titles = {};
(function walk(o) {
  if (Array.isArray(o)) return o.forEach(walk);
  if (o && typeof o === 'object') { if (o.key && o.title) titles[o.key] = o.title; Object.values(o).forEach(walk); }
})(trip);
const plain = p => p.replace(/\{@([^}]+)\}/g, (_, k) => `@${titles[k] || k}`);
const notes = trip.notes.map(n => ({ title: n.title, summary: n.paragraphs.map(plain).join(' ') }));

d.insertAdjacentHTML('beforeend', `
  <div class="ctl"><label class="search">${ic('search')}<input placeholder="${s.search}" aria-label="${s.search}"${interactive ? '' : ' disabled'}></label>
    <div class="tagb">${ic('tag')}</div></div>
  <div class="list">${notes.map((n, i) => `<div class="row" data-n="${i}"><b>${fmt(n.title)}</b><span>${fmt(n.summary)}</span></div>`).join('')}</div>
  <div class="fab">${ic('plus')}</div>`);

chrome(d, { tab: 4 });
libraryHead(d, TAB);   // 畫在分頁列之後：menu=1 的紙要蓋在分頁列上
ready();

if (interactive) {
  subTabs(d, TAB);
  d.insertAdjacentHTML('beforeend', '<style>.row { cursor: pointer; } .row:active { background: var(--surface); }</style>');
  d.querySelector('.list').addEventListener('click', (e) => { if (e.target.closest('.row')) go('note'); });
  const q = d.querySelector('.search input');
  q.addEventListener('input', () => {
    const k = q.value.trim().toLowerCase();
    d.querySelectorAll('.row').forEach((r, i) => { r.hidden = !!k && !`${notes[i].title} ${notes[i].summary}`.toLowerCase().includes(k); });
  });
  d.addEventListener('pointerdown', (e) => { if (!e.target.closest('.search')) q.blur(); });   // 點空白收鍵盤
}
</script>
</body>
</html>
