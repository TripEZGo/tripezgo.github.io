<!--

  Home/Canvas/HomeOverview.swift；版面規則 Domain/Model/HomeLayout.swift；ADR-0055、ADR-0059）。

  參數：?lang=zh-Hant-TW|en|ja|ko
        &start=2026-10-30（第 1 天的日期）&today=1（第幾天是今天）&now=09:53:00（旅程時區的現在；即時動態那一格用，靜態不跳秒）
        &edit=1        編輯模式（長按空白進去）：左上「＋」右上「完成」、封面可藏項目左邊的「−」、卡片左上的「−」、頁面點點（多一頁空頁）
        &page=N        第幾頁（0 起算；預設 0）
        &veil=1        免費帳號第二頁以後的毛玻璃（HomeCanvasView 的 premium veil）；page 要 ≥ 1
        &layout=live:m,overview:m,scan:s,fx:s     每頁用 | 隔開、頁內用 , 隔開；尺寸 s／m／l；
                       預設＝App 的預設版面（D152）：即時動態中、總覽中、QR Code 小＋匯率換算小
        &hide=today,dates,place,progress           封面藏起來的項目（HomeCoverItem）
        &edit=1&…  編輯模式下不畫那一頁以外的東西

  可畫的小工具（1.8.0 起 App 的每一支、每一種尺寸；id＝layout 與 solo 用的短名，尺寸 s／m／l）：
    overview（總覽）m l　weather（天氣）s m l　steps（步數）s m l　live（即時動態）m l　agenda（行程，進行中那一種）s m l
    files（附件）s m l　todo（今日待辦）s m l　shopping（購物）s m l　fx（匯率換算）s m l　trips（旅程）s m
    noteView（檢視筆記）s m l　noteList（筆記列表）s m l　inspiration（靈感）s m　scan（QR Code）s
  一般畫布上，舊的六支（live overview scan fx agenda todo）維持原本的畫法（商城截圖靠它們，一格都不動）；新的 id 照 App 畫。
        &solo=<id>:<s|m|l>   官網示範用：只畫那一張卡（例 ?solo=weather:m&lang=en&theme=dark），大小就是 402 寬畫布上的樣子
                       （格 81.5、格距 12：小 175×175、中 362×175、大 362×362），放在左上 16、.device 剛好是卡片＋四周各 16、
                       頁面透明底、沒有封面／狀態列／分頁列／編輯角標。today 預設 2（宮島那天）、now 預設 10:41:00；
                       solo 時所有尺寸都照 App 的卡片畫（含舊六支沒畫過的 s／l）；today／now 決定「今天」那一天的內容。
  互動模式（interactive=1，只給 App 內／官網的自動示範；截圖模式不變）：長按封面或畫布空白＝進編輯；編輯中長按小工具拖曳換位置
  （由上往下、由左往右第一個放得下，放不下的往後排）；點「完成」離開；橫向拖曳換頁；veil＝1 時毛玻璃底下照樣畫第二頁以後的內容，

<style>
  :root { --mono: ui-monospace, "SF Mono", Menlo, monospace; --scrim-solid: #1f1914; }

  .cv-ai { position: absolute; z-index: 4; right: calc(12px + 44px + var(--rr, 0px)); top: calc(62px + var(--dt, 0px)); width: 44px; height: 44px; display: grid; place-items: center; }
  .cv-ai i { width: 35.5px; height: 35.5px; border-radius: 50%; background: rgba(255,255,255,.92); color: var(--accent-ink); display: grid; place-items: center; }

  .cv-prow { margin-top: 12px; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .cv-prow .cv-place { margin-top: 0; min-width: 0; flex: 0 1 auto; }

  .cv-share svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

function pack(items) {
  const used = Array.from({ length: ROWS }, () => Array(COL).fill(false)), out = [];
  for (const it of items) {
    const [w, h] = SIZE[it.sz];
    let done = false;
    for (let r = 0; r + h <= ROWS && !done; r++) for (let c = 0; c + w <= COL && !done; c++) {
      let ok = true;
      for (let i = 0; i < h && ok; i++) for (let j = 0; j < w && ok; j++) if (used[r + i][c + j]) ok = false;
      if (!ok) continue;
      for (let i = 0; i < h; i++) for (let j = 0; j < w; j++) used[r + i][c + j] = true;
      out.push({ ...it, src: it, r, c, w, h }); done = true;

const ICO_OF = { walking: 'walking', driving: 'driving', cycling: 'cycling', transit: 'transit', other: 'ellipsis' };
const MODE_NAME = { walking: W.legModeWalking, driving: W.legModeDriving, cycling: W.legModeCycling, transit: W.legModeTransit, other: W.legModeOther };
// 這一則行程自己的交通（Event.leg）：有選班次寫「出發時刻 班次 · 時間」，沒有寫「交通方式 時間」（WidgetText.run／leg）
const legOf = e => {
  const L = e.leg; if (!L || !(L.durationMinutes > 0)) return null;
  const run = L.runs?.[L.selectedRunIndex ?? -1];
  const label = run?.name && run.departure ? `${run.departure} ${run.name} · ${duration(L.durationMinutes)}` : `${MODE_NAME[L.mode] || ''} ${duration(L.durationMinutes)}`.trim();
  return { label, icon: ICO_OF[L.mode] || 'clock', minutes: L.durationMinutes };
};
const evRow = (e, o = {}) => {
  const live = cur && e === cur, done = e.e2 * 60 <= nowSec && !live;
  const tr = o.status === false ? '' : live ? W.stateLive : done ? W.stateDone : categoryName(e.category);
  return `<div class="n-ev${o.sz === 'l' ? ' l' : ''}${o.first ? ' first' : ''}"><span class="tm">${clock(e.s)}</span><span class="nm${live ? ' live' : ''}${done ? ' done' : ''}">${fmt(e.title)}</span>${tr ? `<span class="st${live ? ' live' : ''}">${fmt(tr)}</span>` : ''}</div>`;
};
const trRow = (e, sz) => { const g = legOf(e); return g ? `<div class="n-tr${sz === 'l' ? ' l' : ''}"><span class="ic">${ni(g.icon)}</span><span>${fmt(g.label)}</span></div>` : ''; };

// ── 行程（AgendaCard）：進行中那一種；沒有進行中的就是「下一站」那一種 ──
MOD.agenda = sz => {
  const stamp = sz === 's' ? W.dayNumber(todayNo) : sz === 'l' ? `${todayText} · ${W.dayNumber(todayNo)}` : `${mdOf(today)} · ${W.dayNumber(todayNo)}`;
  const live = !!cur, focus = cur || timed.find(e => e.s * 60 > nowSec);
  if (!focus) return hd(W.doneToday, stamp);
  const after = timed.filter(e => e.s > focus.s);
  const left = Math.max(1, Math.round(((live ? focus.e2 : focus.s) * 60 - nowSec) / 60));
  const prefix = live || sz === 's' ? W.remainPrefix : W.startsAtRemainPrefix(clock(focus.s));
  const answer = `<div class="n-ans${sz === 's' ? ' sm' : ''}">${live ? '<i></i>' : ''}<b>${fmt(focus.title)}</b></div>` +
    `<div class="n-rem">${fmt(prefix)}<b>${fmt(duration(left))}</b>${live && sz !== 's' ? fmt(W.endsAtSuffix(clock(focus.e2))) : ''}</div>`;
  const top = hd(live ? W.stateLive : W.nextStop, stamp);
  if (sz === 's') {
    const n1 = after[0];
    const line = live
      ? (n1 ? `<div class="n-nl s"><div class="h"><b>${fmt(W.nextStop)}</b><span class="tm">${clock(n1.s)}</span></div><div class="v">${fmt(n1.title)}</div></div>`
        : `<div class="n-nl s"><div class="h"><b>${fmt(W.doneToday)}</b></div></div>`)
      : `<div class="n-nl s"><div class="h"><b>${fmt(W.startsAt(clock(focus.s)))}</b></div><div class="v">${fmt(after.length ? W.stopsAfter(after.length) : W.lastStopToday)}</div></div>`;
    return top + answer + sp + line;
  }
  if (sz === 'm') {
    const rows = after.slice(0, 2).map((e, i) => evRow(e, { first: i === 0 })).join('');
    return top + answer + hairl('m') + rows + (after.length ? '' : `<div class="n-tr"><span class="ic">${ni('clock')}</span><span>${fmt(live ? W.nothingAfter : W.lastStopToday)}</span></div>`) + sp;
  }
  // 大：全日行程一列、接下來每一站（各自帶它的交通）、底下合計
  const allDay = (trip.allDayEvents || []).find(e => e.fromDay <= todayNo && todayNo <= Math.max(e.fromDay, e.toDay));
  const stops = timed.filter(e => e.e2 * 60 > nowSec).slice(0, 7);
  const transit = after.reduce((a, e) => a + (legOf(e)?.minutes || 0), 0);
  return top + answer + hairl('l') +
    (allDay ? `<div class="n-ad"><span class="tm">${fmt(W.allDay)}</span><span class="nm">${fmt(allDay.title)}</span></div>` : '') +
    stops.map((e, i) => `<div class="n-g" data-trim>${evRow(e, { first: i === 0, sz: 'l' })}${trRow(e, 'l')}</div>`).join('') + sp +
    sm(after.length ? W.stopsRemaining(after.length + (live ? 0 : 1)) : W.doneToday, transit > 0 ? W.transitAhead(transit) : null);
};

  }
  const covering = (trip.allDayEvents || []).filter(e => e.fromDay <= todayNo && todayNo <= Math.max(e.fromDay, e.toDay)).sort((a, b) => (b.key === 'jr-pass') - (a.key === 'jr-pass'));
  for (const e of covering) {
    if (e.key === 'jr-pass') carried.push({ name: C.pdf, kind: 'pdf', size: SIZE_OF.pdf }, { name: C.jpg, kind: 'image', size: SIZE_OF.image });
    (e.files || []).forEach(f => carried.push({ name: f.title, kind: 'image', size: SIZE_OF.image }));

// ── 待辦（TodosCard） ──

// ── 步數（HomeStepsCardView／HomeStepsBars）：旅程中。每天的步數是示範值；今天只走到現在這個時間 ──
const STEPS_FULL = [11260, 15840, 19230, 12780, 21460, 9040], FLIGHTS_FULL = [8, 14, 21, 11, 18, 9];
const dayFrac = Math.min(1, Math.max(.12, (nowSec / 60 - 420) / 900));
const stDays = () => Array.from({ length: Math.min(todayNo, trip.dayCount) }, (_, k) => {
  const n = k + 1, f = n === todayNo ? dayFrac : 1, v = STEPS_FULL[k % 6], fl = FLIGHTS_FULL[k % 6];
  return { n, isToday: n === todayNo, steps: Math.round(v * f / 10) * 10, flights: Math.round(fl * f), label: n === todayNo ? W.today : mdOf(dateOf(n)) };
});
const stAmount = steps => { const [pre, suf] = W.stepsCount('\u0001').split('\u0001'); return { num: pre + grouped(steps), unit: suf.trim() }; };
const stKm = steps => { const km = (Math.round(steps * 0.0007 * 10) / 10).toFixed(1); return CLG === 'ko' ? `${km}${C.km}` : `${km} ${C.km}`; };
const metricRow = (icon, text) => `<div class="n-mr">${ni(icon)}<span>${fmt(text)}</span></div>`;
MOD.steps = sz => {
  const days = stDays(), td = days[days.length - 1], tripSteps = days.reduce((a, x) => a + x.steps, 0);
  const note = sz === 's' ? W.today : W.progressDuring(td.n, trip.dayCount);
  const head_ = ch('<circle class="fill" cx="13" cy="4" r="2"/><path d="M11.5 8.5 9 13l3 2 1 6M13.5 8.5l2 3.5 3 1M12 15l-3 6"/>', W.stepsTitle, note);
  const rows = `<div class="n-mrs">${metricRow('dist', stKm(td.steps))}${metricRow('stairs', W.stepsFlightsCount(td.flights))}</div>`;
  if (sz === 's') { const a = stAmount(td.steps); return head_ + `<div class="n-samt"><b>${fmt(a.num)}</b><span>${fmt(a.unit)}</span></div>` + sp + rows; }
  const col = (cap, steps, big_) => { const a = stAmount(steps); return `<div class="n-tc"><span class="cap">${fmt(cap)}</span><b class="${big_ ? 'big' : 'mid'}">${fmt(a.num)}</b><span class="u">${fmt(a.unit)}</span></div>`; };
  const totals = `<div class="n-tot">${col(W.today, td.steps, true)}<i></i>${col(W.stepsTrip, tripSteps, false)}</div>`;
  const shown = days.slice(-7), max = Math.max(...shown.map(x => x.steps), 1);
  if (sz === 'm') {
    return head_ + totals + `<div class="n-bars">${shown.map(x => `<div class="b${x.isToday ? ' t' : ''}"><div class="well"><i style="height:${Math.max(3, Math.round(x.steps / max * 60))}px"></i></div><span>${fmt(x.label)}</span></div>`).join('')}</div>`;
  }
  return head_ + totals + rows.replace('n-mrs', 'n-mrs l') + `<div class="n-dr">${shown.slice().reverse().map(x => `<div class="r${x.isToday ? ' t' : ''}"><span class="d">${fmt(x.label)}</span><span class="tr"><i style="width:${Math.max(2, Math.round(x.steps / max * 1000) / 10)}%"></i></span><span class="c">${grouped(x.steps)}</span></div>`).join('')}</div>`;
};

// ── 即時動態 大（LiveActivityHomeCard，isLarge）：中的那一套＋進度條兩端的時刻＋「今天接下來」幾列 ──
MOD.live = sz => {
  if (sz !== 'l' || !cur) return BODY.live();
  const left = cur.e2 * 60 - nowSec, frac = (nowSec - cur.s * 60) / ((cur.e2 - cur.s) * 60);
  const up = timed.filter(e => e.s > cur.s).slice(0, 4);
  return `<div class="la-head"><span class="la-icon"><svg viewBox="0 0 24 24">${P.brand}</svg></span>
      <span class="la-app">TripEZGo · ${fmt(trip.title)}</span><span class="la-day">${S.day(todayNo)}</span></div>
      <div class="la-main"><div class="la-l"><div class="la-state"><i></i>${S.live}</div>
        <div class="la-title">${fmt(cur.title)}</div>
        <div class="la-sub">${fmt(`${clock(cur.s)} – ${clock(cur.e2)}`)}${cur.place ? ' · ' + fmt(cur.place.name) : ''}</div></div>
        <div class="la-count"><div class="la-n">${hms(left)}</div><div class="la-u">${S.remain}</div></div></div>
      <div class="la-bar"><span style="width:${(frac * 100).toFixed(1)}%"></span></div>
      <div class="la-lab"><span>${clock(cur.s)}</span><span>${clock(cur.e2)}</span></div>
      ${up.length ? `<div class="la-up"><div class="h">${fmt(W.liveUpcomingHead)}</div>${up.map(e => `<div class="r"><span class="tm">${clock(e.s)}</span><span class="nm">${fmt(e.title)}</span></div>`).join('')}</div>` : ''}
      ${nxt ? `<div class="la-foot"><div class="la-rule"></div><div class="la-next"><svg viewBox="0 0 24 24">${P.nextStop}</svg>
        <span class="nm">${fmt(S.next(nxt.title))}</span><span class="tm">${clock(nxt.s)}</span></div></div>` : ''}`;
};
// 一般畫布上沒做過的尺寸也有得畫；舊的六支在一般畫布維持原樣（商城截圖靠它們）
const LEGACY_IDS = new Set(['live', 'overview', 'scan', 'fx', 'agenda', 'todo']);
const PLAIN = new Set(['live', 'overview', 'scan']);   // 沿用舊的標記（solo 時 live 中／overview／scan 本來就對）
MOD.overview = () => BODY.overview(); MOD.scan = () => BODY.scan();
const useModern = it => !!MOD[it.id] && (solo || !LEGACY_IDS.has(it.id));

const card = (it, at) => {
  let x = CL + SIDE + it.c * (CELL + GAP), y = TOP + it.r * (CELL + GAP), w = it.w * CELL + (it.w - 1) * GAP, h = it.h * CELL + (it.h - 1) * GAP;
  if (at) ({ x, y, w, h } = at);
  const modern = useModern(it);
  const body = modern ? MOD[it.id](it.sz) : BODY[it.id] ? BODY[it.id](it) : '';
  return `<div class="card sz-${it.sz}${it.id === 'live' ? ' dark' : ''}${it.id === 'overview' ? ' ov' : ''}${modern && !PLAIN.has(it.id) ? ' nw' : ''}" data-id="${it.id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${badge}<div class="in">${body}</div></div>`;
};

if (!solo) {
const pager = document.createElement('div'); pager.className = 'pager'; d.append(pager);
const shown = edit ? [...pages, []] : [...pages];
while (shown.length <= pageNo) shown.push([]);   // veil=1&page=1：第二頁以後的內容免費帳號看不到，頁還是在
const PG = [];   // 互動用：每頁 { el, items, packed }
shown.forEach((items, i) => {
  const pg = document.createElement('div'); pg.className = 'pg'; pg.style.left = `${(i - pageNo) * AVAIL}px`;
  const packed = pack(items);
  const veilHere = veil && i >= 1;
  // 毛玻璃底下照樣畫那一頁的內容（基準圖：模糊的卡片隱約透出來）
  pg.innerHTML = packed.map(it => card(it)).join('');
  const nCards = pg.children.length;
  if (veilHere) pg.insertAdjacentHTML('beforeend', `<div class="veil"><div class="lk">${sv('lock')}</div><h3>${fmt(S.veilTitle)}</h3><p>${fmt(S.veilBody)}</p><div class="go" data-tap>${fmt(S.veilGo)}</div></div>`);
  pager.append(pg);
  if (nCards) packed.forEach((it, k) => { it.el = pg.children[k]; });
  PG.push({ el: pg, items, packed });
});
d.insertAdjacentHTML('beforeend', `<div class="dots" style="z-index:2">${shown.map((_, i) => `<i${i === pageNo ? ' class="on"' : ''}></i>`).join('')}${interactive && !edit ? '<i class="x"></i>' : ''}</div>`);

// ════════ 互動模式（自動示範用；截圖模式不跑這一段） ════════
if (interactive) {
  const root = document.documentElement;
  const canvasTop = 322 + DEV.top;                                   // 畫布起點（封面 62 + 260）
  const setEdit = on => { root.classList.toggle('edit', on); d.classList.toggle('edit', on); };
  const slot = it => ({ x: CL + SIDE + it.c * (CELL + GAP), y: TOP + it.r * (CELL + GAP) });
  const box = it => { const { x, y } = slot(it); return [x, y, x + it.w * CELL + (it.w - 1) * GAP, y + it.h * CELL + (it.h - 1) * GAP]; };
  // 換位置：把 items 重新排穩（pack），其餘的卡片動畫到新格子；被拖的那張跟著手指
  function reflow(pgs, skipEl) {
    pgs.packed = pack(pgs.items);
    pgs.packed.forEach((it, k) => { it.el = it.src.el; if (it.el === skipEl) return; const { x, y } = slot(it); it.el.style.left = x + 'px'; it.el.style.top = y + 'px'; });
  }
  PG.forEach(pgs => pgs.packed.forEach(it => { it.src.el = it.el; }));   // 卡片元素記在原本的 item 上，重排之後還找得到

  // 長按封面或畫布空白＝進編輯（HomeViewController.editLongPress；小工具自己的長按是系統選單，這裡不處理）
  document.addEventListener('pointerdown', e => {
    if (root.classList.contains('edit')) return;
    if (e.target.closest('.card, .veil, .tabbar')) return;
    const x0 = e.clientX, y0 = e.clientY;
    let timer = setTimeout(() => { timer = null; setEdit(true); }, 500);
    const cancel = ev => {
      if (ev.type !== 'pointerup' && Math.hypot(ev.clientX - x0, ev.clientY - y0) <= 8) return;
      clearTimeout(timer); document.removeEventListener('pointermove', cancel); document.removeEventListener('pointerup', cancel);
    };
    document.addEventListener('pointermove', cancel); document.addEventListener('pointerup', cancel);
  });
  d.querySelector('.cv-done').addEventListener('click', () => setEdit(false));

  const scaleOf = () => d.getBoundingClientRect().width / 402;
  // 編輯中拖小工具（HomeCanvasView.handleDrag：按住 .25 秒浮起、放大 1.06；拖到別的格子上就換位置）
  pager.addEventListener('pointerdown', e => {
    if (!root.classList.contains('edit')) return;
    const el = e.target.closest('.card'); if (!el) return;
    const pgs = PG.find(p => p.el.contains(el)); const me = pgs.packed.find(it => it.el === el); if (!me) return;
    const sx = e.clientX, sy = e.clientY, sc = scaleOf();
    const x0 = parseFloat(el.style.left), y0 = parseFloat(el.style.top);
    let armed = false;
    const arm = setTimeout(() => { armed = true; el.classList.remove('land'); el.classList.add('drag'); }, 250);
    const move = ev => {
      if (!armed) return;
      const dx = (ev.clientX - sx) / sc, dy = (ev.clientY - sy) / sc;
      el.style.left = x0 + dx + 'px'; el.style.top = y0 + dy + 'px';
      const px = x0 + dx + el.offsetWidth / 2, py = y0 + dy + el.offsetHeight / 2;
      const self = pgs.packed.find(it => it.el === el);
      const hit = pgs.packed.find(it => { if (it === self) return false; const [a, b, c, e2] = box(it); return px >= a && px <= c && py >= b && py <= e2; });
      if (hit) {
        const from = pgs.items.indexOf(self.src), to = pgs.items.indexOf(hit.src);
        pgs.items.splice(from, 1); pgs.items.splice(to, 0, self.src);
        reflow(pgs, el);
      }
    };
    const up = () => {
      clearTimeout(arm); document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up);
      if (!armed) return;
      el.classList.add('land'); el.classList.remove('drag');
      const { x, y } = slot(pgs.packed.find(it => it.el === el)); el.style.left = x + 'px'; el.style.top = y + 'px';
      setTimeout(() => el.classList.remove('land'), 320);
    };
    document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);
  });

  // 橫向拖曳換頁（跟手、放開吸附到最近的一頁：拖超過 80pt 或夠快就翻）
  let curPage = pageNo;
  const place = (n, dx = 0) => PG.forEach((pgs, i) => { pgs.el.style.left = `${(i - n) * 402 + dx}px`; });
  const goPage = n => { curPage = Math.max(0, Math.min(PG.length - 1, n)); place(curPage); d.querySelectorAll('.dots i').forEach((x, i) => x.classList.toggle('on', i === curPage)); };
  pager.addEventListener('pointerdown', e => {
    if (root.classList.contains('edit') && e.target.closest('.card')) return;
    const sx = e.clientX, sy = e.clientY, t0 = performance.now(), sc = scaleOf(); let dragging = false;
    const mv = ev => {
      const dx = (ev.clientX - sx) / sc, dy = (ev.clientY - sy) / sc;
      if (!dragging && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { dragging = true; pager.classList.add('drag'); }
      if (dragging) place(curPage, dx);
    };
    const upH = ev => {
      document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', upH);
      if (!dragging) return; pager.classList.remove('drag');
      const dx = (ev.clientX - sx) / sc, v = Math.abs(dx) / Math.max(1, performance.now() - t0);
      goPage(Math.abs(dx) > 80 || v > .4 ? curPage + (dx < 0 ? 1 : -1) : curPage);
    };
    document.addEventListener('pointermove', mv); document.addEventListener('pointerup', upH);
  });

  // 即時動態那一格：倒數每秒走（同鎖定畫面的 Countdown）
  if (cur) { let sec = 0; setInterval(() => { sec += 1; const n = d.querySelector('.la-n'); if (n) n.textContent = hms(cur.e2 * 60 - nowSec - sec); }, 1000); }

  // ── 給自動示範（autoplay 的 { call }）用的：鏡頭與解鎖。鏡頭＝整個畫面放大再平移（局部＋zoom in/out，不是縮小整支手機） ──
  const camTo = (fx, fy, k, ms = 700) => {
    const W = 402, H = 874, top = embed ? 54 : 0;
    const tx = Math.min(0, Math.max(W - W * k, W / 2 - k * fx)), ty = Math.min(0, Math.max(H - H * k, top + (H - top) / 2 - k * fy));
    d.style.transformOrigin = '0 0'; d.style.transition = `transform ${ms}ms cubic-bezier(.3,.7,.3,1)`;
    d.style.transform = k === 1 ? '' : `translate(${tx}px,${ty}px) scale(${k})`;
  };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  window.__auto = {
    zoomCover: async () => { camTo(170, 232, 1.25, 600); await wait(650); camTo(112, 262, 2.1, 650); await wait(700); },
    zoomOut: async () => { camTo(0, 0, 1); await wait(650); },
    zoomLive: async () => { const el = d.querySelector('.card.dark'); camTo(201, parseFloat(el.style.top) + canvasTop + el.offsetHeight / 2, 1.2, 700); await wait(800); },
    unlock: async () => { d.querySelectorAll('.veil').forEach(v => v.classList.add('off')); await wait(1100); },
  };
}

} else {
// ════════ 單張模式（?solo=<id>:<s|m|l>，官網示範用） ════════
// 只畫那一張卡，大小就是 402 寬畫布上的樣子（格 81.5、格距 12：小 175×175、中 362×175、大 362×362），放在左上 16、
// .device 剛好是卡片＋四周各 16（陰影 0 4 6 要有地方畫）；沒有封面、狀態列、分頁列、編輯角標，頁面與 .device 都是透明底。
const SOLO_CELLS = { s: [2, 2], m: [4, 2], l: [4, 4] }[soloSz] || [2, 2], SOLO_CELL = 81.5;
const sw = SOLO_CELLS[0] * SOLO_CELL + (SOLO_CELLS[0] - 1) * GAP, sh = SOLO_CELLS[1] * SOLO_CELL + (SOLO_CELLS[1] - 1) * GAP;
d.style.width = `${sw + 32}px`; d.style.height = `${sh + 32}px`;
document.body.style.width = d.style.width; document.body.style.height = d.style.height;
d.insertAdjacentHTML('beforeend', card({ id: soloId, sz: soloSz in SIZE ? soloSz : 's' }, { x: 16, y: 16, w: sw, h: sh }));
}
// 版面讓步，照 App（widget.html 同一份）：WidgetHead 放不下就只留標籤、檔名中間省略、底行放不下先縮字（SecondaryLine 的 minimumScaleFactor .6）
function fitNew(root) {
  root.querySelectorAll('.card.nw .wh').forEach(wh => { const tl = wh.querySelector(':scope > span.tail'), b = wh.querySelector('b'); if (tl && b && b.scrollWidth > b.clientWidth) tl.style.display = 'none'; });
  root.querySelectorAll('.card.nw .n-fr .nm[data-mid]').forEach(el => {
    const full = Array.from(el.textContent); if (el.scrollWidth <= el.clientWidth) return;
    let lo = 1, hi = full.length; const cut = k => { const a = Math.ceil(k / 2); return full.slice(0, a).join('') + '…' + full.slice(full.length - (k - a)).join(''); };
    while (lo < hi) { const k = Math.ceil((lo + hi) / 2); el.textContent = cut(k); if (el.scrollWidth <= el.clientWidth) lo = k; else hi = k - 1; }
    el.textContent = cut(lo);
  });
  // 放不下就從最後面拿掉可省的列（SwiftUI 是把字壓成更少行；這裡拿掉整段，不留半行）
  root.querySelectorAll('.card.nw .in').forEach(inn => { let g = inn.querySelectorAll('[data-trim]'), k = g.length; while (k > 1 && inn.scrollHeight > inn.clientHeight + 0.5) g[--k].remove(); });
  root.querySelectorAll('.card.nw .n-foot').forEach(el => { el.style.fontSize = ''; for (let s = 12; s > 7.2 && el.scrollWidth > el.clientWidth; s -= .2) el.style.fontSize = s + 'px'; });
}
if (d.querySelector('.card.nw')) { await document.fonts.ready; fitNew(d); }
if (!solo) {
chrome(d, { tab: 0 });
d.querySelector('.sb')?.classList.add('on-dark');   // 封面是深色：狀態列字白
}
ready();
</script>
</body>
</html>
