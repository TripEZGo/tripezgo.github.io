<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>privacy flow</title>
<!--
  引導頁第 8 頁（ADR-0050）：官網首頁「隱私與安全」的資料流向圖（index.html #privacy、assets/js/home.js 的 flow()、assets/css/home.css 的 .pf-*），
  標記與 CSS 照抄，只做三件事：①全開（iCloud 同步備份＋旅程共編的線都畫出來），下方兩個開關列拿掉 ②不能按、沒有自動輪播，傳輸線照官網一直流動 ③沒有卡片底與外框，直接放在頁面底色上。
  網址：privacy-flow.html?lang=<zh-Hant-TW|en|ja>&theme=<light|dark>&still=<0|1>。
  外層殼（demo.html）用 postMessage {type:'tz-auto-ctl', cmd:'pause'|'play'} 控制：長按暫停傳輸線，放開繼續。
-->
<style>
  :root {
    --page: #ffffff; --surface: #fbf8f4; --fg: #241d17; --muted: #7c6f63; --border: #dbd5cd;
    --border-soft: color-mix(in srgb, var(--border) 55%, var(--page));
    --sunken: color-mix(in srgb, var(--border) 28%, var(--surface));
    --accent: #2f918e; --accent-ink: #1d7370; --accent-wash: color-mix(in srgb, var(--accent) 12%, var(--page));
    --radius-md: 8px; --radius-lg: 12px; --radius-pill: 9999px;
    --text-xs: 12px; --text-sm: 13px;
    --shadow-sm: 0 1px 2px rgba(36,29,23,.08); --shadow-md: 0 6px 18px -8px rgba(36,29,23,.22);
    color-scheme: light;
  }
  html[data-theme="dark"] {
    --page: #17120f; --surface: #221c17; --fg: #f3ede5; --muted: #a2958a; --border: #382f27;
    --accent: #5cc6c3; --accent-ink: #7ad7d4;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow-md: 0 6px 18px -8px rgba(0,0,0,.6);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--fg); overflow: hidden;
    font-family: Inter, system-ui, -apple-system, "PingFang TC", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: flex; align-items: center; padding: 0 0; }
  html.hold .pf-flow { animation-play-state: paused; }
  html.still .pf-flow { animation: none; }
  .flow { width: 100%; max-width: 600px; margin-inline: auto; padding: 0; pointer-events: none; }

/* ─── 以下 CSS 照抄 home.css 的 .pf-*（動畫與互動樣式除外）─── */
.pf-card {
  container: pf / inline-size;
  background: none;            /* 草稿：圖區不要外框，官網那張卡片的底與框也拿掉，流向圖直接放在頁面底色上 */
  padding: clamp(16px, 4vw, 22px);
}
.pf-status { margin: 0 0 20px; font-size: 15px; font-weight: 600; line-height: 1.5; min-height: 1.5em; text-wrap: balance; }
.pf-stage {
  position: relative;
  display: grid; grid-template-columns: minmax(0, 1fr) auto;
  align-items: center; column-gap: clamp(40px, 11cqi, 68px);
}
.pf-wires { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 0; }
.pf-account {
  --account-bg: color-mix(in srgb, var(--page) 60%, var(--surface));
  position: relative;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--account-bg);
  padding: 18px 14px 14px;
  display: grid; grid-template-columns: auto auto; justify-content: space-between;
  align-items: center;
}
.pf-account-label {
  position: absolute; top: 0; left: 12px; transform: translateY(-50%);
  margin: 0; padding: 0 6px;
  font-size: var(--text-xs); color: var(--muted); letter-spacing: .04em; line-height: 1.4; white-space: nowrap;
  background: linear-gradient(var(--page) 50%, var(--account-bg) 50%);
}
.pf-devices { display: grid; row-gap: 14px; justify-items: center; }
.pf-node { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.pf-tile {
  width: 44px; height: 44px; border-radius: 13px;
  display: grid; place-items: center; flex: none;
  background: var(--page); color: var(--fg);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.pf-tile svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.pf-nm b { display: block; font-size: var(--text-sm); font-weight: 600; line-height: 1.3; white-space: nowrap; }
.pf-nm small { display: block; margin-top: 1px; font-size: var(--text-xs); color: var(--muted); line-height: 1.4; white-space: nowrap; }
.pf-phone .pf-tile {
  width: 54px; height: 54px; border-radius: 16px;
  background: var(--accent-wash); color: var(--accent-ink);
  border-color: color-mix(in srgb, var(--accent) 34%, var(--border));
  box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 7%, transparent), var(--shadow-sm);
}
.pf-phone .pf-tile svg { width: 26px; height: 26px; }
.pf-mates { display: grid; row-gap: 14px; }
.pf-mate { flex-direction: row; gap: 10px; text-align: start; }
.pf-mate .pf-tile {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--sunken); box-shadow: none;
  font-size: 14px; font-weight: 600; line-height: 1;
}
.pf-wire path { fill: none; }
.pf-wire .pf-track { stroke: color-mix(in srgb, var(--accent) 26%, var(--border)); stroke-width: 1.25; }
.pf-wire .pf-flow { stroke: var(--accent); stroke-width: 1.75; stroke-linecap: round; stroke-dasharray: 1.5 7; animation: pf-flow 1.1s linear infinite; }
@keyframes pf-flow { to { stroke-dashoffset: -17; } }
@media (prefers-reduced-motion: reduce) { .pf-wire .pf-flow { animation: none; } }
.pf-settings {
  list-style: none; margin: 18px 0 0; padding: 0;
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  background: var(--page); border: 1px solid var(--border); border-radius: var(--radius-md);
}
.pf-setting { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 12px; min-height: 60px; min-width: 0; }
.pf-setting + .pf-setting { border-left: 1px solid var(--border-soft); }
.pf-setting label { flex: 1; min-width: 0; }
.pf-setting b { display: block; font-size: 15px; font-weight: 600; line-height: 1.35; white-space: nowrap; }
.pf-setting span { display: block; margin-top: 1px; font-size: 12px; color: var(--muted); line-height: 1.45; }
.pf-sw { position: relative; flex: none; width: 51px; height: 31px; padding: 0; border: 0; border-radius: var(--radius-pill); background: var(--accent); }
.pf-sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
  box-shadow: 0 2px 4px rgba(0,0,0,.18), 0 0 0 .5px rgba(0,0,0,.06); transform: translateX(20px); }
@container pf (max-width: 379px) {
  .pf-stage { grid-template-columns: minmax(0, 1fr); row-gap: 40px; }
  .pf-mates { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .pf-mate { flex-direction: column; gap: 6px; text-align: center; }
  .pf-settings { grid-template-columns: minmax(0, 1fr); }
  .pf-setting + .pf-setting { border-left: 0; border-top: 1px solid var(--border-soft); }
  .pf-setting span { font-size: 13px; }
}
</style>
</head>
<body>
<div class="flow" id="flow"></div>
<script>
(function () {
  var theme = new URLSearchParams(location.search).get('theme') === 'dark' ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
  var el = document.getElementById('flow');
  var qs = new URLSearchParams(location.search), lang = qs.get('lang') || 'zh-Hant-TW';
  var FS = {
    'zh-Hant-TW': { account: '你的 Apple 帳號', me: '你的 iPhone', ipad: '你的 iPad', cloud: 'Apple iCloud', cloudOn: '備份與同步', mates: ['小美', '阿哲', 'Yuki'], shared: '經 iCloud 同步，並與 3 位旅伴共編。' },
    en: { account: 'Your Apple Account', me: 'Your iPhone', ipad: 'Your iPad', cloud: 'Apple iCloud', cloudOn: 'Backup & sync', mates: ['Mia', 'Ken', 'Yuki'], shared: 'Synced through iCloud, co-edited with 3 companions.' },
    ja: { account: 'あなたの Apple アカウント', me: 'あなたの iPhone', ipad: 'あなたの iPad', cloud: 'Apple iCloud', cloudOn: 'バックアップと同期', mates: ['ミカ', 'ケン', 'ユキ'], shared: 'iCloud で同期し、旅の仲間 3 人と共同編集。' }
  };
  var F = FS[lang] || FS.en;
  document.documentElement.lang = FS[lang] ? lang : 'en';
  if (qs.get('still') === '1') document.documentElement.classList.add('still');
  var ico = {
    phone: '<svg viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.8"/><path d="M10.5 5.2h3"/></svg>',
    ipad: '<svg viewBox="0 0 24 24"><rect x="4.5" y="2.5" width="15" height="19" rx="2.2"/><path d="M11 18.6h2"/></svg>',
    cloud: '<svg viewBox="0 0 24 24"><path d="M7.3 18.5h9.9a3.9 3.9 0 0 0 .5-7.77A5.6 5.6 0 0 0 6.9 11.6a3.45 3.45 0 0 0 .4 6.9z"/></svg>'
  };
  var wire = function (cls, edge) { return '<g class="pf-wire ' + cls + '" data-edge="' + edge + '"><path class="pf-track"/><path class="pf-flow"/></g>'; };
  el.innerHTML = '<div class="pf-card">' +
    '<p class="pf-status">' + F.shared + '</p>' +
    '<div class="pf-stage" data-sync="true" data-share="true">' +
      '<div class="pf-account"><p class="pf-account-label">' + F.account + '</p>' +
        '<div class="pf-devices">' +
          '<div class="pf-node pf-phone"><span class="pf-tile">' + ico.phone + '</span><span class="pf-nm"><b>' + F.me + '</b></span></div>' +
          '<div class="pf-node pf-ipad"><span class="pf-tile">' + ico.ipad + '</span><span class="pf-nm"><b>' + F.ipad + '</b></span></div>' +
        '</div>' +
        '<div class="pf-node pf-cloud"><span class="pf-tile">' + ico.cloud + '</span><span class="pf-nm"><b>' + F.cloud + '</b><small>' + F.cloudOn + '</small></span></div>' +
      '</div>' +
      '<div class="pf-mates">' + F.mates.map(function (n) { return '<div class="pf-node pf-mate"><span class="pf-tile">' + n.charAt(0) + '</span><span class="pf-nm"><b>' + n + '</b></span></div>'; }).join('') + '</div>' +
      '<svg class="pf-wires" aria-hidden="true">' + wire('a', 'phone') + wire('a', 'ipad') + wire('b', 'mate-1') + wire('b', 'mate-2') + wire('b', 'mate-3') + '</svg>' +
    '</div>' +
    '</div>';
  var stage = el.querySelector('.pf-stage'), GAP = 6;
  function box(n) { var r = n.getBoundingClientRect(), s = stage.getBoundingClientRect(); return { l: r.left - s.left, t: r.top - s.top, r: r.right - s.left, b: r.bottom - s.top, w: r.width, h: r.height }; }
  function pt(n, side) { var k = box(n); return side === 'left' ? [k.l - GAP, k.t + k.h / 2] : side === 'right' ? [k.r + GAP, k.t + k.h / 2] : side === 'top' ? [k.l + k.w / 2, k.t - GAP] : [k.l + k.w / 2, k.b + GAP]; }
  function hCurve(a, b) { var m = (a[0] + b[0]) / 2; return 'M' + a[0] + ' ' + a[1] + 'C' + m + ' ' + a[1] + ' ' + m + ' ' + b[1] + ' ' + b[0] + ' ' + b[1]; }
  function vCurve(a, b) { var m = (a[1] + b[1]) / 2; return 'M' + a[0] + ' ' + a[1] + 'C' + a[0] + ' ' + m + ' ' + b[0] + ' ' + m + ' ' + b[0] + ' ' + b[1]; }
  function draw(name, d) { stage.querySelectorAll('[data-edge="' + name + '"] path').forEach(function (p) { p.setAttribute('d', d); }); }
  function layout() {
    var cloud = el.querySelector('.pf-cloud'), cloudTile = cloud.querySelector('.pf-tile'), hub = pt(cloudTile, 'left');
    draw('phone', hCurve(pt(el.querySelector('.pf-phone .pf-tile'), 'right'), hub));
    draw('ipad', hCurve(hub, pt(el.querySelector('.pf-ipad .pf-tile'), 'right')));
    var below = box(el.querySelector('.pf-mates')).t > box(cloud).b;
    el.querySelectorAll('.pf-mate .pf-tile').forEach(function (t, i) { draw('mate-' + (i + 1), below ? vCurve(pt(cloud, 'bottom'), pt(t, 'top')) : hCurve(pt(cloudTile, 'right'), pt(t, 'left'))); });
  }
  layout(); new ResizeObserver(layout).observe(stage);
  // 長按暫停傳輸線、放開繼續：殼（demo.html）蓋在上面接手勢，再用 tz-auto-ctl 訊息通知這一頁。這一頁沒有「播完」，所以點一下不做事。
  addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type === 'tz-auto-ctl') document.documentElement.classList.toggle('hold', d.cmd === 'pause');
  });
  try { parent.postMessage({ type: 'tz-auto-hello' }, '*'); } catch (x) {}
})();
</script>
</body>
</html>
