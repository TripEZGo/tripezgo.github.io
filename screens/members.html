  .mb-tag { flex: none; font-size: var(--t-xs); color: var(--muted); }

    font: 600 var(--t-sm)/16px var(--font); color: var(--danger-ink); }

  .edge { position: absolute; left: 0; right: 0; top: 0; height: 118px; z-index: 4; pointer-events: none; opacity: 0; transition: opacity .15s;
    background: linear-gradient(#fff 55%, rgba(255,255,255,0)); }

  .bar i { position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 2px; background: var(--accent); animation: bar 1s linear infinite; }
  @keyframes bar { from { left: -40%; } to { left: 100%; } }
  /* 建立邀請連結（linkButton）：sunken 底、圖示 20、上下 8 左右 12、間距 10、標題 15 ＋ 說明 12 */
  .link-make { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 12px; background: var(--sunken);

  .lm-t { font-size: var(--t-base); line-height: 18px; color: var(--ink); }

  .scope .sw-row { padding-left: 0; padding-right: 0; }
  .scope .sw-row + .sw-row::before { left: 0; }
  /* ToastView：#1f1914 底、白字 13、內距 11/13/11/16、圖示 18 間距 9、膠囊；從底下推上來 */
  .toast { position: absolute; left: 24px; right: 24px; margin: 0 auto; width: fit-content; bottom: 50px; z-index: 60; display: flex; align-items: center; gap: 9px;
    padding: 11px 16px 11px 13px; border-radius: 99px; background: var(--n500); color: #fff; font: 400 var(--t-sm)/17px var(--font);

    });
  }
  // 點 QR 卡 → 全螢幕放大（InviteQRViewController：抬頭小字、旅程名、說明、260 的碼、底下「分享 QR Code 圖片」、右上關閉）
  async function showQR() {
    const { loadTrip } = await import('./chrome.js');
    const trip = await loadTrip();
    const w = document.createElement('div'); w.className = 'qrf';
    w.innerHTML = `<div class="qrf-x" data-tap><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></div>
      <div class="qrf-eb">${s.qrEyebrow}</div><div class="qrf-t">${fmt(trip.title)}</div><div class="qrf-d">${fmt(s.qrBigDetail)}</div>
      <div class="qrf-tile">${qr}</div>
      <div class="qrf-btn" data-tap><svg viewBox="0 0 24 24"><path d="M12 16V4M8 7.5l4-4 4 4M5 14v5q0 1 1 1h12q1 0 1-1v-5"/></svg>${s.qrShare}</div>`;
    d.append(w);
    requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add('on')));
    w.querySelector('.qrf-x').addEventListener('click', () => { w.classList.remove('on'); setTimeout(() => w.remove(), 300); });
    w.querySelector('.qrf-btn').addEventListener('click', () => shareSheet(st.url));
  }
}

chrome(d, ipad ? { tab: 0 } : duo ? { back: true } : {});   // iPad：頂端分頁列一直在，設定那一格亮著（擷取 06）
