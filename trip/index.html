<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<!-- 公開連結已停用（TripEZGo 1.10.0，票 35）：/trip/ 之下不論 # 後面是什麼，都只顯示這一句。
     不讀 CloudKit、不解密、不載任何別的 JS——CSP 的 default-src 是 'none'，想打網路也打不出去。
     行內 script 只用來挑語言（沒有 JS 時五種語言都顯示）；它的雜湊由 tools/stamp-csp.mjs 蓋。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-qct3AnPoOAAFCGqANKXFcKop+4A3OhgnPmqhO3c/4zY='; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="theme-color" content="#fbf8f4" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1f1914" media="(prefers-color-scheme: dark)" />
<title>這個連結已停用 — TripEZGo</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/icon-32.png" />
<link rel="apple-touch-icon" href="/assets/img/icon-180.png" />
<style>
  :root { --paper: #fbf8f4; --ink: #241d17; --taupe: #7c6f63; }
  @media (prefers-color-scheme: dark) { :root { --paper: #1f1914; --ink: #f3ece4; --taupe: #a89b8e; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center; padding: 24px;
    background: var(--paper); color: var(--ink); text-align: center;
    font: 17px/1.6 Inter, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial,
          "PingFang TC", "PingFang SC", "Hiragino Sans", "Apple SD Gothic Neo", "Noto Sans TC", "Noto Sans JP", sans-serif;
  }
  main { max-width: 28em; }
  h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
  h1:not([hidden]) ~ h1:not([hidden]) { margin-top: 12px; color: var(--taupe); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 lang="zh-Hant">這個連結已停用</h1>
  <h1 lang="en">This link has been disabled</h1>
  <h1 lang="ja">このリンクは無効になりました</h1>
  <h1 lang="ko">이 링크는 사용이 중지되었습니다</h1>
  <h1 lang="zh-Hans">这个链接已停用</h1>
</main>
<script>
(function () {
  var TITLE = { 'zh-Hant': '這個連結已停用', en: 'This link has been disabled', ja: 'このリンクは無効になりました', ko: '이 링크는 사용이 중지되었습니다', 'zh-Hans': '这个链接已停用' };
  var tag = (navigator.language || 'zh-Hant').toLowerCase();
  var key = tag.indexOf('ja') === 0 ? 'ja'
    : tag.indexOf('ko') === 0 ? 'ko'
    : tag.indexOf('zh') === 0 ? (/^zh-(cn|sg|hans)/.test(tag) ? 'zh-Hans' : 'zh-Hant')
    : 'en';
  var heads = document.querySelectorAll('h1');
  for (var i = 0; i < heads.length; i++) heads[i].hidden = heads[i].lang !== key;
  document.documentElement.lang = key;
  document.title = TITLE[key] + ' — TripEZGo';
})();
</script>
</body>
</html>
