<!doctype html>
<!-- 限時動態廣告圖（1080×1920）：首頁限時活動第 2 步的「Instagram」鈕把它分享到限時動態。
     tools/og/make.mjs 用 ?lang= 截圖成 assets/img/story-<lang>.png。
     上 220、下 300 是 Instagram 自己的頭像列與回覆框，不放字。不用表情符號（Threads／IG 會變亂碼，使用者 2026-10-24）。 -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --paper:#fbf8f4; --ink:#241d17; --teal:#2f918e; --teal-ink:#1d7370; --muted:#7c6f63; }
  html, body { margin:0; }
  body { width:1080px; height:1920px; overflow:hidden; background:var(--paper); position:relative;
    font-family:"PingFang TC","Hiragino Sans","Apple SD Gothic Neo",-apple-system,"Noto Sans TC",sans-serif; color:var(--ink); }
  body[data-lang="ja"] { font-family:"Hiragino Sans","Noto Sans JP",sans-serif; }
  body[data-lang="ko"] { font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif; word-break:keep-all; }
  body[data-lang="en"] { font-family:-apple-system,"SF Pro Display","Inter",sans-serif; }
  body::before, body::after { content:""; position:absolute; border-radius:50%; }
  body::before { width:1300px; height:1300px; left:-420px; top:620px; background:radial-gradient(closest-side, rgba(92,198,195,.26), transparent); }
  body::after { width:900px; height:900px; right:-360px; top:-160px; background:radial-gradient(closest-side, rgba(92,198,195,.18), transparent); }

  .top { position:absolute; left:84px; right:84px; top:236px; z-index:2; }
  .brand { display:flex; align-items:center; gap:18px; color:var(--teal); margin-bottom:44px; }
  .brand .mark { width:76px; height:70px; background:currentColor; -webkit-mask:url(../../assets/img/tripezgo-mark.svg) center/contain no-repeat; }
  .brand .word { width:230px; height:40px; background:var(--ink); -webkit-mask:url(../../assets/img/tripezgo-wordmark.svg) center/contain no-repeat; }
  h1 { margin:0 0 26px; font-size:92px; line-height:1.14; font-weight:700; letter-spacing:-.01em; }
  h1 em { font-style:normal; color:var(--teal); }
  body[data-lang="en"] h1 { font-size:84px; letter-spacing:-.03em; line-height:1.08; }
  body[data-lang="ja"] h1, body[data-lang="ko"] h1 { font-size:80px; }
  .sub { margin:0; font-size:36px; line-height:1.5; color:var(--muted); font-weight:500; }
  body[data-lang="en"] .sub { font-size:34px; }

  /* 三支手機：中間行事曆在前，兩側地圖、總覽退後壓低 */
  .phones { position:absolute; left:0; right:0; top:820px; height:660px; z-index:1; }
  .phone { position:absolute; border-radius:56px; background:#0b0b0c; padding:12px; box-sizing:border-box;
    box-shadow:0 0 0 2px #3a3a3c, 0 40px 80px -24px rgba(36,29,23,.45); overflow:hidden; }
  .phone img { width:100%; height:auto; border-radius:45px; display:block; }
  .phone.mid { width:360px; left:360px; top:0; z-index:2; }
  .phone.side { width:300px; top:90px; z-index:1; opacity:.97; }
  .phone.l { left:96px; transform:rotate(-6deg); }
  .phone.r { right:96px; transform:rotate(6deg); }

  /* 十大特色＋網址：手機下半段被這塊蓋住，下緣停在 IG 回覆框上面 */
  /* 由下往上排：網址釘在離底 260（IG 回覆框上面），特色標籤長在它上面，行數多也不會壓到網址 */
  .bottom { position:absolute; left:0; right:0; bottom:0; z-index:3; padding:150px 72px 260px;
    display:flex; flex-direction:column; align-items:center; gap:56px;
    background:linear-gradient(to bottom, rgba(251,248,244,0), var(--paper) 150px); }
  .feats { display:flex; flex-wrap:wrap; justify-content:center; gap:14px; }
  .feats span { padding:12px 24px; border-radius:999px; background:#fff; border:2px solid #dbd5cd;
    font-size:30px; font-weight:600; line-height:1.2; white-space:nowrap; }
  body[data-lang="en"] .feats span, body[data-lang="ja"] .feats span { font-size:28px; padding:11px 22px; }
  .url { display:flex; flex-direction:column; align-items:center; gap:14px; }
  .url b { display:inline-block; padding:20px 52px; border-radius:999px; background:var(--teal-ink); color:#fff;
    font-family:-apple-system,"SF Pro Display","Inter",sans-serif; font-size:52px; letter-spacing:.01em; }
  .url small { font-size:28px; color:var(--muted); font-weight:500; }
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><span class="mark"></span><span class="word"></span></div>
    <h1 id="h1"></h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="phones">
    <div class="phone side l"><img data-shot="map-place" alt=""></div>
    <div class="phone mid"><img data-shot="calendar" alt=""></div>
    <div class="phone side r"><img data-shot="overview" alt=""></div>
  </div>
  <div class="bottom">
    <div class="feats" id="feats"></div>
    <div class="url"><b>tripezgo.com</b><small id="dl"></small></div>
  </div>
<script>
  // 標題的 [ ] 是青綠色那一段；十大特色照廣告片的十個章節（官網首頁的順序）
  const COPY = {
    zh: ['旅行規劃、<br>旅途所需<br>[一次搞定]', '行事曆排行程、旅伴一起編，出發後也跟著你走。',
         ['免帳號・iCloud', '行事曆／時間軸', '靈感收集', '地圖路線', '票券・待辦', '路程提醒', '旅程總覽', '旅伴共編・位置共享', '即時動態・Widget', '筆記・QR・匯率'],
         'iPhone・iPad 免費下載'],
    en: ['Plan the trip,<br>carry what it needs —<br>[all in one app]', 'Plan on a calendar, edit with your travel companions, and take it with you.',
         ['No account, iCloud', 'Calendar & timeline', 'Ideas', 'Map routes', 'Tickets & to-dos', 'Travel-time alerts', 'Trip overview', 'Co-edit & share location', 'Live Activity & widgets', 'Notes, QR, currency'],
         'Free on iPhone and iPad'],
    ja: ['旅の計画も、<br>旅先で要るものも、<br>[これひとつで]', 'カレンダーで予定を組んで、旅の仲間と一緒に編集。出発したあとも、そのまま。',
         ['アカウント不要・iCloud', 'カレンダー／タイムライン', 'アイデア保存', 'マップのルート', '切符・やること', '移動時間のお知らせ', '旅の概要', '共同編集・位置の共有', 'ライブアクティビティ', 'メモ・QR・為替'],
         'iPhone・iPad 無料ダウンロード'],
    ko: ['여행 계획부터<br>여행길에 필요한 것까지,<br>[앱 하나로]', '캘린더로 일정을 짜고 동행과 함께 편집하고, 출발한 뒤에도 그대로.',
         ['계정 없음·iCloud', '캘린더/타임라인', '아이디어 저장', '지도 경로', '승차권·할 일', '이동 시간 알림', '여행 한눈에 보기', '공동 편집·위치 공유', '라이브 액티비티·위젯', '메모·QR·환율'],
         'iPhone·iPad 무료 다운로드'],
  };
  const lang = new URLSearchParams(location.search).get('lang') || 'zh';
  const [h1, sub, feats, dl] = COPY[lang];
  document.body.dataset.lang = lang;
  document.getElementById('h1').innerHTML = h1.replace(/\[([^\]]+)\]/, '<em>$1</em>');
  document.getElementById('sub').textContent = sub;
  document.getElementById('feats').innerHTML = feats.map((f) => `<span>${f}</span>`).join('');
  document.getElementById('dl').textContent = dl;
  const imgs = [...document.querySelectorAll('img[data-shot]')];
  Promise.all(imgs.map((img) => new Promise((ok) => { img.onload = ok; img.src = `../../assets/img/shots/v2/${lang}/${img.dataset.shot}.webp`; })))
    .then(() => document.fonts.ready).then(() => { document.documentElement.dataset.ready = '1'; });
</script>
</body>
</html>
